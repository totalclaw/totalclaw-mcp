name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  registry:
    name: 注册表一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install PyYAML
      # --strict：包版本未 pin 直接失败。不锁版本会让 npx 拉到不兼容的新版，
      # 或（如已修的 server-time）拉到根本不存在的包而挂到超时
      - name: gen_registry --check --strict
        run: python3 scripts/gen_registry.py --check --strict

      # 公钥还没提交时（C3.1 待办）跳过，不让 CI 因此变红；一旦 registry.pub
      # 进库就自动开始把关。签名不匹配必须失败 —— 分发通道的完整性靠这一步。
      - name: 验签（registry.pub 存在才跑）
        run: |
          if [ -f registry.pub ]; then
            pip install cryptography
            python3 scripts/sign_registry.py --verify
          else
            echo "registry.pub 尚未提交，跳过验签（见 docs/TODO.md C3.1）"
          fi

  servers:
    name: 自研服务器
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e servers pytest
      - name: pack 定义校验
        run: cd servers && python3 -m totalclaw_mcp_servers --check
      - name: 单元测试
        run: cd servers && python3 -m pytest tests -q
      - name: 清单与实现一致（生成后应无 diff）
        run: |
          python3 scripts/gen_manifests.py --force
          python3 scripts/gen_registry.py
          git diff --exit-code || {
            echo "::error::registry 清单与 servers/ 实现不一致，请本地跑 gen_manifests.py --force && gen_registry.py 后提交"
            exit 1
          }

  clean-install:
    name: 干净环境安装（wheel 真能跑起来）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # 只装 wheel、不装开发依赖 —— 依赖声明写松了（比如放行了不兼容的大版本）
      # 只有在这种干净环境里才会暴露；开发机上早就装着能用的版本，永远撞不到。
      - name: 构建并在干净 venv 里安装
        run: |
          pip install -q build
          python -m build --wheel --outdir dist_check servers
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist_check/*.whl
      - name: 校验 + 真实 MCP 握手
        run: |
          /tmp/clean/bin/totalclaw-mcp-server --check
          /tmp/clean/bin/python - <<'PY'
          import asyncio, os
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              p = StdioServerParameters(
                  command="/tmp/clean/bin/totalclaw-mcp-server",
                  args=["web"], env=dict(os.environ))
              async with stdio_client(p) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      tools = (await s.list_tools()).tools
                      assert tools, "list_tools 返回空"
                      print(f"握手成功，{len(tools)} 个工具")

          asyncio.run(main())
          PY

  acceptance:
    name: 端到端验收（V1–V7）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: totalclaw-mcp }
      # 验收要驱动 agent 的 CLI；agent 是私有仓，CI 里需要一个只读部署令牌
      - uses: actions/checkout@v4
        continue-on-error: true
        id: agent
        with:
          repository: jlzdyx/totalclaw-agent
          path: totalclaw-agent
          token: ${{ secrets.AGENT_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 跑验收
        if: steps.agent.outcome == 'success'
        run: |
          pip install -q -e totalclaw-agent
          pip install -q -e totalclaw-mcp/servers
          python3 totalclaw-mcp/scripts/acceptance.py --agent ../totalclaw-agent
        working-directory: .
      - name: 跳过说明
        if: steps.agent.outcome != 'success'
        run: echo "::warning::拿不到 agent 仓（需 AGENT_REPO_TOKEN），端到端验收已跳过"
