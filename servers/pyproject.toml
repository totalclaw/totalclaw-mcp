[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "totalclaw-mcp-servers"
version = "0.1.0"
description = "TotalClaw 自研 MCP 服务器集合：声明式 pack 引擎 + 原生服务器"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TotalClaw" }]
keywords = ["mcp", "model-context-protocol", "totalclaw", "connectors"]
dependencies = [
    # 上界不能省:mcp 2.0 重做了低层 Server API(没有 list_tools/call_tool 装饰器),
    # 我们的引擎按 1.x 的低层 API 写的。agent 自身跑的也是 1.x。
    # 这个 bug 只有干净安装才会现形 —— 开发环境早就装着 1.27,永远撞不到。
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "anyio>=4.0",
]

[project.scripts]
totalclaw-mcp-server = "totalclaw_mcp_servers.__main__:main"

[project.urls]
Homepage = "https://gitee.com/jlzdyx/totalclaw-mcp"

[tool.setuptools.packages.find]
include = ["totalclaw_mcp_servers*"]

[tool.setuptools.package-data]
totalclaw_mcp_servers = ["packs/*.yaml"]
