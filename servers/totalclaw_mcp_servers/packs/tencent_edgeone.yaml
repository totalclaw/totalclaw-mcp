name: tencent_edgeone
display_name: 腾讯云 EdgeOne
description: 查询与管理 EdgeOne 站点、加速域名，提交刷新与预热任务。
description_en: Query EdgeOne sites and acceleration domains; submit purge and prefetch tasks.
base_url: https://teo.tencentcloudapi.com
docs: https://cloud.tencent.com/document/product/1552/80731
auth:
  type: tencent_cloud
  service: teo
  version: "2022-09-01"
  secret_id_env: TENCENTCLOUD_SECRET_ID
  secret_key_env: TENCENTCLOUD_SECRET_KEY
  region_env: TENCENTCLOUD_REGION
defaults:
  timeout: 60

response:
  error_field: Response.Error.Code
  ok_value: "__never__"
  message_field: Response.Error.Message

tools:
  - name: list_zones
    description: >-
      查询 EdgeOne 站点列表，返回站点 ID、域名、状态、区域与加速开关。
      先用它拿 ZoneId，其他工具都要用。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeZones}
    body:
      Offset: "{offset}"
      Limit: "{limit}"
      Filters: "{filters}"
      Order: "{order}"
      Direction: "{direction}"
    pick: Response.Zones
    max_items: 100
    params:
      type: object
      properties:
        offset: {type: integer, description: "分页偏移，默认 0"}
        limit: {type: integer, description: "每页条数，默认 20，最大 100"}
        filters:
          type: array
          items: {type: object}
          description: >-
            过滤条件数组，形如 [{"Name":"zone-name","Values":["example.com"]}]；
            Name 可选 zone-name / zone-id / status / tag-key / tag-value
        order:
          type: string
          enum: [type, area, create-time, zone-name, use-time, active-status]
          description: 排序字段
        direction: {type: string, enum: [asc, desc], description: 排序方向}

  - name: list_acceleration_domains
    description: 查询站点下的加速域名及其源站配置与状态。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeAccelerationDomains}
    body:
      ZoneId: "{zone_id}"
      Offset: "{offset}"
      Limit: "{limit}"
      Filters: "{filters}"
    pick: Response.AccelerationDomains
    max_items: 100
    params:
      type: object
      properties:
        zone_id: {type: string, description: 站点 ID，来自 list_zones}
        offset: {type: integer, description: "分页偏移，默认 0"}
        limit: {type: integer, description: "每页条数，默认 20，最大 100"}
        filters: {type: array, items: {type: object}, description: 过滤条件数组}
      required: [zone_id]

  - name: list_purge_tasks
    description: 查询缓存刷新任务的历史与状态。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribePurgeTasks}
    body:
      ZoneId: "{zone_id}"
      StartTime: "{start_time}"
      EndTime: "{end_time}"
      Offset: "{offset}"
      Limit: "{limit}"
    pick: Response.Tasks
    max_items: 100
    params:
      type: object
      properties:
        zone_id: {type: string, description: 站点 ID}
        start_time: {type: string, description: "起始时间，ISO8601，如 2026-08-01T00:00:00Z"}
        end_time: {type: string, description: 结束时间，ISO8601}
        offset: {type: integer, description: 分页偏移}
        limit: {type: integer, description: "每页条数，最大 100"}

  - name: list_prefetch_tasks
    description: 查询缓存预热任务的历史与状态。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribePrefetchTasks}
    body:
      ZoneId: "{zone_id}"
      StartTime: "{start_time}"
      EndTime: "{end_time}"
      Offset: "{offset}"
      Limit: "{limit}"
    pick: Response.Tasks
    max_items: 100
    params:
      type: object
      properties:
        zone_id: {type: string, description: 站点 ID}
        start_time: {type: string, description: 起始时间，ISO8601}
        end_time: {type: string, description: 结束时间，ISO8601}
        offset: {type: integer, description: 分页偏移}
        limit: {type: integer, description: "每页条数，最大 100"}

  - name: create_purge_task
    description: >-
      提交缓存刷新任务。这会真实清除线上缓存，被刷新的资源下次访问将回源，
      短时间内源站压力上升。
    read_only: false
    method: POST
    path: /
    headers: {X-TC-Action: CreatePurgeTask}
    body:
      ZoneId: "{zone_id}"
      Type: "{type}"
      Targets: "{targets}"
      Method: "{method}"
    pick: Response
    params:
      type: object
      properties:
        zone_id: {type: string, description: 站点 ID}
        type:
          type: string
          enum: [purge_url, purge_prefix, purge_host, purge_all, purge_cache_tag]
          description: 刷新类型
        targets:
          type: array
          items: {type: string}
          description: "要刷新的目标列表；purge_all 时不用传"
        method: {type: string, enum: [invalidate, delete], description: "刷新方式，默认 invalidate"}
      required: [zone_id, type]

  - name: create_prefetch_task
    description: 提交缓存预热任务，把指定 URL 提前拉到边缘节点。这会产生回源流量。
    read_only: false
    method: POST
    path: /
    headers: {X-TC-Action: CreatePrefetchTask}
    body:
      ZoneId: "{zone_id}"
      Targets: "{targets}"
    pick: Response
    params:
      type: object
      properties:
        zone_id: {type: string, description: 站点 ID}
        targets: {type: array, items: {type: string}, description: 要预热的完整 URL 列表}
      required: [zone_id, targets]
