name: dingtalk
display_name: 钉钉
description: 查询钉钉通讯录与部门，发送工作通知，查询考勤与审批实例。
base_url: https://oapi.dingtalk.com
docs: https://open.dingtalk.com/document/orgapp/api-overview
auth:
  type: token_exchange
  token_url: https://oapi.dingtalk.com/gettoken
  token_method: GET
  token_query:
    appkey: ${DINGTALK_APP_KEY}
    appsecret: ${DINGTALK_APP_SECRET}
  token_pick: access_token
  expires_pick: expires_in
  place: query
  name: access_token
  requires_env: [DINGTALK_APP_KEY, DINGTALK_APP_SECRET]
defaults:
  timeout: 30

response:
  error_field: errcode
  ok_value: 0
  message_field: errmsg

tools:
  - name: list_departments
    description: 获取部门列表。默认从根部门开始。
    read_only: true
    method: POST
    path: /topapi/v2/department/listsub
    body: {dept_id: "{dept_id}"}
    pick: result
    max_items: 100
    params:
      type: object
      properties:
        dept_id: {type: integer, description: "父部门 ID，根部门为 1"}

  - name: list_department_users
    description: 获取部门下的成员详情列表。
    read_only: true
    method: POST
    path: /topapi/v2/user/list
    body: {dept_id: "{dept_id}", cursor: "{cursor}", size: "{size}"}
    pick: result
    params:
      type: object
      properties:
        dept_id: {type: integer, description: 部门 ID}
        cursor: {type: integer, description: "分页游标，首次传 0"}
        size: {type: integer, description: "每页条数，1-100，默认 20"}
      required: [dept_id]

  - name: get_user
    description: 获取单个成员的详细信息。
    read_only: true
    method: POST
    path: /topapi/v2/user/get
    body: {userid: "{userid}"}
    pick: result
    params:
      type: object
      properties:
        userid: {type: string, description: 成员的 userid}
      required: [userid]

  - name: get_userid_by_mobile
    description: 通过手机号查询成员 userid。
    read_only: true
    method: POST
    path: /topapi/v2/user/getbymobile
    body: {mobile: "{mobile}"}
    pick: result
    params:
      type: object
      properties:
        mobile: {type: string, description: 成员手机号}
      required: [mobile]

  - name: send_work_notification
    description: 发送工作通知给指定成员或部门。这会真实推送通知到钉钉。
    read_only: false
    method: POST
    path: /topapi/message/corpconversation/asyncsend_v2
    body:
      agent_id: "{agent_id}"
      userid_list: "{userid_list}"
      dept_id_list: "{dept_id_list}"
      to_all_user: false
      msg:
        msgtype: text
        text: {content: "{content}"}
    params:
      type: object
      properties:
        agent_id: {type: integer, description: 微应用的 AgentId}
        content: {type: string, description: 通知正文}
        userid_list: {type: string, description: 接收成员的 userid 列表，逗号分隔，最多 100 个}
        dept_id_list: {type: string, description: 接收部门 ID 列表，逗号分隔}
      required: [agent_id, content]

  - name: list_attendance_records
    description: 查询指定成员在某时间段内的考勤打卡结果。
    read_only: true
    method: POST
    path: /attendance/list
    body:
      workDateFrom: "{work_date_from}"
      workDateTo: "{work_date_to}"
      userIdList: "{userid_list}"
      offset: "{offset}"
      limit: "{limit}"
    pick: recordresult
    max_items: 50
    params:
      type: object
      properties:
        work_date_from: {type: string, description: "起始日期，格式 yyyy-MM-dd hh:mm:ss"}
        work_date_to: {type: string, description: "结束日期，格式 yyyy-MM-dd hh:mm:ss，与起始相隔不超过 7 天"}
        userid_list: {type: array, items: {type: string}, description: "成员 userid 列表，最多 50 个"}
        offset: {type: integer, description: "偏移量，首次传 0"}
        limit: {type: integer, description: "每页条数，最大 50"}
      required: [work_date_from, work_date_to, userid_list]

  - name: get_approval_instance
    description: 查询单个审批实例的详情（申请人、表单内容、审批流程与结果）。
    read_only: true
    method: POST
    path: /topapi/processinstance/get
    body: {process_instance_id: "{process_instance_id}"}
    pick: process_instance
    params:
      type: object
      properties:
        process_instance_id: {type: string, description: 审批实例 ID}
      required: [process_instance_id]

  - name: list_approval_instance_ids
    description: 按审批模板与时间范围查询审批实例 ID 列表。
    read_only: true
    method: POST
    path: /topapi/processinstance/listids
    body:
      process_code: "{process_code}"
      start_time: "{start_time}"
      end_time: "{end_time}"
      size: "{size}"
      cursor: "{cursor}"
    pick: result
    params:
      type: object
      properties:
        process_code: {type: string, description: 审批模板的 process_code}
        start_time: {type: integer, description: 起始时间的毫秒时间戳}
        end_time: {type: integer, description: 结束时间的毫秒时间戳}
        size: {type: integer, description: "每页条数，最大 20"}
        cursor: {type: integer, description: "分页游标，首次传 0"}
      required: [process_code, start_time]
