name: tianyancha
display_name: 天眼查
description: 查询企业工商登记、股东出资、主要人员、对外投资、变更记录与法律诉讼等公开企业数据。
description_en: Look up Chinese company registration, shareholders, staff, investments, changes and lawsuits via Tianyancha.
base_url: https://open.api.tianyancha.com/services/open
docs: https://open.tianyancha.com/
auth:
  # 天眼查开放平台把 token 直接放在 Authorization 头里（不带 Bearer 前缀）
  type: header
  name: Authorization
  env: TIANYANCHA_TOKEN
defaults:
  timeout: 30

response:
  error_field: error_code
  ok_value: 0
  message_field: reason

tools:
  - name: search_company
    description: >-
      按关键词搜索企业，返回公司名、类型、成立日期、经营状态与统一社会信用代码。
      拿到准确公司名后再用其他工具查详情。
    read_only: true
    method: GET
    path: /search/2.0
    query: {word: "{keyword}", pageNum: "{page_num}", pageSize: "{page_size}"}
    pick: result
    max_items: 20
    params:
      type: object
      properties:
        keyword: {type: string, description: 企业名称关键词}
        page_num: {type: integer, description: "页码，从 1 开始"}
        page_size: {type: integer, description: "每页条数，默认 20"}
      required: [keyword]

  - name: get_company_baseinfo
    description: 查询企业工商基本信息：类型、成立日期、经营状态、注册资本、法人、统一社会信用代码等。
    read_only: true
    method: GET
    path: /ic/baseinfo/2.0
    query: {keyword: "{keyword}"}
    pick: result
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
      required: [keyword]

  - name: get_company_contact
    description: 查询企业基本信息并含联系方式（电话、邮箱、网址）。
    read_only: true
    method: GET
    path: /ic/baseinfoV2/2.0
    query: {keyword: "{keyword}"}
    pick: result
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
      required: [keyword]

  - name: verify_company
    description: 企业三要素验证：核对企业名称、法人、注册号/信用代码三者是否一致。
    read_only: true
    method: GET
    path: /ic/verify/2.0
    query: {name: "{name}", legalPersonName: "{legal_person}", code: "{code}"}
    pick: result
    params:
      type: object
      properties:
        name: {type: string, description: 企业名称}
        legal_person: {type: string, description: 法定代表人姓名}
        code: {type: string, description: 注册号 / 组织机构代码 / 统一社会信用代码}
      required: [name]

  - name: get_shareholders
    description: 查询企业股东信息：股东名、出资比例、出资金额与股东总数。
    read_only: true
    method: GET
    path: /ic/holder/2.0
    query: {keyword: "{keyword}", pageNum: "{page_num}", pageSize: "{page_size}"}
    pick: result
    max_items: 50
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
        page_num: {type: integer, description: "页码，从 1 开始"}
        page_size: {type: integer, description: 每页条数}
      required: [keyword]

  - name: get_staff
    description: 查询企业主要人员（董事、监事、高管）的姓名与职位。
    read_only: true
    method: GET
    path: /ic/staff/2.0
    query: {keyword: "{keyword}", pageNum: "{page_num}", pageSize: "{page_size}"}
    pick: result
    max_items: 50
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
        page_num: {type: integer, description: "页码，从 1 开始"}
        page_size: {type: integer, description: 每页条数}
      required: [keyword]

  - name: get_investments
    description: 查询企业对外投资：被投资企业、法人、投资占比与投资总数。
    read_only: true
    method: GET
    path: /ic/inverst/2.0
    query: {keyword: "{keyword}", pageNum: "{page_num}", pageSize: "{page_size}"}
    pick: result
    max_items: 50
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
        page_num: {type: integer, description: "页码，从 1 开始"}
        page_size: {type: integer, description: 每页条数}
      required: [keyword]

  - name: get_change_records
    description: 查询企业工商变更记录：变更事项与变更前后信息。
    read_only: true
    method: GET
    path: /ic/changeinfo/2.0
    query: {keyword: "{keyword}", pageNum: "{page_num}", pageSize: "{page_size}"}
    pick: result
    max_items: 50
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
        page_num: {type: integer, description: "页码，从 1 开始"}
        page_size: {type: integer, description: 每页条数}
      required: [keyword]

  - name: get_lawsuits
    description: 查询企业法律诉讼：案号、案件名称、案由、涉案金额、案件身份与裁判结果。
    read_only: true
    method: GET
    path: /jr/lawSuit/3.0
    query: {keyword: "{keyword}", pageNum: "{page_num}", pageSize: "{page_size}"}
    pick: result
    max_items: 50
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
        page_num: {type: integer, description: "页码，从 1 开始"}
        page_size: {type: integer, description: 每页条数}
      required: [keyword]

  - name: get_annual_report
    description: 查询企业年报：基本信息、股东出资、资产状况与对外投资。
    read_only: true
    method: GET
    path: /ic/annualreport/2.0
    query: {keyword: "{keyword}"}
    pick: result
    params:
      type: object
      properties:
        keyword: {type: string, description: 公司全名或天眼查企业 ID}
      required: [keyword]
