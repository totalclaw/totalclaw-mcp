name: tencent_cloudbase
display_name: 腾讯云 CloudBase
description: 查询与管理腾讯云开发 CloudBase 的环境、云函数、数据库集合与静态托管。
description_en: Query and manage Tencent CloudBase environments, databases and static hosting.
base_url: https://tcb.tencentcloudapi.com
docs: https://cloud.tencent.com/document/product/876
auth:
  type: tencent_cloud
  service: tcb
  version: "2018-06-08"
  secret_id_env: TENCENTCLOUD_SECRET_ID
  secret_key_env: TENCENTCLOUD_SECRET_KEY
  region_env: TENCENTCLOUD_REGION
  region: ap-shanghai
defaults:
  timeout: 60

response:
  # 云 API 失败时是 HTTP 200 + Response.Error
  error_field: Response.Error.Code
  ok_value: "__never__"
  message_field: Response.Error.Message

tools:
  - name: list_environments
    description: 列出账号下的 CloudBase 环境，返回环境 ID、别名、状态与套餐。先用它拿 EnvId。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeEnvs}
    body: {EnvId: "{env_id}", IsVisible: "{is_visible}"}
    pick: Response.EnvList
    max_items: 50
    params:
      type: object
      properties:
        env_id: {type: string, description: 只查某个环境；不传则列出全部}
        is_visible: {type: boolean, description: 是否只返回可见环境}

  - name: get_env_usage
    description: 查询环境的资源用量（存储、CDN 流量、云函数调用次数等）。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeEnvFreeQuota}
    body: {EnvId: "{env_id}", ResourceTypes: "{resource_types}"}
    pick: Response
    params:
      type: object
      properties:
        env_id: {type: string, description: 环境 ID}
        resource_types: {type: array, items: {type: string}, description: 资源类型过滤，可选}
      required: [env_id]

  - name: list_database_collections
    description: 列出环境内的数据库集合（表）及其文档数与索引数。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeDatabaseACL}
    body: {EnvId: "{env_id}", CollectionName: "{collection_name}"}
    pick: Response
    params:
      type: object
      properties:
        env_id: {type: string, description: 环境 ID}
        collection_name: {type: string, description: 集合名}
      required: [env_id, collection_name]

  - name: describe_static_store
    description: 查询环境的静态网站托管信息（域名、状态、存储桶）。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeStaticStore}
    body: {EnvId: "{env_id}"}
    pick: Response
    params:
      type: object
      properties:
        env_id: {type: string, description: 环境 ID}
      required: [env_id]

  - name: describe_env_domains
    description: 查询环境绑定的安全域名列表。
    read_only: true
    method: POST
    path: /
    headers: {X-TC-Action: DescribeAuthDomains}
    body: {EnvId: "{env_id}"}
    pick: Response.Domains
    max_items: 100
    params:
      type: object
      properties:
        env_id: {type: string, description: 环境 ID}
      required: [env_id]
