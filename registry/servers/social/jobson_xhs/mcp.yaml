# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: jobson_xhs
display_name: xhs-mcp
display_name_en: xhs-mcp
version: 0.1.2
description: 小红书MCP服务器 - 提供小红书API功能的MCP工具
description_zh: 提供小红书 MCP 服务，包含 x-s / x-t 参数获取及 JS 逆向能力。
author: jobsonlook
license: MIT
homepage: https://github.com/jobsonlook/xhs-mcp
repository: https://github.com/jobsonlook/xhs-mcp
verified: true
category: social
tags:
- social
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - --from
  - jobson-xhs-mcp==0.1.1
  - xhs-mcp
  requires:
    python: '>=3.10'
requires_env:
- name: XHS_COOKIE
  description: xhs-mcp 的Cookie（XHS_COOKIE），获取方式见项目说明。
  prompt: 请输入 XHS_COOKIE
  secret: true
  required: true
  doc_url: https://github.com/jobsonlook/xhs-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
