# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: jobson_xhs
display_name: xhs-mcp
display_name_en: xhs-mcp
version: 0.1.0
description: 小红书MCP服务器 - 提供小红书API功能的MCP工具
description_zh: 提供小红书 MCP 服务，包含 x-s / x-t 参数获取及 JS 逆向能力。
author: jobsonlook
license: MIT
homepage: https://github.com/jobsonlook/xhs-mcp
repository: https://github.com/jobsonlook/xhs-mcp
verified: false
category: social
tags:
- social
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - jobson-xhs-mcp==0.1.1
  - xhs-mcp
  requires:
    python: '>=3.10'
requires_env:
- name: XHS_COOKIE
  description: xhs-mcp 的Cookie（XHS_COOKIE），获取方式见项目说明。
  prompt: 请输入 XHS_COOKIE
  secret: true
  required: true
  doc_url: https://github.com/jobsonlook/xhs-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
