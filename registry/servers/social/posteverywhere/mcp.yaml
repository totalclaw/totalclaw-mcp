# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：实探报缺凭据即退出，原先 requires_env 为空 —— 补必填 POSTEVERYWHERE_API_KEY（变量名取自包报错 / 源码）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: posteverywhere
display_name: PostEverywhere MCP
display_name_en: PostEverywhere MCP
version: 0.1.2
description: MCP server for PostEverywhere. Schedule and publish to 13 platforms (Instagram, TikTok, YouTube, LinkedIn, Facebook,
  X, Threads, Pinterest, Bluesky, Telegram, Discord, WordPress and Google Business Profile) from Claude, ChatGPT, Cursor,
  OpenAI Codex and o
description_zh: PostEverywhere 官方 MCP 服务器（33 个工具），让 AI Agent 将帖子定时发布到 Instagram、TikTok、YouTube、LinkedIn、X、Facebook、Threads、Pinterest、Bluesky、Telegram、Discord
  共 11 个平台，支持媒体上传、AI 配文与数据分析。
author: posteverywhere
license: MIT
homepage: https://github.com/posteverywhere/mcp
repository: https://github.com/posteverywhere/mcp
verified: true
category: social
tags:
- social
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@posteverywhere/mcp@1.14.2'
  requires:
    node: '>=18'
requires_env:
- name: POSTEVERYWHERE_API_KEY
  env_key: POSTEVERYWHERE_API_KEY
  description: PostEverywhere API Key（以 pe_live_ 开头）。未设置时服务器启动即退出。
  prompt: 请输入 POSTEVERYWHERE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/posteverywhere/mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
