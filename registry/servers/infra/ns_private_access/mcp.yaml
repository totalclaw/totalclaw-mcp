manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: ns_private_access
display_name: netskope-mcp
display_name_en: netskope-mcp
version: 0.1.1
description: MCP server for Netskope's Zero Trust Network Access Platform management through LLM's
description_zh: 提供对 Netskope Private Access 环境中所有组件的访问，包括详细设置信息和 LLM 使用示例。
author: johnneerdael
license: ISC
homepage: https://github.com/johnneerdael/netskope-mcp
repository: https://github.com/johnneerdael/netskope-mcp
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@johnneerdael/ns-private-access-mcp@6.3.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
