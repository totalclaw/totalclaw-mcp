# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: jshook
display_name: jshookmcp
display_name_en: jshookmcp
version: 0.1.0
description: MCP server with built-in tools across multiple domains for AI-assisted JavaScript analysis and security analysis
  — browser automation, CDP debugging, network monitoring, JS hooks, code analysis, and workflow orchestration
description_zh: 面向前端 / JavaScript 逆向的 MCP 工作区：运行时 Hook、网络拦截（含 TLS keylog）、bundle 反混淆、CDP 控制真实 Chrome、WASM 反汇编；735 工具 / 36
  域。search-first —— 只注入约 3K token 的工具摘要、按需激活域，避免 735 个 schema 撑爆上下文。
author: vmoranv
license: AGPL-3.0-only
homepage: https://github.com/vmoranv/jshookmcp
repository: https://github.com/vmoranv/jshookmcp
verified: false
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@jshookmcp/jshook@0.4.2'
  env:
    MCP_TOOL_PROFILE: search
    npm_config_omit: optional
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
