manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: terraform
display_name: terraform-mcp-server
display_name_en: terraform-mcp-server
version: 0.1.1
description: 'Terraform ecosystem integration: provider discovery, module analysis and Terraform Registry API access for infrastructure-as-code
  workflows.'
description_zh: HashiCorp 官方出品，让 AI 与 Terraform 生态（Registry、Provider/模块文档等）深度集成，辅助 IaC 开发。
author: hashicorp
homepage: https://github.com/hashicorp/terraform-mcp-server
repository: https://github.com/hashicorp/terraform-mcp-server
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://mcp.terraform.io/mcp
  auth: header
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
