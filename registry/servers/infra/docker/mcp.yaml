# 由 scripts/import_presets.py 生成；人工维护时请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: docker
display_name: Docker
display_name_en: Docker
version: 0.1.0
description: Docker MCP server.
description_zh: Docker 容器管理 — ps / images / run / stop / logs / exec / inspect / network / volume。LLM
  直接调度本地或远端 Docker daemon。
author: upstream
homepage: https://github.com/QuantGeekDev/docker-mcp
category: infra
tags:
- infra
- preset
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - docker-mcp==0.2.0
  env:
    DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
  requires:
    python: '>=3.10'
requires_env: []
optional_env:
- name: DOCKER_HOST
  env_key: DOCKER_HOST
  description: DOCKER_HOST for docker
  prompt: 请输入 DOCKER_HOST
  secret: false
  default: unix:///var/run/docker.sock
  required: false
defaults:
  enabled: true
  timeout: 120
