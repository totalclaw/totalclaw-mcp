manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: palisadeemail
display_name: Palisade
display_name_en: Palisade
version: 0.1.0
description: 'Local stdio bridge to the Palisade MCP server (email authentication: SPF, DKIM, DMARC, MTA-STS, BIMI).'
description_zh: Palisade 官方 MCP 服务器，让 AI 代理管理 DMARC、SPF、DKIM、BIMI、MTA-STS、DNS 记录、域名验证与邮件认证修复任务。
author: palisadeemail
license: MIT
homepage: https://github.com/palisadeemail/palisade-mcp
repository: https://github.com/palisadeemail/palisade-mcp
verified: false
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@palisadeemail/mcp@0.2.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
