# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: openosint
display_name: OpenOSINT
display_name_en: OpenOSINT
version: 0.1.1
description: AI-powered OSINT agent, MCP server, and CLI. Interactive REPL + 21 tools. Anthropic Claude or local Ollama. For
  authorized security research use only.
description_zh: AI 驱动的 OSINT 情报 Agent，19 个工具，提供交互式 REPL、MCP server 与 CLI 三种用法，兼容 Claude、GPT 等。
author: OpenOSINT
license: MIT
homepage: https://github.com/OpenOSINT/OpenOSINT
repository: https://github.com/OpenOSINT/OpenOSINT
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - openosint==2.36.1
  - openosint-mcp
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
