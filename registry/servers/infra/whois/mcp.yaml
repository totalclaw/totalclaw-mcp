# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: whois
display_name: Whois MCP
display_name_en: Whois MCP
version: 0.1.1
description: MCP to lookup whois information
description_zh: 对域名、IP、ASN 和 TLD 执行 whois 查询。
author: bharathvaj-ganesan
license: MIT
homepage: https://github.com/bharathvaj-ganesan/whois-mcp
repository: https://github.com/bharathvaj-ganesan/whois-mcp
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@bharathvaj/whois-mcp@1.0.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
