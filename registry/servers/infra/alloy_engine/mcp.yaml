manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: alloy_engine
display_name: Alloy
display_name_en: Alloy
version: 0.1.1
description: 'Alloy: a multi-material, parallel physics engine for robot learning, built on Newton and MuJoCo Warp (Python
  3.11 or 3.12)'
description_zh: 开源的机器人学习物理引擎，基于 MuJoCo Warp 与 Newton，可把机器人、布料、线缆、液体、沙子和软体放进同一个场景。内置 MCP 服务器（`alloy mcp`），让 AI 智能体无需编写 Python
  即可搭建场景、推进仿真、以 JSON 读取状态、渲染画面并检查仿真是否正常。
author: argonrobotics-ai
license: Apache-2.0
homepage: https://github.com/argonrobotics-ai/alloy
repository: https://github.com/argonrobotics-ai/alloy
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - alloy-engine==0.1.10
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
