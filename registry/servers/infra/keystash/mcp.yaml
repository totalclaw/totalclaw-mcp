manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: keystash
display_name: keystash
display_name_en: keystash
version: 0.1.0
description: 'Local secret broker for AI agents: values live in the macOS Keychain, only metadata stays on disk, and no tool
  ever returns a secret.'
description_zh: 本地单文件加密的密钥库，`keystash mcp` 把它变成 MCP 服务器：AI 能把密钥注入命令的环境变量、复制进剪贴板或生成新密钥，但始终看不到明文值；另有 `doctor` 扫描散落各处的明文密钥。
author: thu-lawyer
license: MIT
homepage: https://github.com/thu-lawyer/keystash
repository: https://github.com/thu-lawyer/keystash
verified: false
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - keystash==0.4.2
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
