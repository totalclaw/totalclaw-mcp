name: rad_security
display_name: mcp-server
display_name_en: mcp-server
version: 0.1.2
description: RAD Security MCP Server for AI-powered security insights
description_zh: RAD Security 的 MCP 服务器，为 Kubernetes 和云环境提供 AI 驱动的安全洞察。提供查询 Rad Security API 等工具。
