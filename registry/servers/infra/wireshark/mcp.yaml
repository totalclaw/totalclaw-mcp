manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: wireshark
display_name: Wireshark-MCP
display_name_en: Wireshark-MCP
version: 0.1.1
description: A Model Context Protocol (MCP) server for Wireshark / tshark packet analysis
description_zh: Wireshark 网络数据包分析 MCP 服务器，具有抓包、协议统计、字段提取和安全分析功能。
author: bx33661
license: MIT
homepage: https://github.com/bx33661/Wireshark-MCP
repository: https://github.com/bx33661/Wireshark-MCP
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - wireshark-mcp==4.0.0
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T08:21:42Z'
  probed_runtime: uvx
  count: 54
  file: tools.json
security:
  # 人工复核（2026-11-27）：工具描述注入扫描命中 1 处，判定误报 —— wireshark_detect_exfiltration 是检测外传流量的分析工具，描述是在说明检测对象。命中记录保留在 prompt_injection_findings。
  scan_verdict: allow
  osv: clean
  prompt_injection_findings:
  - tool: wireshark_detect_exfiltration
    pattern: 疑似外传数据
    excerpt: 'wireshark_detect_exfiltration
  
      [Anomaly] Detect data exfiltration (large outbound transfers, DNS l'
