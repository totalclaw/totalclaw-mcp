# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
# 2026-11-26：补齐启动必需的凭据 / 参数声明（以前写 requires_env: []，装上即报缺变量退出）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: adls2
display_name: adls-mcp-server
display_name_en: adls-mcp-server
version: 0.1.3
description: Azure Data Lake Storage Gen2 Model Context Protocol (MCP) service
description_zh: 用于 Azure Data Lake Storage 的 MCP 服务器。可管理容器、读/写/上传/下载文件及管理元数据。
author: erikhoward
license: MIT
homepage: https://github.com/erikhoward/adls-mcp-server
repository: https://github.com/erikhoward/adls-mcp-server
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - adls2-mcp-server==0.1.4
  requires:
    python: '>=3.10'
requires_env:
- name: AZURE_STORAGE_ACCOUNT_NAME
  description: Azure 存储账户名（启用了分层命名空间的 Data Lake Storage Gen2 账户）。
  prompt: 请输入 Azure 存储账户名
  secret: false
  required: true
  doc_url: https://github.com/erikhoward/adls-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env:
- name: AZURE_STORAGE_ACCOUNT_KEY
  description: 存储账户访问密钥；不填则用 Azure 默认凭据链（如 az login）。
  prompt: 请输入 Azure 存储账户密钥（可留空）
  secret: true
  required: false
  doc_url: https://github.com/erikhoward/adls-mcp-server
  doc_label: 查看项目说明（如何获取）
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
