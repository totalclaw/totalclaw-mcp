name: genieacs
display_name: genieacs-mcp
display_name_en: genieacs-mcp
version: 0.1.3
description: MCP server that bridges any GenieACS (TR-069 ACS) instance, exposing device data, firmware management, and CPE
  actions over JSON-RPC
description_zh: 面向开源 TR-069 ACS GenieACS 的 MCP 服务器：按标签、型号、固件或任意 TR-069 参数查询路由器、ONT 等 CPE 设备，读取参数、任务与故障，并可重启设备、下发固件、设置参数。
author: GeiserX
license: GPL-3.0-or-later
homepage: https://github.com/GeiserX/genieacs-mcp
repository: https://github.com/GeiserX/genieacs-mcp
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - genieacs-mcp@0.4.2
  requires:
    node: '>=18'
requires_env: []
optional_env:
- name: ACS_URL
