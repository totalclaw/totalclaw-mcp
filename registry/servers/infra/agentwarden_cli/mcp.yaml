manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: agentwarden_cli
display_name: AgentWarden
display_name_en: AgentWarden
version: 0.1.1
description: Zero-dependency static security gate, integrity lock and provenance SBOM for AI Agent Skills and MCP configurations
description_zh: AI Agent Skill、Tool 与 MCP 配置静态安全门禁，检测凭证泄露、危险命令、提示词注入与供应链风险，用 skills.lock 锁定完整性并验证 Ed25519 来源。输出脱敏 SARIF /
  CycloneDX 1.5 SBOM，支持 GitHub Actions CI 阻断。
author: juangh123
license: MIT
homepage: https://github.com/juangh123/AgentWarden
repository: https://github.com/juangh123/AgentWarden
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - agentwarden-cli@0.3.7
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
