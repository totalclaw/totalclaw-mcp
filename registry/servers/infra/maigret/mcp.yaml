# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：MAIGRET_REPORTS_DIR 不设置时启动即退出，从选填改为必填；去掉默认值 `$HOME/maigret-reports`（字面量，桌面端会原样预填）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: maigret
display_name: mcp-maigret
display_name_en: mcp-maigret
version: 0.1.3
description: MCP server that lets AI agents run maigret, an OSINT tool that searches a username across thousands of sites
description_zh: maigret MCP 服务器，强大的 OSINT 工具，从各种公共来源收集用户账户信息。提供跨社交网络搜索用户名和分析 URL 的工具。
author: BurtTheCoder
license: MIT
homepage: https://github.com/BurtTheCoder/mcp-maigret
repository: https://github.com/BurtTheCoder/mcp-maigret
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-maigret@1.0.22
  requires:
    node: '>=18'
requires_env:
- name: MAIGRET_REPORTS_DIR
  env_key: MAIGRET_REPORTS_DIR
  description: 保存查询报告的本机目录（绝对路径，需可写），如 /Users/你的用户名/maigret-reports。未设置时服务器启动即退出。
  prompt: 请输入报告保存目录
  secret: false
  required: true
  doc_url: https://github.com/BurtTheCoder/mcp-maigret
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:20Z'
  probed_runtime: npx
  count: 2
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
