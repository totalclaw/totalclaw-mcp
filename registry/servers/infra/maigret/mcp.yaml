# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: maigret
display_name: mcp-maigret
display_name_en: mcp-maigret
version: 0.1.1
description: MCP server that lets AI agents run maigret, an OSINT tool that searches a username across thousands of sites
description_zh: maigret MCP 服务器，强大的 OSINT 工具，从各种公共来源收集用户账户信息。提供跨社交网络搜索用户名和分析 URL 的工具。
author: BurtTheCoder
license: MIT
homepage: https://github.com/BurtTheCoder/mcp-maigret
repository: https://github.com/BurtTheCoder/mcp-maigret
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-maigret@1.0.17
  requires:
    node: '>=18'
requires_env: []
optional_env:
- name: MAIGRET_REPORTS_DIR
  description: mcp-maigret 的路径（MAIGRET_REPORTS_DIR），不填用默认值 $HOME/maigret-reports。
  prompt: 请输入 MAIGRET_REPORTS_DIR
  secret: false
  required: false
  doc_url: https://github.com/BurtTheCoder/mcp-maigret
  doc_label: 查看项目说明（如何获取）
  default: $HOME/maigret-reports
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
