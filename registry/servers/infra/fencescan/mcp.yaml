# 人工修改后请同步递增 version。
# 审核意见：周下载量很低（9）
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: fencescan
display_name: fencescan
display_name_en: fencescan
version: 0.1.1
description: Find tool calls that could fire the same effect twice. Reports evidence, renders no verdict. Zero dependencies.
description_zh: 扫描 MCP 服务器代码，找出重试后可能重复执行的工具调用（如重复扣款、重复发送）。只给出证据和候选项，不给判定——真正的判断需要读代码。零依赖，`npx fencescan` 直接运行。
author: aurumflux20
license: MIT
homepage: https://github.com/aurumflux20/fencescan
repository: https://github.com/aurumflux20/fencescan
verified: false
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - fencescan@0.1.4
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
