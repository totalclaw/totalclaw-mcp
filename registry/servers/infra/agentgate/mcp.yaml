# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: agentgate
display_name: AgentGate
display_name_en: AgentGate
version: 0.1.1
description: Scan, lock, and gate your MCP servers — npm audit + lockfile + CI drift gate for the MCP era
description_zh: MCP 服务器供应链安全门禁：安全扫描（工具投毒/凭证泄露/SSRF/RCE）+ 工具面锁文件（防 rug-pull）+ CI 漂移门禁（GitHub Action/pre-commit）+ 公开安全通报库，[含中文文档](https://github.com/wookat/agentgate/blob/main/README.zh-CN.md)。
author: wookat
license: Apache-2.0
homepage: https://github.com/wookat/agentgate
repository: https://github.com/wookat/agentgate
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-agentgate@0.67.61
  - scan
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
