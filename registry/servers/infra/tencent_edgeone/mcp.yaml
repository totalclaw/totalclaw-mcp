# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tencent_edgeone
display_name: 腾讯云 EdgeOne
display_name_en: Tencent EdgeOne
version: 0.1.0
description: Query EdgeOne sites and acceleration domains; submit purge and prefetch tasks.
description_zh: 查询与管理 EdgeOne 站点、加速域名，提交刷新与预热任务。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: infra
tags:
- totalclaw
- self-hosted
- 腾讯云
- edgeone
- cdn
- 加速
- 刷新预热
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - tencent_edgeone
  requires:
    python: '>=3.10'
requires_env:
- name: TENCENTCLOUD_SECRET_ID
  env_key: TENCENTCLOUD_SECRET_ID
  description: 腾讯云 EdgeOne 所需的 TENCENTCLOUD_SECRET_ID
  prompt: 请输入 TENCENTCLOUD_SECRET_ID
  secret: true
  required: true
- name: TENCENTCLOUD_SECRET_KEY
  env_key: TENCENTCLOUD_SECRET_KEY
  description: 腾讯云 EdgeOne 所需的 TENCENTCLOUD_SECRET_KEY
  prompt: 请输入 TENCENTCLOUD_SECRET_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 6
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
