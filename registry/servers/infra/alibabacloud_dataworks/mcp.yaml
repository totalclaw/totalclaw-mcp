# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: alibabacloud_dataworks
display_name: Alibaba Cloud DataWorks
display_name_en: Alibaba Cloud DataWorks
version: 0.1.1
description: 'DataWorks MCP Server: Export the DataWorks Open API to MCP Server, allowing clients that can run MCP Server
  to use DataWorks Open API through AI.'
description_zh: 阿里云 DataWorks 官方集成，通过标准化接口与 DataWorks Open API 进行 AI 交互，用于云资源操作。
author: aliyun
license: Apache-2.0
homepage: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
repository: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
verified: true
category: infra
tags:
- infra
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - alibabacloud-dataworks-mcp-server@1.0.45
  requires:
    node: '>=18'
requires_env:
- name: REGION
  description: Alibaba Cloud DataWorks 的配置项（REGION），获取方式见项目说明。
  prompt: 请输入 REGION
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: ALIBABA_CLOUD_ACCESS_KEY_ID
  description: Alibaba Cloud DataWorks 的ID（ALIBABA_CLOUD_ACCESS_KEY_ID），获取方式见项目说明。
  prompt: 请输入 ALIBABA_CLOUD_ACCESS_KEY_ID
  secret: true
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: ALIBABA_CLOUD_ACCESS_KEY_SECRET
  description: Alibaba Cloud DataWorks 的密钥（ALIBABA_CLOUD_ACCESS_KEY_SECRET），获取方式见项目说明。
  prompt: 请输入 ALIBABA_CLOUD_ACCESS_KEY_SECRET
  secret: true
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: TOOL_CATEGORIES
  description: Alibaba Cloud DataWorks 的配置项（TOOL_CATEGORIES），获取方式见项目说明。
  prompt: 请输入 TOOL_CATEGORIES
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: TOOL_NAMES
  description: Alibaba Cloud DataWorks 的配置项（TOOL_NAMES），获取方式见项目说明。
  prompt: 请输入 TOOL_NAMES
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-dataworks-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
