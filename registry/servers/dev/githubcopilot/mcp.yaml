# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: githubcopilot
display_name: github-mcp-server
display_name_en: github-mcp-server
version: 0.1.1
description: GitHub integration for repository management, pull requests, issues and more.
description_zh: GitHub 官方出品，让 AI 通过 API 深度集成 GitHub，实现自动化工作流等。
author: github
homepage: https://github.com/github/github-mcp-server
repository: https://github.com/github/github-mcp-server
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://api.githubcopilot.com/mcp/
  auth: oauth
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
