# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: yepcode
display_name: mcp-server-js
display_name_en: mcp-server-js
version: 0.1.1
description: MCP server for YepCode
description_zh: 在安全可扩展的沙盒环境中执行 LLM 生成的代码，并用 JS/Python 创建自定义 MCP 工具。
author: yepcode
license: MIT
homepage: https://github.com/yepcode/mcp-server-js
repository: https://github.com/yepcode/mcp-server-js
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@yepcode/mcp-server@1.6.0'
  requires:
    node: '>=18'
requires_env:
- name: YEPCODE_API_TOKEN
  description: mcp-server-js 的访问令牌（YEPCODE_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 YEPCODE_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/yepcode/mcp-server-js
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
