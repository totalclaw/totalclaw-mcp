# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: linear
display_name: Linear
display_name_en: Linear
version: 0.1.0
description: Query and manage Linear issues, projects, teams and cycles.
description_zh: 查询和管理 Linear 的 Issue、项目、团队与周期（Cycle）。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: dev
tags:
- totalclaw
- self-hosted
- issue
- 项目管理
- 研发协作
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - linear
  requires:
    python: '>=3.10'
requires_env:
- name: LINEAR_API_KEY
  env_key: LINEAR_API_KEY
  description: Linear 所需的 LINEAR_API_KEY
  prompt: 请输入 LINEAR_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 8
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
