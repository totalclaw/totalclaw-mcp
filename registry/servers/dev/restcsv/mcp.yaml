# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：警告（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 审核意见：周下载量很低（5）
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: restcsv
display_name: restcsv-mcp-server
display_name_en: restcsv-mcp-server
version: 0.1.1
description: MCP Server for RestCSV
description_zh: 用于 CSV 文件的 MCP 服务器。
author: JordanDalton
license: MIT
homepage: https://github.com/JordanDalton/RestCsvMcpServer
repository: https://github.com/JordanDalton/RestCsvMcpServer
verified: false
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - restcsv-mcp-server@1.0.1
  requires:
    node: '>=18'
requires_env:
- name: RESTCSV_API_KEY
  description: restcsv-mcp-server 的API 密钥（RESTCSV_API_KEY），获取方式见项目说明。
  prompt: 请输入 RESTCSV_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/JordanDalton/RestCsvMcpServer
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
