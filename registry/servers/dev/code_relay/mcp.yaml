name: code_relay
display_name: Code Relay
display_name_en: Code Relay
version: 0.1.0
description: Code Relay MCP server for branch-scoped, cross-machine verification.
description_zh: 面向编码代理的跨机器验证 MCP：通过分支绑定的 Runbook 在目标环境执行检查，并返回可审计的验证回执。
author: zarcherlot
license: MIT
homepage: https://github.com/zarcherlot/code-relay
repository: https://github.com/zarcherlot/code-relay
verified: false
category: dev
tags:
- dev
- community
