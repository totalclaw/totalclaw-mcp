# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-02 静态审核：通过（详见 docs/review-2026-11-02.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mem0
display_name: mem0-mcp
display_name_en: mem0-mcp
version: 0.1.2
description: Model Context Protocol server that exposes the Mem0 long-term memory API as tools
description_zh: 管理代码偏好和模式，支持语义搜索，方便在 IDE 中存取技术文档。 (Mem0 官方)
author: mem0ai
license: Apache-2.0
homepage: https://github.com/mem0ai/mem0-mcp
repository: https://github.com/mem0ai/mem0-mcp
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mem0-mcp-server==0.2.1
  requires:
    python: '>=3.10'
requires_env:
- name: MEM0_API_KEY
  description: mem0-mcp 的API 密钥（MEM0_API_KEY），获取方式见项目说明。
  prompt: 请输入 MEM0_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/mem0ai/mem0-mcp
  doc_label: 查看项目说明（如何获取）
- name: MEM0_DEFAULT_USER_ID
  description: mem0-mcp 的ID（MEM0_DEFAULT_USER_ID），获取方式见项目说明。
  prompt: 请输入 MEM0_DEFAULT_USER_ID
  secret: false
  required: true
  doc_url: https://github.com/mem0ai/mem0-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
