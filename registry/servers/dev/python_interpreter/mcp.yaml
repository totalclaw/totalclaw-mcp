manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: python_interpreter
display_name: mcp-python-interpreter
display_name_en: mcp-python-interpreter
version: 0.1.2
description: MCP server for Python code execution and environment management
description_zh: 安全、标准化的 Python 环境，支持代码执行、环境和包管理。
author: yzfly
license: MIT
homepage: https://github.com/yzfly/mcp-python-interpreter
repository: https://github.com/yzfly/mcp-python-interpreter
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - mcp-python-interpreter==1.2.3
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:30:37Z'
  probed_runtime: uvx
  count: 10
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
