# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: gitlab
display_name: GitLab
display_name_en: GitLab
version: 0.1.2
description: GitLab MCP server for projects, merge requests, issues, pipelines, wiki, releases, and more
description_zh: GitLab的MCP服务器，支持GitLab的读取和写入
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/@zereight/mcp-gitlab
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@zereight/mcp-gitlab@2.3.29'
  env:
    GITLAB_READ_ONLY_MODE: 'false'
    USE_GITLAB_WIKI: 'false'
    USE_MILESTONE: 'false'
    USE_PIPELINE: 'false'
  requires:
    node: '>=18'
requires_env:
- name: GITLAB_PERSONAL_ACCESS_TOKEN
  description: GitLab 的访问令牌（GITLAB_PERSONAL_ACCESS_TOKEN），获取方式见项目说明。
  prompt: 请输入 GITLAB_PERSONAL_ACCESS_TOKEN
  secret: true
  required: true
- name: GITLAB_API_URL
  description: GitLab 的服务地址（GITLAB_API_URL），获取方式见项目说明。
  prompt: 请输入 GITLAB_API_URL
  secret: false
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
