manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: jev_use
display_name: jev-use
display_name_en: jev-use
version: 0.1.2
description: Claude Code / Codex / pi plugin that hands the agent steps needing no text output to Jev (TypeSafe's judgment
  model) — measured p50 ~230 ms and ~$0.02 per 1,000 judgments, with typed escalation back to the LLM.
description_zh: 把 Claude Code / Codex / pi 里不需要输出文本的步骤交给 Jev 判断：构建好了吗、点哪个元素、这条命令安不安全，一次调用批量回答，需要写文本或拿不准的按类型化契约退回 LLM。
author: shitianfang
license: MIT
homepage: https://github.com/shitianfang/jev-use
repository: https://github.com/shitianfang/jev-use
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - jev-use@0.8.0
  - serve
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T10:15:06Z'
