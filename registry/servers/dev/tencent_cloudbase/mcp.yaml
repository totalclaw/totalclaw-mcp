# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tencent_cloudbase
display_name: 腾讯云 CloudBase
display_name_en: Tencent CloudBase
version: 0.1.0
description: Query and manage Tencent CloudBase environments, databases and static hosting.
description_zh: 查询与管理腾讯云开发 CloudBase 的环境、云函数、数据库集合与静态托管。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: dev
tags:
- totalclaw
- self-hosted
- 腾讯云
- 云开发
- cloudbase
- 小程序
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - tencent_cloudbase
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - git+https://gitee.com/jlzdyx/totalclaw-mcp.git@289d9c344390b7ac433a17095c85f413237fbf50#subdirectory=servers
  - totalclaw-mcp-server
  - tencent_cloudbase
  requires:
    python: '>=3.10'
    git: true
requires_env:
- name: TENCENTCLOUD_SECRET_ID
  env_key: TENCENTCLOUD_SECRET_ID
  description: 腾讯云 CloudBase 所需的 TENCENTCLOUD_SECRET_ID
  prompt: 请输入 TENCENTCLOUD_SECRET_ID
  secret: true
  required: true
- name: TENCENTCLOUD_SECRET_KEY
  env_key: TENCENTCLOUD_SECRET_KEY
  description: 腾讯云 CloudBase 所需的 TENCENTCLOUD_SECRET_KEY
  prompt: 请输入 TENCENTCLOUD_SECRET_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 5
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
