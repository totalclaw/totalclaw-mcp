# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：警告（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 审核意见：源码仓库 github.com/yourusername/bugsnag-mcp 访问不到（404）；条目写的仓库 tgeselle/bugsnag-mcp 与包元数据里的仓库 yourusername/bugsnag-mcp 不一致；仓库 yourusername/bugsnag-mcp 的清单文件和 README 里都找不到包名 bugsnag-mcp-server，无法确认包出自此仓库；没有找到开源许可证声明
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: bugsnag
display_name: bugsnag-mcp
display_name_en: bugsnag-mcp
version: 0.1.1
description: A Bugsnag MCP server for interacting with Bugsnag API
description_zh: 用于与 Bugsnag 交互的 MCP 服务器。
author: tgeselle
homepage: https://github.com/tgeselle/bugsnag-mcp
repository: https://github.com/tgeselle/bugsnag-mcp
verified: false
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - bugsnag-mcp-server@1.1.0
  requires:
    node: '>=18'
requires_env:
- name: BUGSNAG_API_KEY
  description: bugsnag-mcp 的API 密钥（BUGSNAG_API_KEY），获取方式见项目说明。
  prompt: 请输入 BUGSNAG_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/tgeselle/bugsnag-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
