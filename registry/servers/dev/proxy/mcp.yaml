# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: proxy
display_name: JetBrains IDE Proxy
display_name_en: JetBrains IDE Proxy
version: 0.1.1
description: A MCP proxy to redirect requests to JetBrains IDEs
description_zh: JetBrains 官方代理，连接到 JetBrains IDE。
author: JetBrains
license: Apache-2.0
homepage: https://github.com/JetBrains/mcpProxy
repository: https://github.com/JetBrains/mcpProxy
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@jetbrains/mcp-proxy@1.8.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
