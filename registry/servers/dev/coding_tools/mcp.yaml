# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: coding_tools
display_name: Coding Tools MCP
display_name_en: Coding Tools MCP
version: 0.1.1
description: Workspace-confined coding tools exposed as an MCP server.
description_zh: 模型中立的编码运行时，通过 MCP 给任意 AI 聊天或 Agent 一双「安全的手」操作代码库。
author: xyTom
license: Apache-2.0
homepage: https://github.com/xyTom/coding-tools-mcp
repository: https://github.com/xyTom/coding-tools-mcp
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - coding-tools-mcp==0.5.0
  - --stdio
  - --workspace
  - ${MCP_CODING_TOOLS_WORKSPACE}
  requires:
    python: '>=3.10'
requires_env:
- name: WORKSPACE
  env_key: MCP_CODING_TOOLS_WORKSPACE
  description: Coding Tools MCP 的启动参数（--workspace），示例：/path/to/repo
  prompt: 请输入 WORKSPACE
  secret: false
  required: true
  doc_url: https://github.com/xyTom/coding-tools-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
