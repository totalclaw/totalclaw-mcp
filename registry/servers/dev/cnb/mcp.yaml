# 人工维护。官方包 @cnbcool/mcp-server，仓库在 CNB 自家平台
# https://cnb.cool/cnb/tools/cnb-mcp-server（MIT）。
#
# 这条是补上来的：此前 TODO 里 cnb-api 记的是「OpenAPI 端点 401，规范需登录」——
# 那是走 REST 自研 pack 那条路走不通，但厂商自己发了 MCP server，直接接就行。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: cnb
display_name: CNB 云原生构建
version: 0.1.0
description: Access the CNB platform — repositories, issues, pull requests, pipelines, cloud-native
  workspaces and knowledge bases.
description_zh: 访问 CNB 平台：代码仓库、Issue、合并请求、流水线、云原生开发环境与知识库。
author: vendor
homepage: https://cnb.cool/cnb/tools/cnb-mcp-server
category: dev
tags:
- dev
- vendor
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - -p
  - '@cnbcool/mcp-server@0.6.7'
  - cnb-mcp-stdio
  env:
    API_TOKEN: ${MCP_CNB_API_TOKEN}
    API_BASE_URL: ${MCP_CNB_API_BASE_URL}
  requires:
    node: '>=18'
requires_env:
# 上游变量名就叫 API_TOKEN —— 太通用了，几个 server 共用一份 .env 会互相覆盖，
# 所以这里显式命名空间化成 MCP_CNB_API_TOKEN，再在 runtime 里映射回上游要的名字。
- name: API_TOKEN
  env_key: MCP_CNB_API_TOKEN
  description: CNB 平台的访问令牌（个人设置里生成）
  prompt: 请输入 CNB 访问令牌
  secret: true
  required: true
optional_env:
- name: API_BASE_URL
  env_key: MCP_CNB_API_BASE_URL
  description: API 地址，私有化部署才需要改；默认 https://api.cnb.cool
  prompt: 请输入 CNB API 地址（留空用默认）
  secret: false
  required: false
  default: https://api.cnb.cool
defaults:
  enabled: true
  timeout: 60
security:
  # 没有令牌连不上，探不到工具列表也就扫不了注入。
  # 有令牌的环境里：export MCP_CNB_API_TOKEN=… && python3 scripts/probe_server.py cnb
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
notes: |
  包里还有第二个 bin `cnb-mcp-streamable`，是在本机起一个 streamable-HTTP 端口
  给跨进程用的，不是厂商的远程端点。装到 agent 里走 stdio 更直接，所以这里只落了它。
