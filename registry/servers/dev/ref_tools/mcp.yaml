name: ref_tools
display_name: ref-tools-mcp
display_name_en: ref-tools-mcp
version: 0.1.1
description: ModelContextProtocol server for Ref
description_zh: 为编程代理提供公共/私有库的文档检索，减少调用陌生 API 时的幻觉并节省上下文窗口。
author: ref-tools
license: MIT
