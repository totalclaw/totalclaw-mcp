# 人工修改后请同步递增 version。
# 2026-11-27：不带参数即 MCP 模式，但 MCP 依赖在 [mcp] extra，不带会报「MCP dependencies are not installed」。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: semble
display_name: Semble
display_name_en: Semble
version: 0.1.3
description: Fast and Accurate Code Search for Agents
description_zh: 面向 Agent 的语义代码搜索：号称比 grep + 逐个读文件少用 99% token，为编码 Agent 快速定位相关代码。
author: MinishLab
license: MIT
homepage: https://github.com/MinishLab/semble
repository: https://github.com/MinishLab/semble
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - semble[mcp]==0.7.3
  - semble
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T10:16:15Z'
  probed_runtime: uvx
  count: 2
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
