name: mobilebuildmcp
display_name: XcodeBuildMCP
display_name_en: XcodeBuildMCP
version: 0.1.1
description: MobileBuildMCP is a Model Context Protocol server that provides tools for Xcode project management, simulator
  management, and app utilities.
description_zh: 面向 iOS/macOS 开发的 MCP 服务器与 CLI，为 AI 代理提供 Xcode 项目构建、运行、模拟器管理与日志捕获等工具，打通 Apple 平台开发工作流。
author: getsentry
license: MIT
homepage: https://github.com/getsentry/XcodeBuildMCP
repository: https://github.com/getsentry/XcodeBuildMCP
verified: false
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mobilebuildmcp@2.7.1
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
