  launcher: npx
  command: npx
  args:
  - -y
  - '@wonderwhy-er/desktop-commander@0.3.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
