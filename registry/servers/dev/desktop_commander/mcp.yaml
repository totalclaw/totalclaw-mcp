# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: desktop_commander
display_name: DesktopCommanderMCP
display_name_en: DesktopCommanderMCP
version: 0.1.6
description: MCP server for terminal operations and file editing
description_zh: 增强的文件系统和搜索工具，以及特定于编码的命令和提示。(也含命令行功能)
author: wonderwhy-er
license: MIT
homepage: https://github.com/wonderwhy-er/DesktopCommanderMCP
repository: https://github.com/wonderwhy-er/DesktopCommanderMCP
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@wonderwhy-er/desktop-commander@0.3.4'
  env:
    DESKTOP_COMMANDER_DISABLE_TELEMETRY: '1'
    npm_config_ignore_scripts: 'true'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
  # 关遥测：已装的老用户也由桌面端 MCP 医生 / agent mcp_hub 按这里补上（与 runtimes[].env 保持一致）
  # npm_config_ignore_scripts：包的 postinstall（dist/track-installation.js）会上报一次安装事件且不认上面的开关，
  # 让 npx 安装时不跑任何安装脚本。依赖里的 @vscode/ripgrep、sharp 已改用按平台分发的预编译包，不靠安装脚本（2026-11-26 实测）。
  enforced_env:
    DESKTOP_COMMANDER_DISABLE_TELEMETRY: '1'
    npm_config_ignore_scripts: 'true'
  prompt_injection_findings: []
tools:
  probed_at: '2026-11-27T03:19:42Z'
  probed_runtime: npx
  count: 25
  file: tools.json
