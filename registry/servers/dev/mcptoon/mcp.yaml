manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mcptoon
display_name: mcptoon
display_name_en: mcptoon
version: 0.1.1
description: 'One zero-dependency CLI to manage every MCP server and agent skill: token optimization for tool discovery (71,929
  -> 581 tokens, -99.2% measured, schemas stay out of context), one config for every agent.'
description_zh: 零依赖的 MCP 客户端 CLI：自动发现并接管机器上的 MCP server，把上百个工具的清单压缩成 agent 友好的紧凑格式（工具发现 token 省 99.2%，tiktoken 实测）；`mcptoon
  serve` 让一个 Agent 直连上百个 server，`sync` 把统一配置分发到 Claude/Codex/Cursor 等 agent，`health` 可检出僵尸 server。已上架 MCP Registry 与 numtide/llm-agents.nix。
author: activeing123
license: Apache-2.0
homepage: https://github.com/activeing123/mcptoon
repository: https://github.com/activeing123/mcptoon
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcptoon==0.8.31
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
