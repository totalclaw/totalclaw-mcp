# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: shadcn_ui
display_name: shadcn-ui-mcp-server
display_name_en: shadcn-ui-mcp-server
version: 0.1.0
description: A Model Context Protocol (MCP) server for shadcn/ui components, providing AI assistants with access to component
  source code, demos, blocks, and metadata.
description_zh: 让 LLM 获取 shadcn/ui 组件的结构、用法与源码上下文，生成组件代码时不再靠猜 API。
author: Jpisnice
license: MIT
homepage: https://github.com/Jpisnice/shadcn-ui-mcp-server
repository: https://github.com/Jpisnice/shadcn-ui-mcp-server
verified: false
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@jpisnice/shadcn-ui-mcp-server@3.0.0'
  - --github-api-key
  - ${MCP_SHADCN_UI_GITHUB_API_KEY}
  requires:
    node: '>=18'
requires_env:
- name: GITHUB_API_KEY
  env_key: MCP_SHADCN_UI_GITHUB_API_KEY
  description: shadcn-ui-mcp-server 的启动参数（--github-api-key），示例：YOUR_TOKEN
  prompt: 请输入 GITHUB_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/Jpisnice/shadcn-ui-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
