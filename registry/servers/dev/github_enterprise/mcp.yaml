# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-02 静态审核：通过（详见 docs/review-2026-11-02.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: github_enterprise
display_name: github-enterprise-mcp
display_name_en: github-enterprise-mcp
version: 0.1.2
description: MCP server for GitHub Enterprise API integration with Cursor, enabling AI access to repositories, issues, PRs
  and workflows
description_zh: 用于 GitHub Enterprise API 集成的 MCP 服务器。
author: ddukbg
license: ISC
homepage: https://github.com/ddukbg/github-enterprise-mcp
repository: https://github.com/ddukbg/github-enterprise-mcp
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@ddukbg/github-enterprise-mcp@1.3.0'
  - --token=${MCP_GITHUB_ENTERPRISE_TOKEN}
  - --github-enterprise-url=${MCP_GITHUB_ENTERPRISE_GITHUB_ENTERPRISE_URL}
  requires:
    node: '>=18'
requires_env:
- name: TOKEN
  env_key: MCP_GITHUB_ENTERPRISE_TOKEN
  description: github-enterprise-mcp 启动参数 --token 的值，见项目说明。
  prompt: 请输入 TOKEN
  secret: true
  required: true
  doc_url: https://github.com/ddukbg/github-enterprise-mcp
  doc_label: 查看项目说明（如何获取）
- name: GITHUB_ENTERPRISE_URL
  env_key: MCP_GITHUB_ENTERPRISE_GITHUB_ENTERPRISE_URL
  description: github-enterprise-mcp 启动参数 --github-enterprise-url 的值，见项目说明。
  prompt: 请输入 GITHUB_ENTERPRISE_URL
  secret: false
  required: true
  doc_url: https://github.com/ddukbg/github-enterprise-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
