# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: gitee_oschina
display_name: Gitee
display_name_en: Gitee
version: 0.1.1
description: Model Context Protocol (MCP) server for Gitee
description_zh: Gitee 官方集成，管理 Gitee 仓库、Issues 和 Pull Requests。
author: oschina
license: MIT
homepage: https://github.com/oschina/mcp-gitee
repository: https://github.com/oschina/mcp-gitee
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@gitee/mcp-gitee@1.0.0'
  env:
    GITEE_API_BASE: https://gitee.com/api/v5
  requires:
    node: '>=18'
requires_env:
- name: GITEE_ACCESS_TOKEN
  description: Gitee 的访问令牌（GITEE_ACCESS_TOKEN），获取方式见项目说明。
  prompt: 请输入 GITEE_ACCESS_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/oschina/mcp-gitee
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
