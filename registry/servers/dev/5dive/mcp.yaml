# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: 5dive
display_name: 5dive MCP
display_name_en: 5dive MCP
version: 0.1.1
description: Model Context Protocol server for 5dive, over stdio or Streamable HTTP. Exposes the 5dive agent-fleet CLI (tasks,
  agents, digest) as MCP tools, locally or to a remote client such as ChatGPT.
description_zh: 5dive 官方 MCP 服务器，把 5dive 智能体舰队 CLI（任务、智能体、摘要）暴露为 MCP 工具，让 MCP 客户端直接调度运行在你自己服务器上的多个自治编码智能体。
author: 5dive-ai
license: MIT
homepage: https://github.com/5dive-ai/5dive-mcp
repository: https://github.com/5dive-ai/5dive-mcp
verified: true
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@5dive/mcp@0.2.0'
  env:
    FIVEDIVE_SUDO: '1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T08:04:17Z'
  probed_runtime: npx
  count: 6
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
