# 参考范例：多运行时 + 精确 pin + env_key 兼容 + 工具排除。
# name 保持与 agent preset 一致（mcp_github），既有用户配置与 .env 零迁移。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mcp_github
display_name: GitHub
version: 2025.4.8
description: GitHub REST API integration — repos, issues, PRs, commits, search, releases, branches, forks (~30 tools).
description_zh: GitHub REST API 集成 — 仓库 / issue / PR / commit / search / release / branch / fork，约 30 个工具。
author: modelcontextprotocol
license: MIT
homepage: https://github.com/modelcontextprotocol/servers-archived/tree/main/src/github
repository: https://github.com/modelcontextprotocol/servers-archived
category: dev
tags: [dev, git, github, issues, pull-requests, preset]
kind: mcp_server
platforms: [darwin, linux, win32]

runtimes:
  # 1) 本地 stdio：npx 精确 pin
  - id: npx
    type: stdio
    launcher: npx
    command: npx
    args: ["-y", "@modelcontextprotocol/server-github@2025.4.8"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    requires: { node: ">=18" }
  # 2) 官方远程 streamable-HTTP（GitHub 托管），Bearer = PAT
  - id: remote
    type: http
    url: https://api.githubcopilot.com/mcp/
    auth: header
  # 3) 平台托管（M3 启用；{org} 由安装器按 TOTALCLAW_MCP_ORG 替换）
  - id: hosted
    type: http
    hosted: true
    url: https://mcp.taituai.com/g/{org}/mcp_github/mcp
    auth: header

requires_env:
  - name: GITHUB_PERSONAL_ACCESS_TOKEN
    env_key: GITHUB_PERSONAL_ACCESS_TOKEN      # 保留上游变量名，兼容既有 .env
    description: GitHub Personal Access Token (repo / read:org scope)
    prompt: 请输入 GitHub Personal Access Token
    secret: true
    required: true
    runtimes: [npx, remote]                     # hosted 运行时由平台侧注入，不需要本地凭据
    validate: "^(ghp_|github_pat_)"
optional_env: []

defaults:
  enabled: true
  timeout: 1800
  connect_timeout: 60
  tools:
    exclude: [delete_repository]               # 原始工具名；过滤发生在加 mcp__ 前缀之前
    resources: true
    prompts: false
  supports_parallel_tool_calls: false
