manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: text_editor
display_name: mcp-text-editor
display_name_en: mcp-text-editor
version: 0.1.1
description: MCP Text Editor Server - Edit text files via MCP protocol
description_zh: 面向行的文本文件编辑器。针对 LLM 工具优化，通过高效的部分文件访问最小化 Token 使用。
author: tumf
license: MIT
homepage: https://github.com/tumf/mcp-text-editor
repository: https://github.com/tumf/mcp-text-editor
verified: true
category: dev
