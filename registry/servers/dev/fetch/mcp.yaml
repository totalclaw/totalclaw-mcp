manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: fetch
display_name: fetch-mcp
display_name_en: fetch-mcp
version: 0.1.0
description: MCP server and CLI for fetching web content as HTML, Markdown, plain text, JSON, or YouTube transcripts
description_zh: 灵活获取 JSON、文本和 HTML 数据的 MCP 服务器。
author: zcaceres
license: MIT
homepage: https://github.com/zcaceres/fetch-mcp
repository: https://github.com/zcaceres/fetch-mcp
verified: false
category: dev
tags:
- dev
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-fetch-server@1.1.2
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
