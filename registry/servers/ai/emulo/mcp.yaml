# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: emulo
display_name: Ditto
display_name_en: Ditto
version: 0.1.1
description: Mine the messages you typed in local AI coding sessions into a you.md profile with dated receipts, and install
  it where your agent can read it.
description_zh: 从本地 Claude Code、Codex 和 OpenCode 会话记录中提炼带证据的个人工作、设计和写作画像，并通过 MCP 向 AI 代理提供已生成的私有画像。
author: ohad6k
license: MIT
homepage: https://github.com/ohad6k/ditto
repository: https://github.com/ohad6k/ditto
verified: true
category: ai
tags:
- ai
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - emulo==0.6.7
  - mcp
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
