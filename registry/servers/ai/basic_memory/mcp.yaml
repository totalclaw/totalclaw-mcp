manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: basic_memory
display_name: Basic Memory
display_name_en: Basic Memory
version: 0.1.2
description: Local-first knowledge management combining Zettelkasten with knowledge graphs
description_zh: 本地优先的知识管理系统，从 Markdown 文件构建语义图，实现跨对话持久记忆。
author: basicmachines-co
license: AGPL-3.0-or-later
homepage: https://github.com/basicmachines-co/basic-memory
repository: https://github.com/basicmachines-co/basic-memory
verified: true
category: ai
tags:
- ai
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --prerelease=allow
  - basic-memory==1.0.0
  - mcp
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
