# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：包名同名 bin 是安装器（会往本机每个 AI 工具里注册 MCP 并写记忆协议文件），MCP 服务器是另一个 bin egc-memory，改 `npx -p 包 egc-memory`。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: egc
display_name: EGC
display_name_en: EGC
version: 0.1.3
description: 'EGC is a local-first MCP runtime that gives every AI agent the same brain: persistent shared memory, security
  guardrails, and up to 90% token savings across 29 AI coding tools.'
description_zh: 跨会话持久记忆 MCP 服务，支持 Claude Code、Cursor、Gemini CLI、Codex、Windsurf 等多种 AI 编程工具，SQLite 本地存储，上下文重置后状态保持。提供 egc-memory（14
  工具）与 egc-guardian（5 工具）。`npm install -g @egchq/egc`
author: Fmarzochi
license: Apache-2.0
homepage: https://github.com/Fmarzochi/EGC
repository: https://github.com/Fmarzochi/EGC
verified: true
category: ai
tags:
- ai
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - -p
  - '@egchq/egc@1.1.25'
  - egc-memory
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T10:16:07Z'
  probed_runtime: npx
  count: 24
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
