name: memory_engine
display_name: agent-memory-engine
display_name_en: agent-memory-engine
version: 0.1.0
description: 面向编码 Agent 的本地优先持久记忆与项目知识运行时。维护证据支撑的结构化记忆树（约束/架构/决策/故障/流程），复杂任务前自动按意图召回相关上下文，任务后反思并据置信度决定是否留存。SQLite FTS5 检索、分支感知记忆、统一
  ContextPack（token 预算），数据全留在 `.memory-engine/`、无云调用。
