manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: zotero_kaliaboi
display_name: mcp-zotero
display_name_en: mcp-zotero
version: 0.1.2
description: A Model Context Protocol server for Zotero integration that allows Claude to interact with your Zotero library.
description_zh: 让 LLM 与 Zotero Cloud 上的收藏和文献来源交互的连接器。
author: kaliaboi
license: ISC
homepage: https://github.com/kaliaboi/mcp-zotero
repository: https://github.com/kaliaboi/mcp-zotero
verified: true
category: ai
tags:
- ai
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-zotero@1.0.6
  requires:
    node: '>=18'
requires_env:
- name: ZOTERO_API_KEY
  env_key: ZOTERO_API_KEY
  description: Zotero API Key（zotero.org → Settings → Security）。未设置时服务器启动即退出。
  prompt: 请输入 ZOTERO_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/kaliaboi/mcp-zotero
  doc_label: 查看项目说明（如何获取）
- name: ZOTERO_USER_ID
  env_key: ZOTERO_USER_ID
  description: Zotero 用户 ID（同一页面显示的数字 userID）。未设置时服务器启动即退出。
  prompt: 请输入 ZOTERO_USER_ID
  secret: false
  required: true
  doc_url: https://github.com/kaliaboi/mcp-zotero
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:09Z'
  probed_runtime: npx
  count: 5
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
