# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-02 静态审核：通过（详见 docs/review-2026-11-02.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: rememberizer
display_name: Rememberizer AI
display_name_en: Rememberizer AI
version: 0.1.3
description: A Model Context Protocol server for interacting with Rememberizer's document and knowledge management API. This
  server enables Large Language Models to search, retrieve, and manage documents and integrations through Rememberizer.
description_zh: 与 Rememberizer 数据源交互，促进增强的知识检索。
author: skydeckai
license: Apache-2.0
homepage: https://github.com/skydeckai/mcp-server-rememberizer
repository: https://github.com/skydeckai/mcp-server-rememberizer
verified: true
category: ai
tags:
- ai
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - mcp-server-rememberizer==0.1.6
  requires:
    python: '>=3.10'
requires_env:
- name: REMEMBERIZER_API_TOKEN
  description: Rememberizer AI 的访问令牌（REMEMBERIZER_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 REMEMBERIZER_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/skydeckai/mcp-server-rememberizer
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
