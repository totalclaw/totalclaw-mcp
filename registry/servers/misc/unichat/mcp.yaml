# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：警告（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 审核意见：周下载量很低（9）
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: unichat
display_name: unichat-mcp-server
display_name_en: unichat-mcp-server
version: 0.1.1
description: Unichat MCP Server
description_zh: 通过工具或预定义提示使用 MCP 协议向 OpenAI, MistralAI, Anthropic, xAI, Google AI 或 DeepSeek 发送请求。
author: amidabuddha
license: MIT
homepage: https://github.com/amidabuddha/unichat-mcp-server
repository: https://github.com/amidabuddha/unichat-mcp-server
verified: false
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - unichat-mcp-server==0.2.21
  env:
    UNICHAT_MODEL: SELECTED_UNICHAT_MODEL
  requires:
    python: '>=3.10'
requires_env:
- name: UNICHAT_API_KEY
  description: unichat-mcp-server 的API 密钥（UNICHAT_API_KEY），获取方式见项目说明。
  prompt: 请输入 UNICHAT_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/amidabuddha/unichat-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
