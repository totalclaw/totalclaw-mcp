# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: openapi_schema
display_name: OpenAPI Schema
display_name_en: OpenAPI Schema
version: 0.1.1
description: A Model Context Protocol server that exposes OpenAPI schema information to Large Language Models
description_zh: 让 LLM 在不增加上下文的情况下探索大型 OpenAPI 模式。
author: hannesj
license: MIT
homepage: https://github.com/hannesj/mcp-openapi-schema
repository: https://github.com/hannesj/mcp-openapi-schema
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-openapi-schema@0.0.1
  - ${MCP_OPENAPI_SCHEMA_PATH}
  requires:
    node: '>=18'
requires_env:
- name: PATH
  env_key: MCP_OPENAPI_SCHEMA_PATH
  description: OpenAPI Schema 的启动参数，示例：/ABSOLUTE/PATH/TO/openapi.yaml
  prompt: 请输入 PATH
  secret: false
  required: true
  doc_url: https://github.com/hannesj/mcp-openapi-schema
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
