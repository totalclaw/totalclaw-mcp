# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: balldontlie
display_name: balldontlie-mcp
display_name_en: balldontlie-mcp
version: 0.1.1
description: An MCP Server implementation that integrates the Balldontlie API, to provide information about players, teams
  and games for the NBA, NFL and MLB
description_zh: 集成 balldontlie API，提供 NBA、NFL 和 MLB 的球员、球队和比赛信息。
author: mikechao
license: MIT
homepage: https://github.com/mikechao/balldontlie-mcp
repository: https://github.com/mikechao/balldontlie-mcp
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - balldontlie-mcp@0.6.5
  requires:
    node: '>=18'
requires_env:
- name: BALLDONTLIE_API_KEY
  description: balldontlie-mcp 的API 密钥（BALLDONTLIE_API_KEY），获取方式见项目说明。
  prompt: 请输入 BALLDONTLIE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/mikechao/balldontlie-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
