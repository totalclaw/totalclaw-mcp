manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: apifox_wangmhaha
display_name: Apifox
display_name_en: Apifox
version: 0.1.0
description: '<!--  * @Descripttion:  * @version:  * @Author: wangmin  * @Date: 2025-03-20 14:39:11  * @LastEditors: wangmin  *
  @LastEditTime: 2025-10-24 18:11:21 --> <!--  * @Descripttion:  * @version:  * @Author: wangmin  * @Date: 2025-03-20 14:39:11  *
