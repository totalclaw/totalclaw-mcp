description_zh: Apifox的MCP服务器，支持Apifox的读取和写入
author: upstream
license: ISC
homepage: https://www.npmjs.com/package/@wangmhaha/apifox-mcp-server
verified: false
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@wangmhaha/apifox-mcp-server@1.7.5'
  requires:
    node: '>=18'
requires_env:
- name: APIFOX_API_KEY
  description: Apifox 的API 密钥（APIFOX_API_KEY），获取方式见项目说明。
  prompt: 请输入 APIFOX_API_KEY
  secret: true
  required: true
- name: PROJECT_ID
  description: Apifox 的ID（PROJECT_ID），获取方式见项目说明。
  prompt: 请输入 PROJECT_ID
  secret: false
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
