# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tencent_ioa
display_name: 腾讯云 iOA 零信任
display_name_en: Tencent iOA
version: 0.1.0
description: Query Tencent iOA zero-trust endpoints, installed software, local accounts and account groups.
description_zh: 查询 iOA 零信任管理的终端设备、终端软件、本地账号与账号分组，排查设备在线与合规状态。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: misc
tags:
- totalclaw
- self-hosted
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - tencent_ioa
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - totalclaw-mcp-servers==0.1.0
  - tencent_ioa
  requires:
    python: '>=3.10'
requires_env:
- name: TENCENTCLOUD_SECRET_ID
  env_key: TENCENTCLOUD_SECRET_ID
  description: 腾讯云 iOA 零信任 所需的 TENCENTCLOUD_SECRET_ID
  prompt: 请输入 TENCENTCLOUD_SECRET_ID
  secret: true
  required: true
- name: TENCENTCLOUD_SECRET_KEY
  env_key: TENCENTCLOUD_SECRET_KEY
  description: 腾讯云 iOA 零信任 所需的 TENCENTCLOUD_SECRET_KEY
  prompt: 请输入 TENCENTCLOUD_SECRET_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 6
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
