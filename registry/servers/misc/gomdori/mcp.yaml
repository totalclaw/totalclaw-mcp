manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: gomdori
display_name: korean-law-mcp
display_name_en: korean-law-mcp
version: 0.1.1
description: 韩国法律 MCP 服务器与 CLI：通过韩国法制处官方 Open API 检索法令、判例、行政规则、地方自治法规、条约和法令解释例，并可核验 LLM 输出中法律引用的存在性与内容。
description_zh: 韩国法律 MCP 服务器与 CLI：通过韩国法制处官方 Open API 检索法令、判例、行政规则、地方自治法规、条约和法令解释例，并可核验 LLM 输出中法律引用的存在性与内容。
author: chrisryugj
homepage: https://github.com/chrisryugj/korean-law-mcp
repository: https://github.com/chrisryugj/korean-law-mcp
verified: false
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://mcp.gomdori.app/law?oc=honggildong
  auth: none
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
