manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: amap_maps
display_name: 高德地图
display_name_en: ''
version: 0.1.2
description: MCP server for using the AMap Maps API
description_zh: 高德地图的MCP服务器
author: upstream
license: ISC
homepage: https://www.npmjs.com/package/@amap/amap-maps-mcp-server
verified: false
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@amap/amap-maps-mcp-server@0.0.8'
  requires:
    node: '>=18'
requires_env:
- name: AMAP_MAPS_API_KEY
  description: 高德地图 的API 密钥（AMAP_MAPS_API_KEY），获取方式见项目说明。
  prompt: 请输入 AMAP_MAPS_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
