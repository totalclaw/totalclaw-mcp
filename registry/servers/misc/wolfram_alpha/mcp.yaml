# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
# 2026-11-26：补齐启动必需的凭据 / 参数声明（以前写 requires_env: []，装上即报缺变量退出）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: wolfram_alpha
display_name: MCP-wolfram-alpha
display_name_en: MCP-wolfram-alpha
version: 0.1.3
description: A MCP server to connect to wolfram alpha API.
description_zh: 用于查询 Wolfram Alpha API 的 MCP 服务器。
author: SecretiveShell
license: MIT
homepage: https://github.com/SecretiveShell/MCP-wolfram-alpha
repository: https://github.com/SecretiveShell/MCP-wolfram-alpha
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - mcp-wolfram-alpha==0.2.1
  requires:
    python: '>=3.10'
requires_env:
- name: WOLFRAM_API_KEY
  description: Wolfram|Alpha 的 AppID：在 developer.wolframalpha.com 登录后 Get an AppID。
  prompt: 请输入 Wolfram|Alpha AppID
  secret: true
  required: true
  doc_url: https://github.com/SecretiveShell/MCP-wolfram-alpha
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
