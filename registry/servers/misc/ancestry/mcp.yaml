name: ancestry
display_name: ancestry-mcp
display_name_en: ancestry-mcp
version: 0.1.1
description: A Model Context Protocol server providing functionality to GEDCOM files via LLM usage
description_zh: 允许 AI 读取 .ged 文件和遗传数据。
author: reeeeemo
license: MIT
homepage: https://github.com/reeeeemo/ancestry-mcp
repository: https://github.com/reeeeemo/ancestry-mcp
