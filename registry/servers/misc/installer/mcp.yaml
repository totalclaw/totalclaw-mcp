manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: installer
display_name: mcp-installer
display_name_en: mcp-installer
version: 0.1.0
description: A MCP server to install other MCP servers
description_zh: 为您安装其他 MCP 服务器的 MCP 服务器。
author: anaisbetts
license: MIT
homepage: https://github.com/anaisbetts/mcp-installer
repository: https://github.com/anaisbetts/mcp-installer
verified: false
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@anaisbetts/mcp-installer@0.5.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
