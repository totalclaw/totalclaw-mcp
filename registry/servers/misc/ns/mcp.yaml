manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: ns
display_name: NS Travel Information MCP Server
display_name_en: NS Travel Information MCP Server
version: 0.1.1
description: Transform your AI assistant into a Dutch railways expert! This MCP server connects Claude to real-time NS (Nederlandse
  Spoorwegen) travel information, making it your perfect companion for navigating the Netherlands by train.
description_zh: 访问荷兰铁路 (NS) 的旅行信息、时刻表和实时更新。
author: r-huijts
license: MIT
homepage: https://github.com/r-huijts/ns-mcp-server
repository: https://github.com/r-huijts/ns-mcp-server
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - ns-mcp-server@0.1.6
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
