# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: openai
display_name: mcp-openai
display_name_en: mcp-openai
version: 0.1.1
description: MCP server for simple interaction with OpenAI API
description_zh: 与 OpenAI 最智能的模型聊天。
author: mzxrai
license: MIT
homepage: https://github.com/mzxrai/mcp-openai
repository: https://github.com/mzxrai/mcp-openai
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@mzxrai/mcp-openai@0.1.1'
  requires:
    node: '>=18'
requires_env:
- name: OPENAI_API_KEY
  description: mcp-openai 的API 密钥（OPENAI_API_KEY），获取方式见项目说明。
  prompt: 请输入 OPENAI_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/mzxrai/mcp-openai
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
