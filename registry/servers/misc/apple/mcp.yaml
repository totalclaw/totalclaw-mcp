manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: apple
display_name: Apple MCP
display_name_en: Apple MCP
version: 0.1.1
description: Apple MCP tools for contacts, notes, messages, and mail integration
description_zh: Apple生态系统集成的MCP工具
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/@dhravya/apple-mcp
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@dhravya/apple-mcp@0.2.7'
