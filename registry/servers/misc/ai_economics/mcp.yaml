# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: ai_economics
display_name: ai-economics-mcp
display_name_en: ai-economics-mcp
version: 0.1.1
description: 'MCP server for AI economics: token cost, context windows, agent-hour cost, LLM energy, joules per verified task,
  Proof-Adjusted Autonomy, revocation exposure and more. Wraps the free piszczek.pl/tools API — no key required.'
description_zh: 把 12 个 AI 经济性计算器暴露为 MCP 工具：各厂商 token 成本、上下文窗口规模、Agent 工时成本、模型路由节省、LLM 能耗与碳排放、每个已验证任务的焦耳数、token 消耗速率、验证瓶颈、撤销敞口等。全部计算在本地完成，也可调用免费且无需
  API Key 的 HTTP 接口（附 OpenAPI 3.1 规范）。
author: pich
license: MIT
homepage: https://github.com/pich/ai-economics-mcp
repository: https://github.com/pich/ai-economics-mcp
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@michalpiszczek/ai-economics-mcp@1.0.2'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
