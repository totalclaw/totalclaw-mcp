# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: leetcode
display_name: LeetCode
display_name_en: LeetCode
version: 0.1.2
description: MCP Server for LeetCode API (supports leetcode.com and leetcode.cn)
description_zh: LeetCode的MCP服务器，支持LeetCode的读取和写入
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/@jinzcdev/leetcode-mcp-server
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@jinzcdev/leetcode-mcp-server@1.5.1'
  env:
    LEETCODE_SITE: global
  requires:
    node: '>=18'
requires_env:
- name: LEETCODE_SESSION
  description: LeetCode 的配置项（LEETCODE_SESSION），获取方式见项目说明。
  prompt: 请输入 LEETCODE_SESSION
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
