manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: ip2location_io
display_name: mcp-ip2location-io
display_name_en: mcp-ip2location-io
version: 0.1.2
description: Add your description here
description_zh: 使用 IP2Location.io API 获取 IP 地址地理位置和网络信息。
author: ip2location
license: MIT
homepage: https://github.com/ip2location/mcp-ip2location-io
repository: https://github.com/ip2location/mcp-ip2location-io
