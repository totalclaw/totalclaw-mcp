# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：警告（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 审核意见：源码仓库 github.com/tomek-korbak/oura-mcp-server 访问不到（404）；条目写的仓库 tomekkorbak/oura-mcp-server 与包元数据里的仓库 tomek-korbak/oura-mcp-server 不一致；仓库 tomek-korbak/oura-mcp-server 的清单文件和 README 里都找不到包名 oura-mcp-server，无法确认包出自此仓库
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: oura
display_name: oura-mcp-server
display_name_en: oura-mcp-server
version: 0.1.1
description: MCP server for Oura API integration
description_zh: 用于 Oura (睡眠追踪应用) 的 MCP 服务器。
author: tomekkorbak
license: MIT
homepage: https://github.com/tomekkorbak/oura-mcp-server
repository: https://github.com/tomekkorbak/oura-mcp-server
verified: false
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - oura-mcp-server==0.1.3
  requires:
    python: '>=3.10'
requires_env:
- name: OURA_API_TOKEN
  description: oura-mcp-server 的访问令牌（OURA_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 OURA_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/tomekkorbak/oura-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
