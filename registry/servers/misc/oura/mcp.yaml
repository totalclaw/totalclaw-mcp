# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-02 静态审核：通过（详见 docs/review-2026-11-02.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: oura
display_name: oura-mcp-server
display_name_en: oura-mcp-server
version: 0.1.3
description: MCP server for Oura API integration
description_zh: 用于 Oura (睡眠追踪应用) 的 MCP 服务器。
author: tomekkorbak
license: MIT
homepage: https://github.com/tomekkorbak/oura-mcp-server
repository: https://github.com/tomekkorbak/oura-mcp-server
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - oura-mcp-server==0.1.3
  requires:
    python: '>=3.10'
requires_env:
- name: OURA_API_TOKEN
  description: oura-mcp-server 的访问令牌（OURA_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 OURA_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/tomekkorbak/oura-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
