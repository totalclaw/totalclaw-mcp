# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: parlayapi
display_name: ParlayAPI
display_name_en: ParlayAPI
version: 0.1.1
description: 'MCP server for ParlayAPI: sports odds, live previews, source-quality proof, and frictionless agent signup'
description_zh: 查询体育赛事赔率、球员专项盘口、公开赛事信息与个人账户用量；账户数据工具使用用户自己的 API Key，并受账户额度限制。
author: JacobiusMakes
license: MIT
homepage: https://github.com/JacobiusMakes/parlay-api-mcp
repository: https://github.com/JacobiusMakes/parlay-api-mcp
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - parlayapi-mcp==0.3.8
  requires:
    python: '>=3.10'
requires_env:
- name: PARLAYAPI_KEY
  description: ParlayAPI 的API 密钥（PARLAYAPI_KEY），获取方式见项目说明。
  prompt: 请输入 PARLAYAPI_KEY
  secret: true
  required: true
  doc_url: https://github.com/JacobiusMakes/parlay-api-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
