manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: jacobian
display_name: jacobian
display_name_en: jacobian
version: 0.1.2
description: Atomic mathematical tools for agents over MCP and Python
description_zh: 面向可组合数学的 MCP 服务器、CLI 和 Python 库：支持多项式映射、线性代数与图算法的精确计算和猜想检验。
author: morluto
license: MIT
homepage: https://github.com/morluto/jacobian
repository: https://github.com/morluto/jacobian
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - jacobian==0.23.0
  - jacobian-mcp
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T10:15:46Z'
  probed_runtime: uvx
  count: 2
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
