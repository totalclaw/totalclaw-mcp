description_zh: 开源的 link-in-bio 个人主页生成器（Linktree 替代）：通过 MCP 创建和编辑页面，添加、修改、移动、删除链接卡片，设置主题与个人资料，导入已有页面并发布。
author: Himanshu-Sangshetti
