# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: godot
display_name: godot-mcp
display_name_en: godot-mcp
version: 0.1.1
description: MCP server for interfacing with Godot game engine. Provides tools for launching the editor, running projects,
  and capturing debug output.
description_zh: 用于与 Godot 游戏引擎交互的 MCP 服务器，提供编辑、运行、调试和管理 Godot 项目中场景的工具。
author: Coding-Solo
license: MIT
homepage: https://github.com/Coding-Solo/godot-mcp
repository: https://github.com/Coding-Solo/godot-mcp
verified: true
category: misc
tags:
- misc
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@coding-solo/godot-mcp@0.1.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
