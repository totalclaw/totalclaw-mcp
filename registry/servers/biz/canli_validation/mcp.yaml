manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: canli_validation
display_name: canli-validation-mcp
display_name_en: canli-validation-mcp
version: 0.1.2
description: 'Check whether a backtest is real: deflated Sharpe, CSCV probability of backtest overfitting, minimum track record
  and backtest length, haircut Sharpe and luck-equivalent trials, as an MCP server. Local mode, hosted endpoint, signed receipts.'
description_zh: 检验回测结果是否可信：Deflated Sharpe Ratio（缩减夏普比率）、CSCV 回测过拟合概率（PBO）、数据窥探检验（Hansen SPA、White Reality Check、Romano-Wolf
  StepM）、最短业绩记录长度、前视偏差检查与研究流程安慰剂检验，每个结果都注明它不能证明什么。
author: arhancanli
license: MIT
homepage: https://github.com/arhancanli/canli-validation-mcp
repository: https://github.com/arhancanli/canli-validation-mcp
verified: true
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - canli-validation-mcp@0.16.0
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
