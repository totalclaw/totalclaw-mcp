# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-11-26）；待静态安全扫描审核。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: blazephoenix
display_name: BlazePhoenix
display_name_en: BlazePhoenix
version: 0.1.1
description: 'Local MCP server for BlazePhoenix: quotes, unsigned calldata and simulation, all read through your own RPC.
  It never signs and never holds keys.'
description_zh: 链上 DEX 聚合器的 MCP 服务器：报价由链上 Quoter 合约计算（免费 `eth_call`，在你自己的 RPC 节点上运行），返回扣费后净输出、Router 强制的最小输出、价格影响与 Phoenix
  Check 判定；可生成未签名的 Router calldata 并模拟执行，查询代币信息、部署注册表并核验链上部署。所有工具只读，服务器从不签名、从不持有私钥。支持 Base、Ethereum、Optimism、Arbitrum、Robinhood
  Chain。
author: blazephoenixxyz-crypto
license: MIT
homepage: https://github.com/blazephoenixxyz-crypto/blazephoenix-mcp
repository: https://github.com/blazephoenixxyz-crypto/blazephoenix-mcp
verified: true
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@blazephoenix/mcp@1.4.0'
  requires:
    node: '>=18'
requires_env:
- name: BLAZEPHOENIX_RPC_BASE
  description: BlazePhoenix 的服务地址（BLAZEPHOENIX_RPC_BASE），获取方式见项目说明。
  prompt: 请输入 BLAZEPHOENIX_RPC_BASE
  secret: false
  required: true
  doc_url: https://github.com/blazephoenixxyz-crypto/blazephoenix-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
