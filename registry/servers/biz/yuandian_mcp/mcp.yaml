# 由 scripts/import_vendor_mcp.py 生成——端点是厂商自有的 MCP 服务器，
# 上游连接器 id: yuandian-mcp。人工修改后请同步递增 version。
# 实测该端点返回标准 MCP OAuth 质询（WWW-Authenticate 带 resource_metadata），
# 故 auth: oauth —— 不需要预置凭据，装完跑 totalclaw mcp login <名> 浏览器授权。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: yuandian_mcp
display_name: 华宇元典法律数据
display_name_en: Huayu Yuandian Legal Data
version: 0.1.0
description: Huayu Yuandian Legal Data provides agents with MCP tool capabilities for laws and regulations,
  case documents, and enterprise information.
description_zh: 华宇元典法律数据为智能体提供法律法规、案例文书、企业信息 MCP 工具能力。
author: vendor
category: biz
tags:
- biz
- vendor
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://open.chineselaw.com/mcp
  auth: oauth
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 600
security:
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
homepage: https://open.chineselaw.com
examples:
- 夫妻共同财产是怎么规定的？要现行有效的法条原文，附出处。
- 股东转让了认缴出资但未届期的股权后,对受让前的公司债务还要担责吗?有类似裁判吗?
- 合作方恒大地产集团,签合同前帮我扫一遍司法风险。
