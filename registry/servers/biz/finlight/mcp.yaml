description: 'Real-time financial news for AI agents: search by ticker, source, and language, with sentiment and entities.'
description_zh: 面向 AI 代理的实时财经新闻 MCP 服务器，覆盖全球市场、地缘政治及公司层面的新闻，可按股票代码、新闻源和语言检索文章，并附带情感评分和公司实体标注。
