name: pkulaw
display_name: 北大法宝·法律智能检索
version: 0.1.0
description: 'Semantic (natural-language) + keyword dual-mode retrieval over Chinese laws, regulations
  and judicial cases, plus citation verification: extract and standardise statute references, validate
  case numbers, fact-check article text against the authoritative original, and auto-link everything back
  to pkulaw.com — traceable, verifiable, ready to cite.'
description_zh: 检索 + 核验一体：语义（自然语言描述）与关键词双模式检索法规、法条与司法案例；并可把文本中的法条引用与案号回北大法宝库逐条比对、对齐标准名称，输出带 pkulaw.com
  原文链接的可溯源结果，专治法律幻觉。
author: vendor
category: biz
tags:
- biz
- vendor
kind: mcp_server
