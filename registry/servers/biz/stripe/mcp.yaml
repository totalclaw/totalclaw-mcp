# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: stripe
display_name: Stripe
display_name_en: Stripe
version: 0.1.0
description: A command line tool for setting up Stripe MCP server
description_zh: Stripe的MCP服务器，支持Stripe的读取和写入
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/@stripe/mcp
verified: false
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@stripe/mcp@0.3.3'
  requires:
    node: '>=18'
requires_env:
- name: STRIPE_SECRET_KEY
  description: Stripe 的密钥（STRIPE_SECRET_KEY），获取方式见项目说明。
  prompt: 请输入 STRIPE_SECRET_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
