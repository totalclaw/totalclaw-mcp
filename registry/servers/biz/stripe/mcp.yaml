# 2026-11-26：本地 npm 包 @stripe/mcp 已停止维护（不再有安全修复），改接官方托管端点 https://mcp.stripe.com（OAuth）。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: stripe
display_name: Stripe
display_name_en: Stripe
version: 0.2.0
description: Stripe's official hosted MCP server (OAuth).
description_zh: Stripe 官方托管的 MCP 服务器，支持 Stripe 的读取和写入；装后用 Stripe 账号 OAuth 授权，不需要填密钥。
author: Stripe
license: MIT
homepage: https://docs.stripe.com/mcp
repository: https://github.com/stripe/ai
verified: true
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://mcp.stripe.com
  auth: oauth
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
