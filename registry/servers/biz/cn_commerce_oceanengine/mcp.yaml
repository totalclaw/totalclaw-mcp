version: 0.1.1
description: Read-only Ocean Engine merchant business data (orders, products, after-sales, inventory) via mcp-cn-commerce.
description_zh: 巨量引擎广告投放数据（账户、计划、报表），只读。本地运行，来自 mcp-cn-commerce 套件。
