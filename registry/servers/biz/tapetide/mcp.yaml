description_zh: 印度股市（NSE、BSE）MCP 服务器，覆盖约 8,200 只上市股票：实时行情、季度财报、股东结构、326 项指标选股器、FII/DII 资金流向、期权链与隐含波动率、公司公告、IPO 与持仓跟踪。
