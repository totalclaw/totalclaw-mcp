# 由 scripts/import_presets.py 生成；人工维护时请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: notion
display_name: Notion
version: 0.1.0
description: Notion MCP server.
description_zh: Notion API 全套集成 — 页面 / 数据库 / 搜索 / 评论 / 用户 / 块级编辑。Notion 官方维护。
author: upstream
homepage: https://github.com/makenotion/notion-mcp-server
category: biz
tags:
- biz
- preset
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@notionhq/notion-mcp-server'
  env:
    OPENAPI_MCP_HEADERS: '{"Authorization":"Bearer ${NOTION_API_KEY}","Notion-Version":"2022-06-28"}'
  requires:
    node: '>=18'
requires_env:
- name: NOTION_API_KEY
  env_key: NOTION_API_KEY
  description: NOTION_API_KEY for notion
  prompt: 请输入 NOTION_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
