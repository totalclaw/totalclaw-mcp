manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: qcc_legal
display_name: 企查查·法律数据
display_name_en: QCC Legal
version: 0.1.0
description: 'QCC Legal is a Chinese legal-data connector for searching, researching, and verifying statutes
  and judicial cases. On the regulation side it covers the full body of in-force Chinese law — laws, administrative
  regulations, departmental rules, judicial interpretations, and local regulations — at both the whole-regulation
  and individual-article level, returning verbatim text tagged with validity status (in force / amended
  / repealed), legal hierarchy, and promulgating authority, with common-name normalization (e.g. The Civil
  Code, the Personal Information Protection Law). On the case side it covers a massive corpus of ordinary
  judgment documents plus 25,000+ authoritative cases — Supreme People''s Court and Supreme People''s
  Procuratorate guiding cases, gazette cases, typical cases, and reference cases — filterable by cause
  of action, court, instance, judgment date, and party. It further verifies legal citations: given any
  text it detects every statute and case-number reference, checks each against the database, flags validity
  status, returns the authoritative source and verbatim text, and generates traceable hyperlinks — eliminating
  fabricated statutes and case numbers in AI-generated legal content. Use natural language to find statutory
  grounds, run legal research and analysis, retrieve similar cases, pull verbatim originals, and verify
  citations before delivery.'
description_zh: 检索与核验中国法律法规和司法案例。覆盖全量现行法律、行政法规、司法解释——法规级到法条级逐字正文，标注时效性与效力级别；海量裁判文书及 2.5 万+ 权威案例（最高法/最高检指导性案例、公报案例、典型案例）；并对文本中的法条与案号引用逐条回库核验、标注时效、生成可溯源超链。用自然语言完成法条依据查找、类案检索、原文调取与法律引用核验，从源头消除法条与案号幻觉。
author: vendor
