# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: codex
display_name: codex-mcp
display_name_en: codex-mcp
version: 0.1.1
description: Model Context Protocol (MCP) server for fetching blockchain data from Codex.io
description_zh: Codex API 集成，提供 60+ 网络上实时丰富的区块链和市场数据。
author: Codex-Data
license: ISC
homepage: https://github.com/Codex-Data/codex-mcp
repository: https://github.com/Codex-Data/codex-mcp
verified: true
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@codex-data/codex-mcp@0.1.3'
  requires:
    node: '>=18'
requires_env:
- name: CODEX_API_KEY
  description: codex-mcp 的API 密钥（CODEX_API_KEY），获取方式见项目说明。
  prompt: 请输入 CODEX_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/Codex-Data/codex-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
