# 由 scripts/import_vendor_mcp.py 生成——端点是厂商自有的 MCP 服务器，
# 上游连接器 id: xingtu-claw-risk。人工修改后请同步递增 version。
# 上游配置写的是 sse（agent 不支持）。把路径末段 /sse 换成 /mcp 后实测端点存在
# 且说 streamable-HTTP，故改用 http runtime；实测记录见 docs/TODO.md B 层。
# 实测该端点返回标准 MCP OAuth 质询（WWW-Authenticate 带 resource_metadata），
# 故 auth: oauth —— 不需要预置凭据，装完跑 totalclaw mcp login <名> 浏览器授权。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: xingtu_claw_risk
display_name: 天创信用星图MCP
display_name_en: Tianchuang Credit StarGraph MCP
version: 0.1.0
description: Enterprise risk AI assistant. Identify a company's industry and analyze related-party relationships
  (equity, controller, guarantee, joint investment) between companies using natural language.
description_zh: 企业风险 AI 分析助手，用自然语言识别企业所属行业、分析企业间关联方关系（股权/实控人/担保/共同投资）。
author: vendor
category: biz
tags:
- biz
- vendor
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://claw-mcp.tcredit.com/mcp
  auth: oauth
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 600
security:
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
homepage: https://claw-mcp.tcredit.com
examples:
- 百度公司属于哪个行业
- 识别一下小米集团的主营业务
- 腾讯和阿里巴巴是什么关系
- 天创信用是做什么的
- 分析一下这两家公司有没有关联
