# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: estat
display_name: estat-mcp
display_name_en: estat-mcp
version: 0.1.0
description: e-Stat API client and MCP server for Japanese government statistics
description_zh: 日本政府统计门户 [e-Stat](https://www.e-stat.go.jp/) 的 MCP 服务器。搜索和获取人口、GDP、CPI、劳动、贸易等 3,000+ 统计表。
author: ajtgjmdjp
homepage: https://github.com/ajtgjmdjp/estat-mcp
repository: https://github.com/ajtgjmdjp/estat-mcp
verified: false
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - estat-mcp==0.2.6
  - serve
  requires:
    python: '>=3.10'
requires_env:
- name: ESTAT_APP_ID
  description: estat-mcp 的ID（ESTAT_APP_ID），获取方式见项目说明。
  prompt: 请输入 ESTAT_APP_ID
  secret: false
  required: true
  doc_url: https://github.com/ajtgjmdjp/estat-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
