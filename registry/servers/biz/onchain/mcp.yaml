# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: onchain
display_name: Bankless Onchain
display_name_en: Bankless Onchain
version: 0.1.1
description: MCP server for using Bankless Onchain
description_zh: 查询链上数据，如 ERC20 代币、交易历史、智能合约状态。 (Bankless 官方)
author: bankless
license: MIT
homepage: https://github.com/bankless/onchain-mcp
repository: https://github.com/bankless/onchain-mcp
verified: true
category: biz
tags:
- biz
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@bankless/onchain-mcp@1.0.6'
  requires:
    node: '>=18'
requires_env:
- name: BANKLESS_API_TOKEN
  description: Bankless Onchain 的访问令牌（BANKLESS_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 BANKLESS_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/bankless/onchain-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
