name: pangolinfo
display_name: pangolinfo-mcp
display_name_en: pangolinfo-mcp
version: 0.1.0
description: 亚马逊数据 MCP 服务，提供 19 个只读工具：商品详情、评论、关键词搜索、类目与蓝海细分分析、Best Sellers、New Releases、卖家店铺在售商品，以及 AI Overview / AI Mode
  搜索结果与关键词趋势；另含 WIPO 商标检索与美国 PACER 专利诉讼查询，可在上架前排查 IP 风险。通过远程 Streamable HTTP 端点接入，无需自建爬虫与代理池。
