description: Connect SalesTouch to configure organization profiles, units, role permissions, employee
  invitations, reporting scopes, and sales processes, then govern sales and non-sales execution with evidence-backed
  management reviews.
description_zh: 通过自然语言连接 SalesTouch，完成组织资料、部门、角色权限、员工邀请、下属管理范围与销售流程配置，并处理销售执行、非销售工作、绩效、内部调研和经营汇总。
