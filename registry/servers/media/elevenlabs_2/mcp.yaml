# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: elevenlabs_2
display_name: ElevenLabs (官方)
display_name_en: ''
version: 0.1.1
description: ElevenLabs MCP Server
description_zh: ElevenLabs 官方 MCP 服务器，提供文本转语音、语音克隆、音频转录、配音等能力。
author: elevenlabs
license: MIT
homepage: https://github.com/elevenlabs/elevenlabs-mcp
repository: https://github.com/elevenlabs/elevenlabs-mcp
verified: true
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - elevenlabs-mcp==0.12.2
  requires:
    python: '>=3.10'
requires_env:
- name: ELEVENLABS_API_KEY
  description: ElevenLabs (官方) 的API 密钥（ELEVENLABS_API_KEY），获取方式见项目说明。
  prompt: 请输入 ELEVENLABS_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/elevenlabs/elevenlabs-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
