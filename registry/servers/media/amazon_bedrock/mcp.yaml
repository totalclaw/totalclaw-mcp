# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: amazon_bedrock
display_name: Amazon Bedrock Nova Canvas
display_name_en: Amazon Bedrock Nova Canvas
version: 0.1.1
description: Use Amazon Bedrock Nova models to generate image.
description_zh: 使用 Amazon Nova Canvas 模型进行图像生成。
author: zxkane
license: MIT
homepage: https://github.com/zxkane/mcp-server-amazon-bedrock
repository: https://github.com/zxkane/mcp-server-amazon-bedrock
verified: true
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@zxkane/mcp-server-amazon-bedrock@0.1.1'
  env:
    AWS_REGION: us-east-1
  requires:
    node: '>=18'
requires_env:
- name: AWS_PROFILE
  description: Amazon Bedrock Nova Canvas 的路径（AWS_PROFILE），获取方式见项目说明。
  prompt: 请输入 AWS_PROFILE
  secret: false
  required: true
  doc_url: https://github.com/zxkane/mcp-server-amazon-bedrock
  doc_label: 查看项目说明（如何获取）
- name: AWS_ACCESS_KEY_ID
  description: Amazon Bedrock Nova Canvas 的ID（AWS_ACCESS_KEY_ID），获取方式见项目说明。
  prompt: 请输入 AWS_ACCESS_KEY_ID
  secret: true
  required: true
  doc_url: https://github.com/zxkane/mcp-server-amazon-bedrock
  doc_label: 查看项目说明（如何获取）
- name: AWS_SECRET_ACCESS_KEY
  description: Amazon Bedrock Nova Canvas 的密钥（AWS_SECRET_ACCESS_KEY），获取方式见项目说明。
  prompt: 请输入 AWS_SECRET_ACCESS_KEY
  secret: true
  required: true
  doc_url: https://github.com/zxkane/mcp-server-amazon-bedrock
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
