# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-11-26）；待静态安全扫描审核。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: transcriptdock
display_name: Transcript Dock
display_name_en: Transcript Dock
version: 0.1.1
description: 'MCP server for TranscriptDock: transcribe videos and fetch transcripts from Claude, Cursor and other agents.'
description_zh: 远程 MCP 服务，获取 YouTube、TikTok 视频字幕和 Instagram Reels 转录文本（Reels 走 AI 转写，付费套餐），也可转写上传的音视频文件；主工具 `get_video_transcript(url)`
  一次调用即返回文本，另含任务、导出（JSON/SRT/VTT/TXT）与视频发现等共 13 个工具。
author: TranscriptDock
license: MIT
homepage: https://github.com/TranscriptDock/transcriptdock-mcp
repository: https://github.com/TranscriptDock/transcriptdock-mcp
verified: true
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@transcriptdock/mcp@0.1.3'
  requires:
    node: '>=18'
requires_env:
- name: TRANSCRIPTDOCK_API_KEY
  description: Transcript Dock 的API 密钥（TRANSCRIPTDOCK_API_KEY），获取方式见项目说明。
  prompt: 请输入 TRANSCRIPTDOCK_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/TranscriptDock/transcriptdock-mcp
  doc_label: 查看项目说明（如何获取）
optional_env:
- name: TRANSCRIPTDOCK_BASE_URL
  description: Transcript Dock 的服务地址（TRANSCRIPTDOCK_BASE_URL），不填用默认值 https://www.transcriptdock.com。
  prompt: 请输入 TRANSCRIPTDOCK_BASE_URL
  secret: false
  required: false
  doc_url: https://github.com/TranscriptDock/transcriptdock-mcp
  doc_label: 查看项目说明（如何获取）
  default: https://www.transcriptdock.com
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
