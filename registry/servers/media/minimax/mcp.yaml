# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：MINIMAX_API_HOST 包里是必填（不设启动即退出），原先标选填且默认值是一句说明文字 → 改必填、不给默认；MINIMAX_API_RESOURCE_MODE 原先写死为说明文字（≠ url，包会静默改成本地落盘）→ 改 url；MINIMAX_MCP_BASE_PATH 去掉占位默认值（包默认 ~/Desktop）；去掉无意义的 `-y` 参数。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: minimax
display_name: MiniMax (官方)
display_name_en: ''
version: 0.1.3
description: Minimax MCP Server
description_zh: MiniMax 官方 MCP 服务器，调用其文本转语音、图像生成与视频生成 API。
author: MiniMax-AI
license: MIT
homepage: https://github.com/MiniMax-AI/MiniMax-MCP
repository: https://github.com/MiniMax-AI/MiniMax-MCP
verified: true
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - minimax-mcp==0.0.20
  env:
    MINIMAX_API_RESOURCE_MODE: url
  requires:
    python: '>=3.10'
requires_env:
- name: MINIMAX_API_KEY
  description: MiniMax (官方) 的API 密钥（MINIMAX_API_KEY），获取方式见项目说明。
  prompt: 请输入 MINIMAX_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/MiniMax-AI/MiniMax-MCP
  doc_label: 查看项目说明（如何获取）
- name: MINIMAX_API_HOST
  env_key: MINIMAX_API_HOST
  description: MiniMax API 地址，须与 API Key 所属区域一致：国际版 https://api.minimax.io，中国大陆 https://api.minimaxi.com。未设置时服务器启动即退出。
  prompt: 请输入 MiniMax API 地址
  secret: false
  required: true
  doc_url: https://github.com/MiniMax-AI/MiniMax-MCP
  doc_label: 查看项目说明（如何获取）
optional_env:
- name: MINIMAX_MCP_BASE_PATH
  description: 生成的音频 / 图片 / 视频保存到的本机目录（绝对路径）。不填用包默认的 ~/Desktop。
  prompt: 请输入输出目录（可留空）
  secret: false
  required: false
  doc_url: https://github.com/MiniMax-AI/MiniMax-MCP
  doc_label: 查看项目说明（如何获取）
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
