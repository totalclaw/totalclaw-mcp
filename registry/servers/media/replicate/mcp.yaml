manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: replicate
display_name: Replicate
display_name_en: Replicate
version: 0.1.2
description: Run Replicate models through a simple MCP server interface
description_zh: 在 Replicate 上搜索、运行和管理机器学习模型，处理生成的图像。
author: deepfates
license: MIT
homepage: https://github.com/deepfates/mcp-replicate
repository: https://github.com/deepfates/mcp-replicate
verified: true
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-replicate@0.1.1
  requires:
    node: '>=18'
requires_env:
- name: REPLICATE_API_TOKEN
  env_key: REPLICATE_API_TOKEN
  description: Replicate API Token。未设置时服务器启动即退出。
