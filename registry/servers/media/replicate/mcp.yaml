  secret: true
  required: true
  doc_url: https://github.com/deepfates/mcp-replicate
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:06Z'
  probed_runtime: npx
  count: 12
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
