# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: zubeid_youtube
display_name: YouTube
display_name_en: YouTube
version: 0.1.0
description: YouTube MCP Server Implementation
description_zh: 全面的 YouTube API 集成，用于视频管理、Shorts 创建和分析。
author: ZubeidHendricks
license: MIT
homepage: https://github.com/ZubeidHendricks/youtube-mcp-server
repository: https://github.com/ZubeidHendricks/youtube-mcp-server
verified: false
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - zubeid-youtube-mcp-server@1.0.2
  requires:
    node: '>=18'
requires_env:
- name: YOUTUBE_API_KEY
  description: YouTube 的API 密钥（YOUTUBE_API_KEY），获取方式见项目说明。
  prompt: 请输入 YOUTUBE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/ZubeidHendricks/youtube-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: YOUTUBE_API_KEY2
  description: YouTube 的API 密钥（YOUTUBE_API_KEY2），获取方式见项目说明。
  prompt: 请输入 YOUTUBE_API_KEY2
  secret: true
  required: true
  doc_url: https://github.com/ZubeidHendricks/youtube-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: YOUTUBE_API_KEY3
  description: YouTube 的API 密钥（YOUTUBE_API_KEY3），获取方式见项目说明。
  prompt: 请输入 YOUTUBE_API_KEY3
  secret: true
  required: true
  doc_url: https://github.com/ZubeidHendricks/youtube-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
