name: getyoutubetranscript
display_name: YouTube Transcript + YouTube Search MCP
display_name_en: YouTube Transcript + YouTube Search MCP
version: 0.1.0
description: 远程 MCP 服务，获取 YouTube 视频字幕/转录文本，并支持视频与频道搜索、频道最新视频、频道视频浏览、播放列表提取，共 6 个工具。仓库附带零依赖的 [`verify.js`](https://github.com/tubeagentkit/youtube-mcp/blob/main/verify.js)
  脚本，可在无需鉴权的情况下对生产端点执行真实的 MCP 握手（`initialize` + `tools/list`）以验证实现；已上架[官方 MCP Registry](https://registry.modelcontextprotocol.io/v0/servers?search=getyoutubetranscript)、Smithery、Glama、LobeHub
  四方独立目录。
