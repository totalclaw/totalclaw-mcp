# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: figma_developer
display_name: Figma-Context-MCP
display_name_en: Figma-Context-MCP
version: 0.1.0
description: Give your coding agent access to your Figma data. Implement designs in any framework in one-shot.
description_zh: 将 Figma 设计稿的布局信息提供给 Cursor、Claude 等 AI 编程代理，实现「设计稿一键转代码」，还原度更高。
author: GLips
license: MIT
homepage: https://github.com/GLips/Figma-Context-MCP
repository: https://github.com/GLips/Figma-Context-MCP
verified: false
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - figma-developer-mcp@0.13.2
  - --figma-api-key=${MCP_FIGMA_DEVELOPER_FIGMA_API_KEY}
  - --stdio
  requires:
    node: '>=18'
requires_env:
- name: FIGMA_API_KEY
  env_key: MCP_FIGMA_DEVELOPER_FIGMA_API_KEY
  description: Figma-Context-MCP 启动参数 --figma-api-key 的值，见项目说明。
  prompt: 请输入 FIGMA_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/GLips/Figma-Context-MCP
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
