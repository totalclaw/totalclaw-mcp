manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: bilibili
display_name: Bilibili MCP
display_name_en: Bilibili MCP
version: 0.1.0
description: Bilibili MCP tool for video metadata, transcripts, subtitles, and comment summarization
description_zh: 面向中文用户的 Bilibili MCP 服务器，可提取视频元数据、字幕与结构化转录、章节和热门评论，并在无字幕时支持本地 ASR 回退。
author: XZXZZX-Ai
license: Apache-2.0
homepage: https://github.com/XZXZZX-Ai/bilibili-mcp
repository: https://github.com/XZXZZX-Ai/bilibili-mcp
verified: false
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@xzxzzx/bilibili-mcp@1.14.5'
  - check
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
