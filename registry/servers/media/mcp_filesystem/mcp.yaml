# 由 scripts/import_presets.py 生成；人工维护时请同步递增 version。
# 原先写的是 ${MCP_FS_ROOT:-/tmp}，而 agent 的 interpolate_env_vars 不认 :- 默认值
# （正则 \$\{([^}]+)\}，把 "MCP_FS_ROOT:-/tmp" 整个当变量名去查）—— 服务器拿到一串
# 字面量当目录名，起不来。改成必填：沙箱根目录本来就该让用户自己选，
# 静默默认 /tmp 等于替用户决定了「哪些文件可以被模型读写」。
# 2026-11-27：上游 @modelcontextprotocol/* 已于 2026-11-18 弃用日期版、改回 semver 2.x。2.x 的 engines 声明 node>=24，
# 但实测 Node 22.22 下 initialize / list_tools / 典型工具调用均正常（桌面端内置 Node 22.22.3），故 requires.node 写 >=22。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mcp_filesystem
display_name: Filesystem
display_name_en: Filesystem
version: 0.3.0
description: Filesystem MCP server.
description_zh: 受控文件系统读写 — 强制根目录沙箱,支持 list / read / write / edit / search / move。args 末 path 是允许根(可多个)。
author: upstream
homepage: https://github.com/modelcontextprotocol/servers
verified: true
category: media
tags:
- media
- preset
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@modelcontextprotocol/server-filesystem@2.4.0'
  - ${MCP_FS_ROOT}
  requires:
    node: '>=22'
requires_env:
- name: MCP_FS_ROOT
  env_key: MCP_FS_ROOT
  description: 允许读写的根目录（沙箱边界，只有这个目录下的文件可被访问）
  prompt: 请输入允许读写的根目录绝对路径
  secret: false
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 60
tools:
  probed_at: '2026-11-27T06:53:36Z'
  probed_runtime: npx
  count: 16
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
