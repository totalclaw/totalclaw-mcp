manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: youtube
display_name: mcp-youtube
display_name_en: mcp-youtube
version: 0.1.0
description: YouTube downloader for MCP
description_zh: 获取 YouTube 字幕 (另一版本)。
author: anaisbetts
license: MIT
homepage: https://github.com/anaisbetts/mcp-youtube
repository: https://github.com/anaisbetts/mcp-youtube
verified: false
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@anaisbetts/mcp-youtube@0.8.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
