# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: for_blender
display_name: blender-mcp
display_name_en: blender-mcp
version: 0.1.3
description: Open source Blender integration through the Model Context Protocol (not affiliated with Blender Foundation)
description_zh: 让 Claude 等 AI 直接控制 Blender 进行 3D 建模、场景创建与材质编辑，用自然语言完成三维内容创作。
author: ahujasid
license: MIT
homepage: https://github.com/ahujasid/blender-mcp
repository: https://github.com/ahujasid/blender-mcp
verified: true
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-for-blender==2.2.4
  env:
    BLENDER_MCP_DISABLE_TELEMETRY: 'true'
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
  # 关遥测：已装的老用户也由桌面端 MCP 医生 / agent mcp_hub 按这里补上（与 runtimes[].env 保持一致）
  enforced_env:
    BLENDER_MCP_DISABLE_TELEMETRY: 'true'
