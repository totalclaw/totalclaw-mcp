# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: image_gen
display_name: Image Generation
display_name_en: Image Generation
version: 0.1.0
description: An MCP server for image generation using the Replicate Flux model
description_zh: 使用 Replicate Flux 模型提供图像生成能力。
author: GongRzhe
license: MIT
homepage: https://github.com/GongRzhe/Image-Generation-MCP-Server
repository: https://github.com/GongRzhe/Image-Generation-MCP-Server
verified: false
category: media
tags:
- media
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@gongrzhe/image-gen-server@1.0.1'
  env:
    MODEL: alternative-model-name
  requires:
    node: '>=18'
requires_env:
- name: REPLICATE_API_TOKEN
  description: Image Generation 的访问令牌（REPLICATE_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 REPLICATE_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/GongRzhe/Image-Generation-MCP-Server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
