# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: moka
display_name: Moka 招聘
version: 0.1.0
description: 查询 Moka 招聘系统的职位、候选人投递记录与组织架构，跟踪招聘进展。
description_zh: 查询 Moka 招聘系统的职位、候选人投递记录与组织架构，跟踪招聘进展。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: hr
tags:
- totalclaw
- self-hosted
- 招聘
- 候选人
- 职位
- 组织架构
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - moka
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - totalclaw-mcp-servers==0.1.0
  - moka
  requires:
    python: '>=3.10'
requires_env:
- name: MOKA_API_SECRET
  env_key: MOKA_API_SECRET
  description: Moka 招聘 所需的 MOKA_API_SECRET
  prompt: 请输入 MOKA_API_SECRET
  secret: true
  required: true
- name: MOKA_API_KEY
  env_key: MOKA_API_KEY
  description: Moka 招聘 所需的 MOKA_API_KEY
  prompt: 请输入 MOKA_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 3
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
