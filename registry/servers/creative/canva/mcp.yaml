# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: canva
display_name: Canva 可画
display_name_en: Canva
version: 0.1.0
description: Search and manage Canva designs, autofill from brand templates, export to PDF/image/PPTX.
description_zh: 搜索与管理 Canva 设计稿，用品牌模板批量套用内容，导出为 PDF / 图片 / PPTX。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: creative
tags:
- totalclaw
- self-hosted
- 设计
- 海报
- 品牌模板
- 导出
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - canva
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - git+https://gitee.com/jlzdyx/totalclaw-mcp.git@289d9c344390b7ac433a17095c85f413237fbf50#subdirectory=servers
  - totalclaw-mcp-server
  - canva
  requires:
    python: '>=3.10'
    git: true
requires_env:
- name: CANVA_ACCESS_TOKEN
  env_key: CANVA_ACCESS_TOKEN
  description: Canva 可画 所需的 CANVA_ACCESS_TOKEN
  prompt: 请输入 CANVA_ACCESS_TOKEN
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 9
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
