# 由 scripts/import_vendor_mcp.py 生成——端点是厂商自有的 MCP 服务器，
# 上游连接器 id: infimind-ecommerce-image。人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: infimind_ecommerce_image
display_name: 极睿电商生图
version: 0.1.0
description: Generate KOC seeding collages, product main images, and product detail pages through MCP,
  then track task results.
description_zh: 通过 MCP 生成 KOC 种草拼图、商品主图与电商商品详情页，并查询任务生成结果。
author: vendor
category: creative
tags:
- creative
- vendor
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@infimind/image-mcp-cli@1.0.9'
  env:
    API_URL: https://aigc-next.ecpro.com
    MCP_TOKEN: ${MCP_TOKEN}
  requires:
    node: '>=18.0.0'
requires_env:
- name: MCP_TOKEN
  env_key: MCP_TOKEN
  description: 仅填写本人账户创建的独立 Token，请勿在其他 MCP 客户端复用。
  prompt: 登录极睿个人账户 → MCP Token 管理 → 创建 Token → 名称填写 WorkBuddy
  secret: true
  required: true
  doc_url: https://my.feishu.cn/wiki/X9vHw25KvidOhVktH7ScwZ5Anxb?fromScene=spaceOverview
  doc_label: 查看 WorkBuddy Token 获取与配置教程
optional_env: []
defaults:
  enabled: true
  timeout: 600
  tools:
    exclude:
    - get_user_credits
    - get_user_products
    - create_smart_refine_task
    - prepare_koc_collage_task
    - submit_koc_collage_task
    - create_image_expand_task
    - prepare_image_expand_task
    - submit_image_expand_task
    - create_color_change_task
    - create_visual_migration_task
    - create_koc_note_package_task
    - prepare_koc_note_package_task
    - submit_koc_note_package_task
security:
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
examples:
- 用这些商品图生成一组 KOC 种草拼图
- 根据商品素材生成一套电商详情页
- 用这些商品素材生成 5 张电商商品主图
