# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: jinshuju
display_name: 金数据
display_name_en: Jinshuju
version: 0.1.0
description: Query Jinshuju forms, field schema and submitted entries.
description_zh: 查询金数据的表单、字段结构与提交数据，用于汇总问卷、报名与收款记录。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: office
tags:
- totalclaw
- self-hosted
- 金数据
- 表单
- 问卷
- 报名
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - jinshuju
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - git+https://gitee.com/jlzdyx/totalclaw-mcp.git@289d9c344390b7ac433a17095c85f413237fbf50#subdirectory=servers
  - totalclaw-mcp-server
  - jinshuju
  requires:
    python: '>=3.10'
    git: true
requires_env:
- name: JINSHUJU_ACCESS_TOKEN
  env_key: JINSHUJU_ACCESS_TOKEN
  description: 金数据 所需的 JINSHUJU_ACCESS_TOKEN
  prompt: 请输入 JINSHUJU_ACCESS_TOKEN
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 4
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
