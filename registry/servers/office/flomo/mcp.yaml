# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: flomo
display_name: Flomo
display_name_en: Flomo
version: 0.1.1
description: A MCP server for Flomo
description_zh: 连接flomo的MCP服务器，支持卡片式笔记管理
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/mcp-server-flomo
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-server-flomo@0.0.11
  requires:
    node: '>=18'
requires_env:
- name: FLOMO_API_URL
  description: Flomo 的服务地址（FLOMO_API_URL），获取方式见项目说明。
  prompt: 请输入 FLOMO_API_URL
  secret: false
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
