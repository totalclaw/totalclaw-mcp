# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: evc_team_relay
display_name: evc-team-relay-mcp
display_name_en: evc-team-relay-mcp
version: 0.1.0
description: MCP server for reading and writing Obsidian vault documents via EVC Team Relay
description_zh: 通过 MCP 协议给 AI 代理提供对 Obsidian vault 的读写访问，支持团队协作和多用户共享。
author: entire-vc
license: MIT
homepage: https://github.com/entire-vc/evc-team-relay-mcp
repository: https://github.com/entire-vc/evc-team-relay-mcp
verified: false
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - evc-team-relay-mcp==1.0.9
  requires:
    python: '>=3.10'
requires_env:
- name: RELAY_CP_URL
  description: evc-team-relay-mcp 的服务地址（RELAY_CP_URL），获取方式见项目说明。
  prompt: 请输入 RELAY_CP_URL
  secret: false
  required: true
  doc_url: https://github.com/entire-vc/evc-team-relay-mcp
  doc_label: 查看项目说明（如何获取）
- name: RELAY_AGENT_KEY
  description: evc-team-relay-mcp 的配置项（RELAY_AGENT_KEY），获取方式见项目说明。
  prompt: 请输入 RELAY_AGENT_KEY
  secret: true
  required: true
  doc_url: https://github.com/entire-vc/evc-team-relay-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
