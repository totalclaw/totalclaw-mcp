manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: md_to_word_docx
display_name: md-to-word
display_name_en: md-to-word
version: 0.1.1
description: 'Deterministic Markdown to Word (.docx) compiler: declared typography, native equations, tables, cross-references,
  CSL bibliographies, pre- and post-export quality gates.'
description_zh: 确定性 Markdown 转出版级 Word（.docx）编译器：原生公式转 OMML、三线表、GB/T 7714 参考文献与带行号门禁，支持 Claude Desktop / Cursor 免安装（uvx）直接挂载，并附带在线体验站。
author: ls-open
license: MIT
homepage: https://github.com/ls-open/md-to-word
repository: https://github.com/ls-open/md-to-word
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - md-to-word-docx==3.6.0
  - md-to-word-mcp
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
