manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: kibela
display_name: mcp-kibela
display_name_en: mcp-kibela
version: 0.1.2
description: MCP server implementation that integrates with Kibela API
description_zh: 允许 AI 模型与 Kibela 交互。
author: kj455
license: MIT
homepage: https://github.com/kj455/mcp-kibela
repository: https://github.com/kj455/mcp-kibela
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@kj455/mcp-kibela@0.3.1'
  requires:
    node: '>=18'
requires_env:
- name: KIBELA_TEAM
  env_key: KIBELA_TEAM
  description: Kibela 团队名（xxx.kibe.la 的 xxx）。未设置时服务器启动即退出。
  prompt: 请输入 KIBELA_TEAM
  secret: false
  required: true
  doc_url: https://github.com/kj455/mcp-kibela
  doc_label: 查看项目说明（如何获取）
- name: KIBELA_TOKEN
  env_key: KIBELA_TOKEN
  description: Kibela 访问令牌。未设置时服务器启动即退出。
  prompt: 请输入 KIBELA_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/kj455/mcp-kibela
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:12Z'
  probed_runtime: npx
  count: 6
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
