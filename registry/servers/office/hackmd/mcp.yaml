# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: hackmd
display_name: hackmd-mcp
display_name_en: hackmd-mcp
version: 0.1.0
description: A Model Context Protocol server for integrating HackMD's note-taking platform with AI assistants.
description_zh: 允许 AI 模型与 HackMD 交互。
author: yuna0x0
license: MIT
homepage: https://github.com/yuna0x0/hackmd-mcp
repository: https://github.com/yuna0x0/hackmd-mcp
verified: false
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - hackmd-mcp@1.5.7
  requires:
    node: '>=18'
requires_env:
- name: HACKMD_API_TOKEN
  description: hackmd-mcp 的访问令牌（HACKMD_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 HACKMD_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/yuna0x0/hackmd-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
