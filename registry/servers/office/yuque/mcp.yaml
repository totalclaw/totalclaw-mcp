# 由 fau-tools/mcp-import 从 厂商官方说明（人工核实） 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: yuque
display_name: 语雀
display_name_en: ''
version: 0.1.1
description: MCP server for Yuque (语雀) — expose Yuque knowledge base to AI assistants via Model Context Protocol
description_zh: 语雀官方 MCP：搜索与读写知识库文档，管理目录。需要语雀个人访问令牌。
author: yuque
license: MIT
homepage: https://github.com/yuque/yuque-mcp-server
repository: https://github.com/yuque/yuque-mcp-server
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - yuque-mcp@1.0.0
  requires:
    node: '>=18'
requires_env:
- name: YUQUE_PERSONAL_TOKEN
  description: 语雀 的访问令牌（YUQUE_PERSONAL_TOKEN），获取方式见项目说明。
  prompt: 请输入 YUQUE_PERSONAL_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/yuque/yuque-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
