manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: docs
display_name: MCP Docs Server
display_name_en: MCP Docs Server
version: 0.1.1
description: MCP server for accessing Mastra.ai documentation, changelogs, and news.
description_zh: MCP文档服务器，支持MCP文档的读取和写入
author: upstream
license: Apache-2.0
homepage: https://www.npmjs.com/package/@mastra/mcp-docs-server
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
