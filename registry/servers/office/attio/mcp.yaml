# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: attio
display_name: attio-mcp-server
display_name_en: attio-mcp-server
version: 0.1.1
description: A Model Context Protocol server that connects Attio to LLMs
description_zh: 允许 AI 客户端在 Attio CRM 中管理记录和笔记。
author: hmk
license: BSD-3-Clause
homepage: https://github.com/hmk/attio-mcp-server
repository: https://github.com/hmk/attio-mcp-server
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - attio-mcp-server@0.0.2
  requires:
    node: '>=18'
requires_env:
- name: ATTIO_API_KEY
  description: attio-mcp-server 的API 密钥（ATTIO_API_KEY），获取方式见项目说明。
  prompt: 请输入 ATTIO_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/hmk/attio-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
