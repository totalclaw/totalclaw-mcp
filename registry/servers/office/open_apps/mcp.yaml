manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: open_apps
display_name: open-mcp-apps
display_name_en: open-mcp-apps
version: 0.1.0
description: 'Persistent, interactive MCP Apps for any MCP host: the AI builds an app once, you both reuse it — data outlives
  the conversation.'
description_zh: 开源 MCP Apps 引擎：AI 按需写出可交互的 UI 应用（待办看板、习惯打卡、仪表盘等），保存后可在后续任意对话中按名字直接打开；数据存放在独立的 collections 里，跨会话留存。内置 22 个现成应用的应用商店。
author: 2nd1st
license: MIT
homepage: https://github.com/2nd1st/open-mcp-apps
repository: https://github.com/2nd1st/open-mcp-apps
verified: false
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@2nd1st/open-mcp-apps@0.10.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
