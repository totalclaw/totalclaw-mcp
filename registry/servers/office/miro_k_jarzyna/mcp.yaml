# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: miro_k_jarzyna
display_name: mcp-miro
display_name_en: mcp-miro
version: 0.1.1
description: Miro integration for Model Context Protocol
description_zh: Miro MCP 服务器，暴露官方 Miro SDK 中可用的所有功能。
author: k-jarzyna
license: Apache-2.0
homepage: https://github.com/k-jarzyna/mcp-miro
repository: https://github.com/k-jarzyna/mcp-miro
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@k-jarzyna/mcp-miro@1.0.11'
  requires:
    node: '>=18'
requires_env:
- name: MIRO_ACCESS_TOKEN
  description: mcp-miro 的访问令牌（MIRO_ACCESS_TOKEN），获取方式见项目说明。
  prompt: 请输入 MIRO_ACCESS_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/k-jarzyna/mcp-miro
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
