# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
# 2026-11-26：补齐启动必需的凭据 / 参数声明（以前写 requires_env: []，装上即报缺变量退出）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: home_assistant
display_name: mcp-server-home-assistant
display_name_en: mcp-server-home-assistant
version: 0.1.3
description: A Model Context Protocol Server for Home Assistant
description_zh: 通过 MCP 服务器暴露所有 Home Assistant 语音意图，实现家庭控制。
author: allenporter
license: Apache-2.0
homepage: https://github.com/allenporter/mcp-server-home-assistant
repository: https://github.com/allenporter/mcp-server-home-assistant
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - mcp-server-home-assistant==0.1.0
  requires:
    python: '>=3.10'
requires_env:
- name: HOME_ASSISTANT_WEB_SOCKET_URL
  description: Home Assistant 的 WebSocket 地址，如 ws://homeassistant.local:8123/api/websocket。
  prompt: 请输入 Home Assistant WebSocket 地址
  secret: false
  required: true
  doc_url: https://github.com/allenporter/mcp-server-home-assistant
  doc_label: 查看项目说明（如何获取）
- name: HOME_ASSISTANT_API_TOKEN
  description: Home Assistant 长期访问令牌：个人资料 → 安全 → 长期访问令牌 → 创建令牌。
  prompt: 请输入 Home Assistant 长期访问令牌
  secret: true
  required: true
  doc_url: https://github.com/allenporter/mcp-server-home-assistant
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
