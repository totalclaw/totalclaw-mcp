# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：实探报缺凭据即退出，原先 requires_env 为空 —— 补必填 MAKE_API_KEY / MAKE_ZONE / MAKE_TEAM（变量名取自包报错 / 源码）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: makehq
display_name: Make
display_name_en: Make
version: 0.1.2
description: MCP server for interacting with Make automations
description_zh: Make 官方集成，将 Make 场景转换为 AI 助手可调用的工具。
author: integromat
license: MIT
homepage: https://github.com/integromat/make-mcp-server
repository: https://github.com/integromat/make-mcp-server
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@makehq/mcp-server@0.5.0'
  requires:
    node: '>=18'
requires_env:
- name: MAKE_API_KEY
  env_key: MAKE_API_KEY
  description: Make API Token。未设置时服务器启动即退出。
  prompt: 请输入 MAKE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/integromat/make-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: MAKE_ZONE
  env_key: MAKE_ZONE
  description: Make 账号所在区域主机，如 eu2.make.com。未设置时服务器启动即退出。
  prompt: 请输入 MAKE_ZONE
  secret: false
  required: true
  doc_url: https://github.com/integromat/make-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: MAKE_TEAM
  env_key: MAKE_TEAM
  description: Make 团队 ID（数字，在团队页面 URL 里）。未设置时服务器启动即退出。
  prompt: 请输入 MAKE_TEAM
  secret: false
  required: true
  doc_url: https://github.com/integromat/make-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
