manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: atlassian
display_name: mcp-atlassian
display_name_en: mcp-atlassian
version: 0.1.3
description: The Model Context Protocol (MCP) Atlassian integration is an open-source implementation that bridges Atlassian
  products (Jira and Confluence) with AI language models following Anthropic's MCP specification. This project enables secure,
  contextual AI interactions with Atlassian tools while maintainin
description_zh: Atlassian 产品 (Confluence 和 Jira) 的 MCP 服务器。支持 Cloud/Server/DC。提供全面的工具用于搜索、读取、创建和管理内容。
author: sooperset
license: MIT
homepage: https://github.com/sooperset/mcp-atlassian
repository: https://github.com/sooperset/mcp-atlassian
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-atlassian==0.24.7
  requires:
    python: '>=3.10'
requires_env:
- name: JIRA_URL
  description: mcp-atlassian 的服务地址（JIRA_URL），获取方式见项目说明。
  prompt: 请输入 JIRA_URL
  secret: false
  required: true
  doc_url: https://github.com/sooperset/mcp-atlassian
  doc_label: 查看项目说明（如何获取）
- name: JIRA_USERNAME
  description: mcp-atlassian 的用户名（JIRA_USERNAME），获取方式见项目说明。
  prompt: 请输入 JIRA_USERNAME
  secret: false
  required: true
  doc_url: https://github.com/sooperset/mcp-atlassian
  doc_label: 查看项目说明（如何获取）
- name: JIRA_API_TOKEN
  description: mcp-atlassian 的访问令牌（JIRA_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 JIRA_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/sooperset/mcp-atlassian
  doc_label: 查看项目说明（如何获取）
- name: CONFLUENCE_URL
  description: mcp-atlassian 的服务地址（CONFLUENCE_URL），获取方式见项目说明。
  prompt: 请输入 CONFLUENCE_URL
  secret: false
  required: true
  doc_url: https://github.com/sooperset/mcp-atlassian
  doc_label: 查看项目说明（如何获取）
- name: CONFLUENCE_USERNAME
  description: mcp-atlassian 的用户名（CONFLUENCE_USERNAME），获取方式见项目说明。
  prompt: 请输入 CONFLUENCE_USERNAME
  secret: false
  required: true
  doc_url: https://github.com/sooperset/mcp-atlassian
  doc_label: 查看项目说明（如何获取）
- name: CONFLUENCE_API_TOKEN
  description: mcp-atlassian 的访问令牌（CONFLUENCE_API_TOKEN），获取方式见项目说明。
  prompt: 请输入 CONFLUENCE_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/sooperset/mcp-atlassian
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
