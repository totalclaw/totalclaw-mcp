# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: notion
display_name: Notion
version: 0.1.0
description: Search, read and manage Notion pages and databases.
description_zh: 搜索、读取和管理 Notion 工作区中的页面与数据库。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: office
tags:
- totalclaw
- self-hosted
- 笔记
- 知识库
- 数据库
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - notion
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - totalclaw-mcp-servers==0.1.0
  - notion
  requires:
    python: '>=3.10'
requires_env:
- name: NOTION_API_KEY
  env_key: NOTION_API_KEY
  description: Notion 所需的 NOTION_API_KEY
  prompt: 请输入 NOTION_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 9
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
