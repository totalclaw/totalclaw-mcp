# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: taskade
display_name: Taskade MCP
display_name_en: Taskade MCP
version: 0.1.1
description: The **Workspace MCP** server connects any MCP-compatible AI client (Claude, Cursor, Claude Code, …) to your Taskade
  workspace, exposing **62 tools** to read and write your projects, tasks, agents, and custom fields.
description_zh: Taskade 官方 MCP 集成，连接任务、项目、自动化流程和 AI Agent，实现团队协作与工作流自动化。
author: taskade
license: MIT
homepage: https://github.com/taskade/mcp
repository: https://github.com/taskade/mcp
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@taskade/mcp-server@0.1.4'
  requires:
    node: '>=18'
requires_env:
- name: TASKADE_API_KEY
  description: Taskade MCP 的API 密钥（TASKADE_API_KEY），获取方式见项目说明。
  prompt: 请输入 TASKADE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/taskade/mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
