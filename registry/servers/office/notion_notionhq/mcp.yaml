# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: notion_notionhq
display_name: Notion
display_name_en: Notion
version: 0.1.0
description: Official MCP server for Notion API
description_zh: 连接Notion的MCP服务器，支持页面管理和数据操作
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/@notionhq/notion-mcp-server
verified: false
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@notionhq/notion-mcp-server@2.5.2'
  requires:
    node: '>=18'
requires_env:
- name: OPENAPI_MCP_HEADERS
  description: Notion 的配置项（OPENAPI_MCP_HEADERS），获取方式见项目说明。
  prompt: 请输入 OPENAPI_MCP_HEADERS
  secret: false
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
