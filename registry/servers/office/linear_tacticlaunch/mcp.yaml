manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: linear_tacticlaunch
display_name: mcp-linear
display_name_en: mcp-linear
version: 0.1.3
description: A Model Context Protocol (MCP) server implementation for the Linear GraphQL API that enables AI assistants to
  manage Linear projects and search issues by text, state, and date.
description_zh: 与 Linear 项目管理系统集成。
author: tacticlaunch
license: MIT
homepage: https://github.com/tacticlaunch/mcp-linear
repository: https://github.com/tacticlaunch/mcp-linear
verified: true
category: office
tags:
- office
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@tacticlaunch/mcp-linear@1.4.6'
  requires:
    node: '>=18'
requires_env:
- name: LINEAR_API_TOKEN
  env_key: LINEAR_API_TOKEN
  description: Linear 个人 API Key（Linear 设置 → Security & access）。未设置时服务器启动即退出。
  prompt: 请输入 LINEAR_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/tacticlaunch/mcp-linear
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:05Z'
  probed_runtime: npx
  count: 198
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
