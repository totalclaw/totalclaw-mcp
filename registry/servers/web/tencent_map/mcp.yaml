# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tencent_map
display_name: 腾讯地图
display_name_en: Tencent Maps
version: 0.1.0
description: Place search, route planning, geocoding, district lookup and distance matrix.
description_zh: 地点搜索、路线规划、地址与坐标互转、行政区划查询、距离矩阵计算。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: web
tags:
- totalclaw
- self-hosted
- 地图
- poi
- 路线规划
- 地理编码
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - tencent_map
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - git+https://gitee.com/jlzdyx/totalclaw-mcp.git@289d9c344390b7ac433a17095c85f413237fbf50#subdirectory=servers
  - totalclaw-mcp-server
  - tencent_map
  requires:
    python: '>=3.10'
    git: true
requires_env:
- name: TENCENT_MAP_KEY
  env_key: TENCENT_MAP_KEY
  description: 腾讯地图 所需的 TENCENT_MAP_KEY
  prompt: 请输入 TENCENT_MAP_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 7
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
