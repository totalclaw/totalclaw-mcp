manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: searxng
display_name: MCP-SearXNG
display_name_en: MCP-SearXNG
version: 0.1.0
description: MCP server for SearXNG integration
description_zh: 连接到 SearXNG 元搜索引擎实例。
author: ihor-sokoliuk
license: MIT
homepage: https://github.com/ihor-sokoliuk/mcp-searxng
repository: https://github.com/ihor-sokoliuk/mcp-searxng
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-searxng@2.9.0
  requires:
    node: '>=18'
requires_env:
- name: SEARXNG_URL
  description: MCP-SearXNG 的服务地址（SEARXNG_URL），获取方式见项目说明。
  prompt: 请输入 SEARXNG_URL
  secret: false
  required: true
  doc_url: https://github.com/ihor-sokoliuk/mcp-searxng
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
