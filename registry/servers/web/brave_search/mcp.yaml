# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: brave_search
display_name: Brave Search (官方)
display_name_en: ''
version: 0.1.1
description: 'Brave Search MCP Server: web results, images, videos, rich results, AI summaries, and more.'
description_zh: Brave 官方出品的搜索 MCP 服务器，支持网页、本地、图片、新闻、视频搜索。
author: brave
license: MIT
homepage: https://github.com/brave/brave-search-mcp-server
repository: https://github.com/brave/brave-search-mcp-server
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@brave/brave-search-mcp-server@2.1.4'
  - --transport
  - http
  requires:
    node: '>=18'
requires_env:
- name: BRAVE_API_KEY
  description: Brave Search (官方) 的API 密钥（BRAVE_API_KEY），获取方式见项目说明。
  prompt: 请输入 BRAVE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/brave/brave-search-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
