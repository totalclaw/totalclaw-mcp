version: 0.1.1
description: 按岗位要求检索 AI 与科技职位并按匹配度排序，可读取职位的申请表字段，并获取免费面试准备资料（工具 `search_jobs`、`get_job_form`、`get_learning_content`）。
description_zh: 按岗位要求检索 AI 与科技职位并按匹配度排序，可读取职位的申请表字段，并获取免费面试准备资料（工具 `search_jobs`、`get_job_form`、`get_learning_content`）。
author: landedjobs
