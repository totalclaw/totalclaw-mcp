# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: browser_kit
display_name: mcp-browser-kit
display_name_en: mcp-browser-kit
version: 0.1.1
description: An MCP server that enables AI assistants to interact with your local browsers.
description_zh: 用于与 manifest v2 兼容浏览器交互的 MCP 服务器。
author: ndthanhdev
license: MIT
homepage: https://github.com/ndthanhdev/mcp-browser-kit
repository: https://github.com/ndthanhdev/mcp-browser-kit
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@mcp-browser-kit/server@11.0.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
