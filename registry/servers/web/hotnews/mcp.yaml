manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: hotnews
display_name: HotNews
display_name_en: HotNews
version: 0.1.1
description: A Model Context Protocol server that provides real-time hot trending topics from major Chinese social platforms
  and news sites
description_zh: HotNews的MCP服务器，支持国内热点新闻的读取
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/@wopal/mcp-server-hotnews
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@wopal/mcp-server-hotnews@0.2.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
