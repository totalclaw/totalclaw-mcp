manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: cdp_bridge
display_name: cdp-bridge-mcp
display_name_en: cdp-bridge-mcp
version: 0.1.1
description: MCP server that bridges clients to a real browser through CDP and a companion extension.
description_zh: 通过 Chrome DevTools Protocol (CDP) 与配套浏览器扩展，将 MCP 客户端桥接到用户的真实浏览器，复用已有会话与登录态进行网页操作。
author: Unagi-cq
license: MIT
homepage: https://github.com/Unagi-cq/cdp-bridge-mcp
repository: https://github.com/Unagi-cq/cdp-bridge-mcp
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - cdp-bridge==0.1.25
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
