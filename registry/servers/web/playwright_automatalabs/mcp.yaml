manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: playwright_automatalabs
display_name: mcp-server-playwright
display_name_en: mcp-server-playwright
version: 0.1.1
description: MCP server for browser automation using Playwright
description_zh: 使用 Playwright 进行浏览器自动化的 MCP 服务器。
author: Automata-Labs-team
license: MIT
homepage: https://github.com/Automata-Labs-team/MCP-Server-Playwright
repository: https://github.com/Automata-Labs-team/MCP-Server-Playwright
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@automatalabs/mcp-server-playwright@1.2.1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
