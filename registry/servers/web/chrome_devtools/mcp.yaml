# 由 scripts/import_presets.py 生成；人工维护时请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: chrome_devtools
display_name: Chrome DevTools
display_name_en: Chrome DevTools
version: 0.1.0
description: Chrome DevTools MCP server.
description_zh: 谷歌浏览器(Chrome)DevTools 控制 — 自动化导航/点击/填表、性能 trace + Lighthouse 审计、网络请求观察、控制台日志读取、JS 执行、heap
  snapshot、屏幕截图、扩展安装。支持 --headless / --isolated / --browser-url 接已有 Chrome。
author: upstream
homepage: https://github.com/ChromeDevTools/chrome-devtools-mcp
category: web
tags:
- web
- preset
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - chrome-devtools-mcp@1.7.0
  env:
    CHROME_DEVTOOLS_MCP_NO_USAGE_STATISTICS: '1'
    CHROME_DEVTOOLS_MCP_NO_UPDATE_CHECKS: '1'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 180
