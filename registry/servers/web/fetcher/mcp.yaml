manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: fetcher
display_name: fetcher-mcp
display_name_en: fetcher-mcp
version: 0.1.2
description: MCP server for fetching web content using Playwright browser
description_zh: 使用 Playwright 无头浏览器获取网页内容，支持 JS 渲染和智能提取 (Markdown/HTML)。
author: jae-jae
license: ISC
homepage: https://github.com/jae-jae/fetcher-mcp
repository: https://github.com/jae-jae/fetcher-mcp
verified: true
category: web
