# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: google_search
display_name: Google Custom Search
display_name_en: Google Custom Search
version: 0.1.0
description: A Model Context Protocol server for Google Search
description_zh: 通过 Google 自定义搜索 API 提供 Google 搜索结果。
author: adenot
homepage: https://github.com/adenot/mcp-google-search
repository: https://github.com/adenot/mcp-google-search
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@adenot/mcp-google-search@0.3.1'
  requires:
    node: '>=18'
requires_env:
- name: GOOGLE_API_KEY
  description: Google Custom Search 的API 密钥（GOOGLE_API_KEY），获取方式见项目说明。
  prompt: 请输入 GOOGLE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/adenot/mcp-google-search
  doc_label: 查看项目说明（如何获取）
- name: GOOGLE_SEARCH_ENGINE_ID
  description: Google Custom Search 的ID（GOOGLE_SEARCH_ENGINE_ID），获取方式见项目说明。
  prompt: 请输入 GOOGLE_SEARCH_ENGINE_ID
  secret: false
  required: true
  doc_url: https://github.com/adenot/mcp-google-search
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
