# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: zoomeye
display_name: mcp_zoomeye
display_name_en: mcp_zoomeye
version: 0.1.1
description: A Model Context Protocol server providing tools for ZoomEye queries for LLMs
description_zh: 通过 ZoomEye MCP 服务器查询网络资产信息。
author: zoomeye-ai
license: MIT
homepage: https://github.com/zoomeye-ai/mcp_zoomeye
repository: https://github.com/zoomeye-ai/mcp_zoomeye
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-server-zoomeye==0.1.6
  requires:
    python: '>=3.10'
requires_env:
- name: ZOOMEYE_API_KEY
  description: mcp_zoomeye 的API 密钥（ZOOMEYE_API_KEY），获取方式见项目说明。
  prompt: 请输入 ZOOMEYE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/zoomeye-ai/mcp_zoomeye
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
