# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: octocrawl
display_name: Octocrawl
display_name_en: Octocrawl
version: 0.1.1
description: Octocrawl as an MCP server over stdio, a client of a running Octocrawl API (octocrawl serve).
description_zh: 把公开网页转成 Markdown 或结构化 JSON 交给 AI 代理，每条结果附带证据记录（最终 URL、抓取时间、HTTP 状态、robots.txt 判定、内容哈希）；页面被拦截、为空或内容不对时，返回状态和原因，而不是当作正文。提供
  scrape、map、crawl、batch_scrape 等工具。
author: 77777R7
license: AGPL-3.0-only
homepage: https://github.com/77777R7/Octocrawl
repository: https://github.com/77777R7/Octocrawl
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@octocrawl/mcp@0.8.13'
  - '#'
  - the
  - published
  - stdio
  - server,
  - a
  - client
  - of
  - that
  - API
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
