manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: brightdata
display_name: brightdata-mcp
display_name_en: brightdata-mcp
version: 0.1.3
description: An MCP interface into the Bright Data toolset
description_zh: Bright Data 官方出品，为 AI 代理提供一体化公网访问能力：实时网页搜索、抓取、绕过反爬与地理限制，获取干净结构化的网页数据。
author: brightdata
license: MIT
homepage: https://github.com/brightdata/brightdata-mcp
repository: https://github.com/brightdata/brightdata-mcp
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@brightdata/mcp@4.8.0'
  requires:
    node: '>=18'
requires_env:
- name: API_TOKEN
  env_key: API_TOKEN
  description: Bright Data API Token。未设置时服务器启动即退出。
  prompt: 请输入 API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/brightdata/brightdata-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:11Z'
  probed_runtime: npx
  count: 30
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
