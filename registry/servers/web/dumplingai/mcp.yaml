manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: dumplingai
display_name: mcp-server-dumplingai
display_name_en: mcp-server-dumplingai
version: 0.1.0
description: MCP Server for Dumpling AI providing various Data scraping, conversion, and extraction tools
description_zh: 访问 Dumpling AI 提供的数据、网页抓取和文档转换 API。
author: Dumpling-AI
license: MIT
homepage: https://github.com/Dumpling-AI/mcp-server-dumplingai
repository: https://github.com/Dumpling-AI/mcp-server-dumplingai
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-server-dumplingai@1.1.3
  requires:
    node: '>=18'
requires_env:
- name: DUMPLING_API_KEY
  description: mcp-server-dumplingai 的API 密钥（DUMPLING_API_KEY），获取方式见项目说明。
  prompt: 请输入 DUMPLING_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/Dumpling-AI/mcp-server-dumplingai
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
