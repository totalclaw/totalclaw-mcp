manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: browsermcp
display_name: Browser MCP
display_name_en: Browser MCP
version: 0.1.0
description: MCP server for browser automation using Browser MCP
description_zh: 浏览器集成的MCP服务器
author: upstream
license: Apache-2.0
homepage: https://www.npmjs.com/package/@browsermcp/mcp
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@browsermcp/mcp@2.1.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
