manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: agentql
display_name: AgentQL
display_name_en: AgentQL
version: 0.1.2
description: Model Context Protocol (MCP) server that integrates AgentQL data extraction capabilities.
description_zh: 让 AI 代理从非结构化网页中获取结构化数据。
author: tinyfish-io
license: MIT
homepage: https://github.com/tinyfish-io/agentql-mcp
repository: https://github.com/tinyfish-io/agentql-mcp
verified: true
category: web
tags:
