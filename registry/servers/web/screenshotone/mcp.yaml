# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: screenshotone
display_name: ScreenshotOne
display_name_en: ScreenshotOne
version: 0.1.2
description: Render website screenshots of any website and get them as images.
description_zh: 使用 ScreenshotOne 服务渲染网站截图。
author: screenshotone
license: MIT
homepage: https://github.com/screenshotone/mcp/
repository: https://github.com/screenshotone/mcp/
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@screenshotone/mcp@1.3.0'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
