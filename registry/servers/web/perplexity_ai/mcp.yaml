# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: perplexity_ai
display_name: Perplexity
display_name_en: Perplexity
version: 0.1.0
description: Real-time web search, reasoning, and research through Perplexity's API
description_zh: Perplexity 官方集成，连接 Perplexity Sonar API，实现实时全网研究。
author: ppl-ai
license: MIT
homepage: https://github.com/ppl-ai/modelcontextprotocol
repository: https://github.com/ppl-ai/modelcontextprotocol
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@perplexity-ai/mcp-server@1.3.0'
  requires:
    node: '>=18'
requires_env:
- name: PERPLEXITY_API_KEY
  description: Perplexity 的API 密钥（PERPLEXITY_API_KEY），获取方式见项目说明。
  prompt: 请输入 PERPLEXITY_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/ppl-ai/modelcontextprotocol
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
