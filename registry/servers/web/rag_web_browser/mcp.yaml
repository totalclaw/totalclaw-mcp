# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: rag_web_browser
display_name: RAG Web Browser
display_name_en: RAG Web Browser
version: 0.1.1
description: An MCP Server for RAG Web Browser Actor
description_zh: Apify 开源工具，执行网页搜索、抓取 URL 并以 Markdown 格式返回内容。
author: apify
license: Apache-2.0
homepage: https://github.com/apify/mcp-server-rag-web-browser
repository: https://github.com/apify/mcp-server-rag-web-browser
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@apify/mcp-server-rag-web-browser@0.1.4'
  requires:
    node: '>=18'
requires_env:
- name: APIFY_TOKEN
  description: RAG Web Browser 的访问令牌（APIFY_TOKEN），获取方式见项目说明。
  prompt: 请输入 APIFY_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/apify/mcp-server-rag-web-browser
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
