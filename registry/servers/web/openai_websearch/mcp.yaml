# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: openai_websearch
display_name: openai-websearch-mcp
display_name_en: openai-websearch-mcp
version: 0.1.0
description: using openai websearch as mcp server
description_zh: 提供 OpenAI `web_search` 内置工具的 Python MCP 服务器。
author: ConechoAI
homepage: https://github.com/ConechoAI/openai-websearch-mcp
repository: https://github.com/ConechoAI/openai-websearch-mcp
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - openai-websearch-mcp==0.4.3
  env:
    OPENAI_DEFAULT_MODEL: gpt-5-mini
  requires:
    python: '>=3.10'
requires_env:
- name: OPENAI_API_KEY
  description: openai-websearch-mcp 的API 密钥（OPENAI_API_KEY），获取方式见项目说明。
  prompt: 请输入 OPENAI_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/ConechoAI/openai-websearch-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
