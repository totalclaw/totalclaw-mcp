# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: trieve
display_name: trieve
display_name_en: trieve
version: 0.1.0
description: MCP server providing agentic tools for the Trieve API using Model Context Protocol (MCP)
description_zh: 通过 Trieve 爬取、嵌入、分块、搜索和检索数据集信息。
author: devflowinc
license: MIT
homepage: https://github.com/devflowinc/trieve/tree/main/clients/mcp-server
repository: https://github.com/devflowinc/trieve/tree/main/clients/mcp-server
verified: false
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - trieve-mcp-server@0.1.3
  env:
    TRIEVE_ORGANIZATION_ID: $TRIEVE_ORGANIZATION_ID
    TRIEVE_DATASET_ID: $TRIEVE_DATASET_ID
  requires:
    node: '>=18'
requires_env:
- name: TRIEVE_API_KEY
  description: trieve 的API 密钥（TRIEVE_API_KEY），获取方式见项目说明。
  prompt: 请输入 TRIEVE_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/devflowinc/trieve/tree/main/clients/mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
