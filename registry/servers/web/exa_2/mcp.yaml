# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: exa_2
display_name: Exa搜索
display_name_en: ''
version: 0.1.2
description: Connect AI agents to Exa for web search, content fetching, and multi-step research.
description_zh: 基于Exa的高质量网络搜索MCP服务器
author: upstream
license: MIT
homepage: https://www.npmjs.com/package/exa-mcp-server
verified: true
category: web
tags:
- web
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - exa-mcp-server@3.4.3
  requires:
    node: '>=18'
requires_env:
- name: EXA_API_KEY
  description: Exa搜索 的API 密钥（EXA_API_KEY），获取方式见项目说明。
  prompt: 请输入 EXA_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
