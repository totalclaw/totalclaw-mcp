# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: bigquery
display_name: mcp-bigquery-server
display_name_en: mcp-bigquery-server
version: 0.1.1
description: MCP server for interacting with BigQuery databases
description_zh: Google BigQuery 集成的服务器实现，支持直接访问和查询。
author: ergut
license: MIT
homepage: https://github.com/ergut/mcp-bigquery-server
repository: https://github.com/ergut/mcp-bigquery-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@ergut/mcp-bigquery-server@1.0.4'
  - --project-id
  - ${MCP_BIGQUERY_PROJECT_ID}
  requires:
    node: '>=18'
requires_env:
- name: PROJECT_ID
  env_key: MCP_BIGQUERY_PROJECT_ID
  description: mcp-bigquery-server 的启动参数（--project-id），示例：your-project-id
  prompt: 请输入 PROJECT_ID
  secret: false
  required: true
  doc_url: https://github.com/ergut/mcp-bigquery-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
