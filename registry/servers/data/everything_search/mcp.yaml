manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: everything_search
display_name: mcp-everything-search
display_name_en: mcp-everything-search
version: 0.1.1
description: A Model Context Protocol server providing fast file searching using Everything SDK
description_zh: 在 Windows 上使用 Everything SDK 快速搜索文件。 (Awesome列表更通用)
author: mamertofabian
license: MIT
homepage: https://github.com/mamertofabian/mcp-everything-search
repository: https://github.com/mamertofabian/mcp-everything-search
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-server-everything-search==0.3.3
  requires:
    python: '>=3.10'
requires_env: []
optional_env:
- name: EVERYTHING_SDK_PATH
  description: mcp-everything-search 的路径（EVERYTHING_SDK_PATH），不填用默认值 C:\path\to\Everything-SDK\dll\Everything64.dll。
  prompt: 请输入 EVERYTHING_SDK_PATH
  secret: false
  required: false
  doc_url: https://github.com/mamertofabian/mcp-everything-search
  doc_label: 查看项目说明（如何获取）
  default: C:\path\to\Everything-SDK\dll\Everything64.dll
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T07:58:45Z'
  probed_runtime: uvx
  count: 1
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
