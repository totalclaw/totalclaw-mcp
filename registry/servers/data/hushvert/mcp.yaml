# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: hushvert
display_name: mcp
display_name_en: mcp
version: 0.1.0
description: 'Model Context Protocol server for hushvert: gives an AI agent a convert_file tool over the hosted file-conversion
  API (office to PDF, PDF to Word, large video). Pairs a browser cannot do, billed per use.'
description_zh: 面向 AI 智能体的文件转换服务：通过 hushvert 托管 API 完成 Office 文档转 PDF、PDF 转 Word、文档互转（Markdown/HTML/EPUB/LaTeX）与音视频转码；浏览器可本地完成的转换会引导使用免费本地引擎而不计费。
author: hushvert
license: MIT
homepage: https://github.com/hushvert/mcp
repository: https://github.com/hushvert/mcp
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@hushvert/mcp@0.1.3'
  requires:
    node: '>=18'
requires_env:
- name: HUSHVERT_API_KEY
  description: mcp 的API 密钥（HUSHVERT_API_KEY），获取方式见项目说明。
  prompt: 请输入 HUSHVERT_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/hushvert/mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
