# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: airtable_rashidazarang
display_name: airtable-mcp
display_name_en: airtable-mcp
version: 0.1.1
description: Advanced AI-powered Airtable MCP server with TypeScript support, intelligent analytics, predictive modeling,
  and enterprise automation capabilities
description_zh: 将 AI 工具直接连接到 Airtable。使用自然语言查询、创建、更新和删除记录。功能包括库管理、表操作等。
author: rashidazarang
license: MIT
homepage: https://github.com/rashidazarang/airtable-mcp
repository: https://github.com/rashidazarang/airtable-mcp
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@rashidazarang/airtable-mcp@4.0.1'
  requires:
    node: '>=18'
requires_env:
- name: AIRTABLE_TOKEN
  description: airtable-mcp 的访问令牌（AIRTABLE_TOKEN），获取方式见项目说明。
  prompt: 请输入 AIRTABLE_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/rashidazarang/airtable-mcp
  doc_label: 查看项目说明（如何获取）
- name: AIRTABLE_BASE_ID
  description: airtable-mcp 的服务地址（AIRTABLE_BASE_ID），获取方式见项目说明。
  prompt: 请输入 AIRTABLE_BASE_ID
  secret: false
  required: true
  doc_url: https://github.com/rashidazarang/airtable-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
