# 由 fau-tools/mcp-import 从 mcp-cn 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: supabase_2
display_name: Supabase
display_name_en: Supabase
version: 0.1.2
description: MCP server for interacting with Supabase
description_zh: 连接Supabase数据库的MCP服务器，支持数据管理和查询
author: upstream
license: Apache-2.0
homepage: https://www.npmjs.com/package/@supabase/mcp-server-supabase
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@supabase/mcp-server-supabase@0.18.0'
  requires:
    node: '>=18'
requires_env:
- name: SUPABASE_ACCESS_TOKEN
  description: Supabase 的访问令牌（SUPABASE_ACCESS_TOKEN），获取方式见项目说明。
  prompt: 请输入 SUPABASE_ACCESS_TOKEN
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
