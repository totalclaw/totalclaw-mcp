# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: bigquery_lucashild
display_name: BigQuery (by LucasHild)
display_name_en: BigQuery (by LucasHild)
version: 0.1.0
description: A Model Context Protocol server that provides access to BigQuery. This server enables LLMs to inspect database
  schemas and execute queries.
description_zh: 让 AI 检查 BigQuery 数据库模式并执行查询。
author: LucasHild
homepage: https://github.com/LucasHild/mcp-server-bigquery
repository: https://github.com/LucasHild/mcp-server-bigquery
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-server-bigquery==0.3.2
  - --project
  - ${MCP_BIGQUERY_LUCASHILD_PROJECT}
  - --location
  - ${MCP_BIGQUERY_LUCASHILD_LOCATION}
  requires:
    python: '>=3.10'
requires_env:
- name: PROJECT
  env_key: MCP_BIGQUERY_LUCASHILD_PROJECT
  description: BigQuery (by LucasHild) 的启动参数（--project），示例：{PROJECT_ID}
  prompt: 请输入 PROJECT
  secret: false
  required: true
  doc_url: https://github.com/LucasHild/mcp-server-bigquery
  doc_label: 查看项目说明（如何获取）
- name: LOCATION
  env_key: MCP_BIGQUERY_LUCASHILD_LOCATION
  description: BigQuery (by LucasHild) 的启动参数（--location），示例：{{LOCATION}}
  prompt: 请输入 LOCATION
  secret: false
  required: true
  doc_url: https://github.com/LucasHild/mcp-server-bigquery
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
