# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: dchub
display_name: DC Hub
display_name_en: DC Hub
version: 0.1.0
description: 'DC Hub MCP launcher: DCPI (Data Center Power Index) scores where data centers can get grid power across 300+
  markets, plus live grid, fiber and site-selection data for AI agents (94 tools). Connects stdio MCP clients to dchub.cloud/mcp.'
description_zh: 数据中心选址的实时数据层。其 DCPI（DC Hub 电力指数）每日评估 300+ 市场中数据中心可获得电网供电的程度。94 个工具覆盖电网、能源价格、并网排队、光纤与选址分析，远程 MCP：`https://dchub.cloud/mcp`。
author: azmartone67
license: MIT
homepage: https://github.com/azmartone67/dchub-mcp-server
repository: https://github.com/azmartone67/dchub-mcp-server
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - dchub-mcp-server@2.12.44
  requires:
    node: '>=18'
requires_env:
- name: DCHUB_API_KEY
  description: DC Hub 的API 密钥（DCHUB_API_KEY），获取方式见项目说明。
  prompt: 请输入 DCHUB_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/azmartone67/dchub-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
