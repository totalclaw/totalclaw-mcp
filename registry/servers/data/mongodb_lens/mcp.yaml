# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mongodb_lens
display_name: mongodb-lens
display_name_en: mongodb-lens
version: 0.1.1
description: 'MongoDB Lens: Full Featured MCP Server for MongoDB Databases'
description_zh: 功能齐全的 MongoDB 数据库 MCP 服务器。
author: furey
license: MIT
homepage: https://github.com/furey/mongodb-lens
repository: https://github.com/furey/mongodb-lens
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mongodb-lens@9.1.4
  - ${MCP_MONGODB_LENS_PATH}
  env:
    CONFIG_LOG_LEVEL: verbose
  requires:
    node: '>=18'
requires_env:
- name: PATH
  env_key: MCP_MONGODB_LENS_PATH
  description: mongodb-lens 的启动参数，示例：mongodb://your-connection-string
  prompt: 请输入 PATH
  secret: false
  required: true
  doc_url: https://github.com/furey/mongodb-lens
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
