manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: nocodb
display_name: nocodb-mcp-server
display_name_en: nocodb-mcp-server
version: 0.1.2
description: Model Context Protocol server for nocodb
description_zh: Nocodb 数据库集成，读写能力。
author: edwinbernadus
license: MIT
homepage: https://github.com/edwinbernadus/nocodb-mcp-server
repository: https://github.com/edwinbernadus/nocodb-mcp-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - nocodb-mcp-server@1.0.24
  requires:
    node: '>=18'
requires_env:
- name: NOCODB_URL
  env_key: NOCODB_URL
  description: NocoDB 服务地址，如 https://app.nocodb.com。未设置时服务器启动即退出。
  prompt: 请输入 NOCODB_URL
  secret: false
  required: true
  doc_url: https://github.com/edwinbernadus/nocodb-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: NOCODB_BASE_ID
  env_key: NOCODB_BASE_ID
  description: NocoDB Base ID。未设置时服务器启动即退出。
  prompt: 请输入 NOCODB_BASE_ID
  secret: false
  required: true
  doc_url: https://github.com/edwinbernadus/nocodb-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: NOCODB_API_TOKEN
  env_key: NOCODB_API_TOKEN
  description: NocoDB API Token。未设置时服务器启动即退出。
  prompt: 请输入 NOCODB_API_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/edwinbernadus/nocodb-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:44:13Z'
