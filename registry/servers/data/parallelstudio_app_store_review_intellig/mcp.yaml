manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: parallelstudio_app_store_review_intellig
display_name: App Store & Google Play Review Intelligence
display_name_en: App Store & Google Play Review Intelligence
version: 0.1.1
description: 分析任意 iOS / Android 应用的用户评论：主要差评主题（附原文引用）、按版本的评分变化、最新版本相比上一版哪些问题变多，以及 2–10 个竞品对比。4 个只读工具：search_apps、review_insights、get_app_reviews、compare_apps，无需
  App Store Connect 或 Play Console 权限。
description_zh: 分析任意 iOS / Android 应用的用户评论：主要差评主题（附原文引用）、按版本的评分变化、最新版本相比上一版哪些问题变多，以及 2–10 个竞品对比。4 个只读工具：search_apps、review_insights、get_app_reviews、compare_apps，无需
  App Store Connect 或 Play Console 权限。
author: gunnargray-dev
homepage: https://github.com/gunnargray-dev/app-store-review-intelligence-mcp
repository: https://github.com/gunnargray-dev/app-store-review-intelligence-mcp
