manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: chart
display_name: AntV mcp-server-chart
display_name_en: AntV mcp-server-chart
version: 0.1.0
description: A Model Context Protocol server for generating charts using AntV. This is a TypeScript-based MCP server that
  provides chart generation capabilities. It allows you to create various types of charts through MCP tools.
description_zh: 蚂蚁 AntV 官方图表 MCP：25+ 种可视化图表（折线、柱状、饼图、桑基、思维导图、流程图、地理图等），让 AI 直接产出图表并返回图片链接。
author: antvis
license: MIT
homepage: https://github.com/antvis/mcp-server-chart
repository: https://github.com/antvis/mcp-server-chart
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@antv/mcp-server-chart@0.9.10'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
