# 由 scripts/gen_manifests.py 从 servers/ 的自研实现生成，请勿手改。
# 实现位置：servers/totalclaw_mcp_servers/{packs,native}/
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tianyancha
display_name: 天眼查
display_name_en: Tianyancha
version: 0.1.0
description: Look up Chinese company registration, shareholders, staff, investments, changes and lawsuits
  via Tianyancha.
description_zh: 查询企业工商登记、股东出资、主要人员、对外投资、变更记录与法律诉讼等公开企业数据。
author: totalclaw
license: Apache-2.0
homepage: https://gitee.com/jlzdyx/totalclaw-mcp
category: data
tags:
- totalclaw
- self-hosted
- 天眼查
- 工商
- 股东
- 诉讼
- 企业信息
kind: mcp_server
runtimes:
- id: console
  type: stdio
  launcher: binary
  command: totalclaw-mcp-server
  args:
  - tianyancha
  requires:
    python: '>=3.10'
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - git+https://gitee.com/jlzdyx/totalclaw-mcp.git@289d9c344390b7ac433a17095c85f413237fbf50#subdirectory=servers
  - totalclaw-mcp-server
  - tianyancha
  requires:
    python: '>=3.10'
    git: true
requires_env:
- name: TIANYANCHA_TOKEN
  env_key: TIANYANCHA_TOKEN
  description: 天眼查 所需的 TIANYANCHA_TOKEN
  prompt: 请输入 TIANYANCHA_TOKEN
  secret: true
  required: true
optional_env: []
defaults:
  enabled: false
  timeout: 120
  connect_timeout: 60
tools:
  probed_runtime: console
  count: 10
  file: tools.json
security:
  scan_verdict: allow
  prompt_injection_findings: []
  osv: clean
  note: 本仓自研实现，非第三方托管端点
