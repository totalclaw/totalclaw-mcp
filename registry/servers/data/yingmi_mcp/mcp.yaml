# 由 scripts/import_vendor_mcp.py 生成——端点是厂商自有的 MCP 服务器，
# 上游连接器 id: yingmi-mcp。人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: yingmi_mcp
display_name: 盈米MCP
version: 0.1.0
description: Access fund and market data for investment research, portfolio analysis, wealth planning,
  and financial content creation.
description_zh: 查询基金与市场数据，完成基金研究、组合分析、财富规划及金融内容生成。
author: vendor
category: data
tags:
- data
- vendor
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://stargate.yingmi.com/mcp/v2?apiKey=${YINGMI_API_KEY}
  auth: none
requires_env:
- name: YINGMI_API_KEY
  env_key: YINGMI_API_KEY
  description: 盈米MCP 所需的 YINGMI_API_KEY
  prompt: 请输入 YINGMI_API_KEY
  secret: true
  required: true
optional_env: []
defaults:
  enabled: true
  timeout: 30
security:
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
homepage: https://stargate.yingmi.com
examples:
- 查询基金 005827 的基本信息和近期表现
- 分析这几只基金的底层资产分布和组合风险
- 根据家庭收支和目标制定一份财富规划方案
- 查询今天的市场热点并生成一份市场简报
