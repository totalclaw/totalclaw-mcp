# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mysql_f4ww4z
display_name: mcp-mysql-server
display_name_en: mcp-mysql-server
version: 0.1.1
description: A Model Context Protocol server for MySQL database operations
description_zh: 基于 Node.js 的 MySQL 数据库集成，提供安全的数据库操作。
author: f4ww4z
license: MIT
homepage: https://github.com/f4ww4z/mcp-mysql-server
repository: https://github.com/f4ww4z/mcp-mysql-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@f4ww4z/mcp-mysql-server@0.1.0'
  - ${MCP_MYSQL_F4WW4Z_PATH}
  requires:
    node: '>=18'
requires_env:
- name: PATH
  env_key: MCP_MYSQL_F4WW4Z_PATH
  description: mcp-mysql-server 的启动参数，示例：mysql://user:password@localhost:port/database
  prompt: 请输入 PATH
  secret: false
  required: true
  doc_url: https://github.com/f4ww4z/mcp-mysql-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
