# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: database
display_name: legion-mcp
display_name_en: legion-mcp
version: 0.1.0
description: A MCP server that helps access and query data in various popular databases
description_zh: 通用数据库 MCP 服务器，支持 PG, Redshift, CockroachDB, MySQL, RDS MySQL, MS SQL Server, BigQuery, Oracle DB, SQLite。
author: TheRaLabs
homepage: https://github.com/TheRaLabs/legion-mcp
repository: https://github.com/TheRaLabs/legion-mcp
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - database-mcp==0.1.4
  requires:
    python: '>=3.10'
requires_env: []
optional_env:
- name: DB_CONFIGS
  description: legion-mcp 的配置项（DB_CONFIGS），不填用默认值 [{"id":"pg_main","db_type":"pg","configuration":{"host":"localhost","port":5432,。
  prompt: 请输入 DB_CONFIGS
  secret: false
  required: false
  doc_url: https://github.com/TheRaLabs/legion-mcp
  doc_label: 查看项目说明（如何获取）
  default: '[{"id":"pg_main","db_type":"pg","configuration":{"host":"localhost","port":5432,"user":"user","password":"pw","dbname":"postgres"},"description":"PostgreSQL
    Database"},{"id":"mysql_data","db_type":"mysql","configuration":{"host":"localhost","port":3306,"user":"root","password":"pass","database":"mysql"},"description":"MySQL
    Database"}]'
defaults:
  enabled: true
  timeout: 120
