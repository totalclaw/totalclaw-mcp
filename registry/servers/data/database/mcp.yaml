# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
# 2026-11-26 复扫：拒绝（详见 docs/removed-2026-11-26.md）
# 审核意见：人工复核（2026-11-26）：装上必挂且无法在清单层面修复——依赖链 legion-query-runner 所有版本硬依赖 mysqlclient==2.1.1，该包只发布 Windows 预编译包，macOS / Linux 必须本机装 MySQL 开发库（mysql_config）现场编译，普通用户装不上
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: database
display_name: legion-mcp
display_name_en: legion-mcp
version: 0.1.3
description: A MCP server that helps access and query data in various popular databases
description_zh: 通用数据库 MCP 服务器，支持 PG, Redshift, CockroachDB, MySQL, RDS MySQL, MS SQL Server, BigQuery, Oracle DB, SQLite。
author: TheRaLabs
license: GPL-3.0-or-later
homepage: https://github.com/TheRaLabs/legion-mcp
repository: https://github.com/TheRaLabs/legion-mcp
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - database-mcp==0.1.4
  requires:
    python: '>=3.10'
requires_env: []
optional_env:
- name: DB_CONFIGS
  description: legion-mcp 的配置项（DB_CONFIGS），不填用默认值 [{"id":"pg_main","db_type":"pg","configuration":{"host":"localhost","port":5432,。
  prompt: 请输入 DB_CONFIGS
  secret: false
  required: false
  doc_url: https://github.com/TheRaLabs/legion-mcp
  doc_label: 查看项目说明（如何获取）
  default: '[{"id":"pg_main","db_type":"pg","configuration":{"host":"localhost","port":5432,"user":"user","password":"pw","dbname":"postgres"},"description":"PostgreSQL
    Database"},{"id":"mysql_data","db_type":"mysql","configuration":{"host":"localhost","port":3306,"user":"root","password":"pass","database":"mysql"},"description":"MySQL
    Database"}]'
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: block
  reason: "人工复核（2026-11-26）：装上必挂且无法在清单层面修复——依赖链 legion-query-runner 所有版本硬依赖 mysqlclient==2.1.1，该包只发布 Windows 预编译包，macOS / Linux 必须本机装 MySQL 开发库（mysql_config）现场编译，普通用户装不上"
  osv: clean
