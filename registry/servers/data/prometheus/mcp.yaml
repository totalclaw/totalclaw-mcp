# 人工修改后请同步递增 version。
# 2026-11-27：包提供的可执行名与包名不同，uvx 按包名找命令会直接报「executable not provided」，改用 `--from 包==版本 可执行名`；另补必填 PROMETHEUS_URL（未设置时启动即退出）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: prometheus
display_name: prometheus-mcp-server
display_name_en: prometheus-mcp-server
version: 0.1.2
description: MCP server for Prometheus integration
description_zh: 查询和分析 Prometheus 开源监控系统。
author: pab1it0
license: MIT
homepage: https://github.com/pab1it0/prometheus-mcp-server
repository: https://github.com/pab1it0/prometheus-mcp-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - prometheus_mcp_server==1.6.2
  - prometheus-mcp-server
  requires:
    python: '>=3.10'
requires_env:
- name: PROMETHEUS_URL
  env_key: PROMETHEUS_URL
  description: Prometheus 服务器地址，如 http://localhost:9090。未设置时服务器启动即退出。
  prompt: 请输入 Prometheus 服务器地址
  secret: false
  required: true
  doc_url: https://github.com/pab1it0/prometheus-mcp-server
  doc_label: 查看项目说明（可选的用户名 / 密码 / Token 等）
optional_env: []
defaults:
  enabled: true
  timeout: 120
tools:
  probed_at: '2026-11-27T09:30:36Z'
  probed_runtime: uvx
  count: 6
  file: tools.json
security:
  scan_verdict: allow
  osv: clean
  prompt_injection_findings: []
