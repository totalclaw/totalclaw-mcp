# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: singlestore
display_name: SingleStore
display_name_en: SingleStore
version: 0.1.2
description: SingleStore MCP server
description_zh: SingleStore 官方集成，与 SingleStore 数据库平台交互。
author: singlestore-labs
license: MIT
homepage: https://github.com/singlestore-labs/mcp-server-singlestore
repository: https://github.com/singlestore-labs/mcp-server-singlestore
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - singlestore-mcp-server==0.4.19
  - start
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
