# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mysql
display_name: mysql_mcp_server
display_name_en: mysql_mcp_server
version: 0.1.0
description: A Model Context Protocol (MCP) server that enables secure interaction with MySQL databases. This server allows
  AI assistants to list tables, read data, and execute SQL queries through a controlled interface, making database exploration
  and analysis safer and more structured.
description_zh: Python 实现的 MySQL 集成，带访问控制和模式检查。
author: designcomputer
homepage: https://github.com/designcomputer/mysql_mcp_server
repository: https://github.com/designcomputer/mysql_mcp_server
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - mysql-mcp-server==0.4.4
  - mysql_mcp_server
  requires:
    python: '>=3.10'
requires_env:
- name: MYSQL_USER
  description: mysql_mcp_server 的用户名（MYSQL_USER），获取方式见项目说明。
  prompt: 请输入 MYSQL_USER
  secret: false
  required: true
  doc_url: https://github.com/designcomputer/mysql_mcp_server
  doc_label: 查看项目说明（如何获取）
- name: MYSQL_PASSWORD
  description: mysql_mcp_server 的密码（MYSQL_PASSWORD），获取方式见项目说明。
  prompt: 请输入 MYSQL_PASSWORD
  secret: true
  required: true
  doc_url: https://github.com/designcomputer/mysql_mcp_server
  doc_label: 查看项目说明（如何获取）
- name: MYSQL_DATABASE
  description: mysql_mcp_server 的服务地址（MYSQL_DATABASE），获取方式见项目说明。
  prompt: 请输入 MYSQL_DATABASE
  secret: false
  required: true
  doc_url: https://github.com/designcomputer/mysql_mcp_server
  doc_label: 查看项目说明（如何获取）
optional_env:
- name: MYSQL_HOST
  description: mysql_mcp_server 的主机地址（MYSQL_HOST），不填用默认值 localhost。
  prompt: 请输入 MYSQL_HOST
  secret: false
  required: false
  doc_url: https://github.com/designcomputer/mysql_mcp_server
  doc_label: 查看项目说明（如何获取）
  default: localhost
- name: MYSQL_PORT
  description: mysql_mcp_server 的端口（MYSQL_PORT），不填用默认值 3306。
  prompt: 请输入 MYSQL_PORT
  secret: false
  required: false
  doc_url: https://github.com/designcomputer/mysql_mcp_server
  doc_label: 查看项目说明（如何获取）
  default: '3306'
defaults:
  enabled: true
  timeout: 120
