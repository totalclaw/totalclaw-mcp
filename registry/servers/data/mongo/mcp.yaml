# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：实探报缺凭据即退出，原先 requires_env 为空 —— 补必填 MCP_MONGODB_URI（变量名取自包报错 / 源码）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mongo
display_name: mcp-mongo-server
display_name_en: mcp-mongo-server
version: 0.1.3
description: A Model Context Protocol server for MongoDB connections
description_zh: 用于 MongoDB 的模型上下文协议服务器。
author: kiliczsh
license: MIT
homepage: https://github.com/kiliczsh/mcp-mongo-server
repository: https://github.com/kiliczsh/mcp-mongo-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-mongo-server@3.2.1
  requires:
    node: '>=18'
requires_env:
- name: MCP_MONGODB_URI
  env_key: MCP_MONGODB_URI
  description: MongoDB 连接串，如 mongodb://user:pass@host:27017/db。未设置时服务器启动即退出。
  prompt: 请输入 MCP_MONGODB_URI
  secret: true
  required: true
  doc_url: https://github.com/kiliczsh/mcp-mongo-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
