# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-27 静态审核：通过（详见 docs/review-2026-11-27-upstream2.md）
# 人工修改后请同步递增 version。
# 2026-11-27：实探报缺凭据即退出，原先 requires_env 为空 —— 补必填 --prebuilt=postgres 需要的 POSTGRES_DATABASE / USER / PASSWORD（变量名取自包报错 / 源码）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: toolbox_sdk
display_name: genai-toolbox
display_name_en: genai-toolbox
version: 0.1.4
description: A CLI tool for running a toolbox server.
description_zh: Google 官方开源 MCP 服务器，专注于为数据库提供简单、快速、安全的工具。
author: googleapis
license: Apache-2.0
homepage: https://github.com/googleapis/genai-toolbox
repository: https://github.com/googleapis/genai-toolbox
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@toolbox-sdk/server@1.18.0'
  - --prebuilt=postgres
  - --stdio
  requires:
    node: '>=18'
requires_env:
- name: POSTGRES_DATABASE
  env_key: POSTGRES_DATABASE
  description: PostgreSQL 数据库名。未设置时服务器启动即退出。
  prompt: 请输入 POSTGRES_DATABASE
  secret: false
  required: true
  doc_url: https://github.com/googleapis/genai-toolbox
  doc_label: 查看项目说明（如何获取）
- name: POSTGRES_USER
  env_key: POSTGRES_USER
  description: PostgreSQL 用户名。未设置时服务器启动即退出。
  prompt: 请输入 POSTGRES_USER
  secret: false
  required: true
  doc_url: https://github.com/googleapis/genai-toolbox
  doc_label: 查看项目说明（如何获取）
- name: POSTGRES_PASSWORD
  env_key: POSTGRES_PASSWORD
  description: PostgreSQL 密码。未设置时服务器启动即退出。
  prompt: 请输入 POSTGRES_PASSWORD
  secret: true
  required: true
  doc_url: https://github.com/googleapis/genai-toolbox
  doc_label: 查看项目说明（如何获取）
optional_env:
- name: POSTGRES_HOST
  env_key: POSTGRES_HOST
  description: PostgreSQL 主机，不填用默认值。
  prompt: 请输入 POSTGRES_HOST
  secret: false
  required: false
  doc_url: https://github.com/googleapis/genai-toolbox
  doc_label: 查看项目说明（如何获取）
- name: POSTGRES_PORT
  env_key: POSTGRES_PORT
  description: PostgreSQL 端口，不填用默认值。
  prompt: 请输入 POSTGRES_PORT
  secret: false
  required: false
  doc_url: https://github.com/googleapis/genai-toolbox
  doc_label: 查看项目说明（如何获取）
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
