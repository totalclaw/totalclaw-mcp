# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: toolbox_sdk
display_name: genai-toolbox
display_name_en: genai-toolbox
version: 0.1.1
description: A CLI tool for running a toolbox server.
description_zh: Google 官方开源 MCP 服务器，专注于为数据库提供简单、快速、安全的工具。
author: googleapis
license: Apache-2.0
homepage: https://github.com/googleapis/genai-toolbox
repository: https://github.com/googleapis/genai-toolbox
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@toolbox-sdk/server@1.15.0'
  - --prebuilt=postgres
  - --stdio
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
