# 由 scripts/import_vendor_mcp.py 生成——端点是厂商自有的 MCP 服务器，
# 上游连接器 id: finenter。人工修改后请同步递增 version。
# 上游配置写的是 sse（agent 不支持）。把路径末段 /sse 换成 /mcp 后实测端点存在
# 且说 streamable-HTTP，故改用 http runtime；实测记录见 docs/TODO.md B 层。
# 实测该端点返回标准 MCP OAuth 质询（WWW-Authenticate 带 resource_metadata），
# 故 auth: oauth —— 不需要预置凭据，装完跑 totalclaw mcp login <名> 浏览器授权。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: finenter
display_name: 进门投研
display_name_en: Finenter
version: 0.1.0
description: Finenter MCP covers public roadshow content from securities firms, listed companies, and
  asset management institutions; integrates institutional-grade insights from domestic and international
  research reports and brokerage commentary; and provides real-time market data, financial data, quantitative
  factors, and more. Data Agent cleansing and structuring reduce token usage and improve response accuracy.
description_zh: 进门MCP覆盖券商、上市公司及资管机构的公开路演内容，整合内外资研报、券商点评等机构级观点，并提供实时行情、财务及量化因子等数据。经Data Agent清洗与结构化处理，减少Token消耗，提升回答准确率。
author: vendor
category: data
tags:
- data
- vendor
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://mcp-server-global.comein.cn/mcp-servers/mcp-server-brm/mcp
  auth: oauth
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 60
security:
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
homepage: https://mcp-server-global.comein.cn
examples:
- 查询整理最近两周A股算力行业行情和市场观点及分歧
- 生成一份存储行业的边际变化报告
- 对比内外资机构对美联储最新议息会议的解读与市场预期，分析其对科技股走势和估值的潜在影响
- 回测低估值、高ROE因子在沪深300成分股中的历史表现
- 生成一份券商风格的早参日报，汇总隔夜市场表现、重要财经事件、机构观点和今日投资线索，并于每日8点30分定时生成
