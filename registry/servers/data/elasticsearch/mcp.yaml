# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: elasticsearch
display_name: elasticsearch-mcp-server
display_name_en: elasticsearch-mcp-server
version: 0.1.0
description: MCP Server for interacting with Elasticsearch and OpenSearch
description_zh: 提供 Elasticsearch 交互的 MCP 服务器实现。
author: cr7258
homepage: https://github.com/cr7258/elasticsearch-mcp-server
repository: https://github.com/cr7258/elasticsearch-mcp-server
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - elasticsearch-mcp-server==2.1.6
  env:
    DEFAULT_CLUSTER: prod
  requires:
    python: '>=3.10'
requires_env:
- name: ELASTICSEARCH_CLUSTERS
  description: elasticsearch-mcp-server 的配置项（ELASTICSEARCH_CLUSTERS），获取方式见项目说明。
  prompt: 请输入 ELASTICSEARCH_CLUSTERS
  secret: false
  required: true
  doc_url: https://github.com/cr7258/elasticsearch-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
