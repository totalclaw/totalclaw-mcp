# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-27：包启动时自检要求 Node ≥22.23.4（低于即退出），requires.node 由 >=18 改为 >=22.23.4，agent 安装时会据此提示升级 Node。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: confluent
display_name: mcp-confluent
display_name_en: mcp-confluent
version: 0.1.2
description: Confluent MCP Server
description_zh: Confluent 集成，与 Confluent Kafka 和 Confluent Cloud REST API 交互。
author: confluentinc
license: MIT
homepage: https://github.com/confluentinc/mcp-confluent
repository: https://github.com/confluentinc/mcp-confluent
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@confluentinc/mcp-confluent@1.6.1'
  - --init-config
  requires:
    node: '>=22.23.4'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
