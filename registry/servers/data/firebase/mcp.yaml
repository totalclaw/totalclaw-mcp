# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: firebase
display_name: firebase-mcp
display_name_en: firebase-mcp
version: 0.1.0
description: Firebase MCP server for interacting with Firebase services through the Model Context Protocol
description_zh: Firebase 服务，包括 Auth、Firestore 和 Storage。
author: gannonh
license: MIT
homepage: https://github.com/gannonh/firebase-mcp
repository: https://github.com/gannonh/firebase-mcp
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@gannonh/firebase-mcp@1.4.9'
  requires:
    node: '>=18'
requires_env:
- name: SERVICE_ACCOUNT_KEY_PATH
  description: firebase-mcp 的路径（SERVICE_ACCOUNT_KEY_PATH），获取方式见项目说明。
  prompt: 请输入 SERVICE_ACCOUNT_KEY_PATH
  secret: false
  required: true
  doc_url: https://github.com/gannonh/firebase-mcp
  doc_label: 查看项目说明（如何获取）
- name: FIREBASE_STORAGE_BUCKET
  description: firebase-mcp 的服务地址（FIREBASE_STORAGE_BUCKET），获取方式见项目说明。
  prompt: 请输入 FIREBASE_STORAGE_BUCKET
  secret: false
  required: true
  doc_url: https://github.com/gannonh/firebase-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
