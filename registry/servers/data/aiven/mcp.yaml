# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: aiven
display_name: Aiven
display_name_en: Aiven
version: 0.1.2
description: MCP server for Aiven cloud data platform - manage PostgreSQL, Kafka, and other services
description_zh: Aiven 官方集成，导航 Aiven 项目，与 PostgreSQL®, Kafka®, ClickHouse®, OpenSearch® 服务交互。
author: Aiven-Open
license: Apache-2.0
homepage: https://github.com/Aiven-Open/mcp-aiven
repository: https://github.com/Aiven-Open/mcp-aiven
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - mcp-aiven@1.20.0
  requires:
    node: '>=18'
requires_env:
- name: AIVEN_TOKEN
  description: Aiven 的访问令牌（AIVEN_TOKEN），获取方式见项目说明。
  prompt: 请输入 AIVEN_TOKEN
  secret: true
  required: true
  doc_url: https://github.com/Aiven-Open/mcp-aiven
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
