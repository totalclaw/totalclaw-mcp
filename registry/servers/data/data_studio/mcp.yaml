manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: data_studio
display_name: Data Studio Agent
display_name_en: Data Studio Agent
version: 0.1.0
description: Unified MCP server for SQL (PostgreSQL, MySQL, SQL Server, SQLite) and NoSQL (Elasticsearch, MongoDB, DynamoDB)
  — powered by dockit and sqlkit desktop apps
description_zh: 统一数据库 MCP 服务器，让 AI 编码代理（Claude Code / Cursor / OpenCode / Codex）通过 DocKit/SqlKit 直接访问数据库：覆盖 70+ SQL 数据库（PostgreSQL、MySQL、SQL
  Server、SQLite、ClickHouse 等）与 NoSQL（Elasticsearch、MongoDB、DynamoDB）。本地优先，凭据不出本机，默认只读。
author: geek-fun
license: Apache-2.0
homepage: https://github.com/geek-fun/data-studio-agent
repository: https://github.com/geek-fun/data-studio-agent
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@geek-fun/data-studio-mcp@0.1.12'
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
