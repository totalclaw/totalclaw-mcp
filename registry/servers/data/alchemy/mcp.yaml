# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: alchemy
display_name: mcp-alchemy
display_name_en: mcp-alchemy
version: 0.1.1
description: A MCP server that connects to your database
description_zh: 通用 SQLAlchemy 数据库集成，支持 PG, MySQL, MariaDB, SQLite, Oracle, MS SQL Server 等。含模式/关系检查和大数据集分析能力。
author: runekaagaard
license: MPL-2.0
homepage: https://github.com/runekaagaard/mcp-alchemy
repository: https://github.com/runekaagaard/mcp-alchemy
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --from
  - mcp-alchemy==2026.10.15.202659
  - --refresh-package
  - mcp-alchemy
  - mcp-alchemy
  requires:
    python: '>=3.10'
requires_env:
- name: DB_URL
  description: mcp-alchemy 的服务地址（DB_URL），获取方式见项目说明。
  prompt: 请输入 DB_URL
  secret: false
  required: true
  doc_url: https://github.com/runekaagaard/mcp-alchemy
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
