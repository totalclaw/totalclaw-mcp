manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: kordoc
display_name: kordoc
display_name_en: kordoc
version: 0.1.0
description: Parse Korean documents (HWP3-5, HWPX, HWPML, PDF, XLS(X), DOCX) to Markdown — CLI + MCP server with lossless
  patch/roundtrip, form-filler, document diff, print & layout-preserving SVG renderer
description_zh: 韩国文档解析库、CLI 与 MCP 服务器：将 HWP 3.x/5.x、HWPX、HWPML 以及 PDF、DOCX、XLSX、PPTX 和图片转换为 Markdown 与结构化数据，并支持表单填写、保留格式的文档修改、文档对比和公文样式
  HWPX 生成。
author: chrisryugj
license: MIT
homepage: https://github.com/chrisryugj/kordoc
repository: https://github.com/chrisryugj/kordoc
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - kordoc@4.24.14
  requires:
    node: '>=18'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
