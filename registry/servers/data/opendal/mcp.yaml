# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: opendal
display_name: mcp-server-opendal
display_name_en: mcp-server-opendal
version: 0.1.2
description: A Model Context Protocol server providing tools to access storage services for usage by LLMs
description_zh: 使用 Apache OpenDAL™ 访问任何存储。
author: Xuanwo
license: Apache-2.0
homepage: https://github.com/Xuanwo/mcp-server-opendal
repository: https://github.com/Xuanwo/mcp-server-opendal
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-server-opendal==0.2.0
  requires:
    python: '>=3.10'
requires_env:
- name: YOUR_ENV_VAR
  description: mcp-server-opendal 的配置项（YOUR_ENV_VAR），获取方式见项目说明。
  prompt: 请输入 YOUR_ENV_VAR
  secret: false
  required: true
  doc_url: https://github.com/Xuanwo/mcp-server-opendal
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
