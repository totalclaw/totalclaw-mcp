# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
# 2026-11-26：补齐启动必需的凭据 / 参数声明（以前写 requires_env: []，装上即报缺变量退出）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: adbpg
display_name: Alibaba Cloud AnalyticDB for PostgreSQL
display_name_en: Alibaba Cloud AnalyticDB for PostgreSQL
version: 0.1.3
description: AnalyticDB PostgreSQL MCP Server serves as a universal interface between AI Agents and AnalyticDB PostgreSQL
  databases. It enables seamless communication between AI Agents and AnalyticDB PostgreSQL, helping AI Agents retrieve database
  metadata and execute SQL operations.
description_zh: 阿里云 AnalyticDB for PostgreSQL 官方集成，连接 AnalyticDB for PostgreSQL 实例，查询和分析数据。
author: aliyun
license: Apache-2.0
homepage: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
repository: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - adbpg-mcp-server==2.0.3
  requires:
    python: '>=3.10'
requires_env:
- name: ADBPG_HOST
  description: AnalyticDB PostgreSQL 实例的连接地址（控制台 → 数据库连接）。
  prompt: 请输入 ADBPG 连接地址
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: ADBPG_PORT
  description: 连接端口，默认 5432。
  prompt: 请输入 ADBPG 端口
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: ADBPG_USER
  description: 数据库账号。
  prompt: 请输入 ADBPG 数据库账号
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: ADBPG_PASSWORD
  description: 数据库账号的密码。
  prompt: 请输入 ADBPG 数据库密码
  secret: true
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: ADBPG_DATABASE
  description: 要连接的数据库名。
  prompt: 请输入 ADBPG 数据库名
  secret: false
  required: true
  doc_url: https://github.com/aliyun/alibabacloud-adbpg-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
