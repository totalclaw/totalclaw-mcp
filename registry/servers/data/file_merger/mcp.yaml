# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: file_merger
display_name: mcp-file-merger
display_name_en: mcp-file-merger
version: 0.1.1
description: MCP server for merging multiple files into one
description_zh: 文件合并工具，适用于 AI 聊天长度限制。
author: exoticknight
license: MIT
homepage: https://github.com/exoticknight/mcp-file-merger
repository: https://github.com/exoticknight/mcp-file-merger
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@exoticknight/mcp-file-merger@1.0.1'
  - ${MCP_FILE_MERGER_PATH}
  requires:
    node: '>=18'
requires_env:
- name: PATH
  env_key: MCP_FILE_MERGER_PATH
  description: mcp-file-merger 的启动参数，示例：/path/to/allowed/dir
  prompt: 请输入 PATH
  secret: false
  required: true
  doc_url: https://github.com/exoticknight/mcp-file-merger
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
