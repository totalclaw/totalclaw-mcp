name: opik
display_name: Comet Opik
display_name_en: Comet Opik
version: 0.1.3
description: Model Context Protocol server for Opik (Comet's LLM observability platform).
description_zh: Comet 官方集成，用自然语言查询和分析 Opik 日志、追踪、提示等 LLM 遥测数据。
author: comet-ml
license: Apache-2.0
homepage: https://github.com/comet-ml/opik-mcp
repository: https://github.com/comet-ml/opik-mcp
verified: true
category: data
tags:
- data
- community
kind: mcp_server
