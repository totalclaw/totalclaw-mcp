# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: mindmap
display_name: Mindmap
display_name_en: Mindmap
version: 0.1.1
description: MCP server for converting Markdown to mindmaps
description_zh: 从包含 Markdown 代码的输入生成美观的交互式思维导图。
author: YuChenSSR
license: MIT
homepage: https://github.com/YuChenSSR/mindmap-mcp-server
repository: https://github.com/YuChenSSR/mindmap-mcp-server
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mindmap-mcp-server==0.1.1
  - --return-type
  - html
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
