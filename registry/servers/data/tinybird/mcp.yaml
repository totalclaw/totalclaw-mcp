# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
# 2026-11-26：补齐启动必需的凭据 / 参数声明（以前写 requires_env: []，装上即报缺变量退出）。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tinybird
display_name: Tinybird
display_name_en: Tinybird
version: 0.1.3
description: An MCP server to interact with a Tinybird Workspace from any MCP client.
description_zh: Tinybird 官方集成，与 Tinybird 无服务器 ClickHouse 平台交互 (查询和 API 能力)。
author: tinybirdco
license: Apache-2.0
homepage: https://github.com/tinybirdco/mcp-tinybird
repository: https://github.com/tinybirdco/mcp-tinybird
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - mcp-tinybird==1.0.3
  requires:
    python: '>=3.10'
requires_env:
- name: TB_API_URL
  description: Tinybird 工作区所在区域的 API 地址，如 https://api.tinybird.co（在工作区设置里查看）。
  prompt: 请输入 Tinybird API 地址
  secret: false
  required: true
  doc_url: https://github.com/tinybirdco/mcp-tinybird
  doc_label: 查看项目说明（如何获取）
- name: TB_ADMIN_TOKEN
  description: Tinybird 工作区的 admin token：工作区 → Tokens 里复制。
  prompt: 请输入 Tinybird admin token
  secret: true
  required: true
  doc_url: https://github.com/tinybirdco/mcp-tinybird
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
