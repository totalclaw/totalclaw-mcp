# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: timeplus
display_name: mcp-timeplus
display_name_en: mcp-timeplus
version: 0.1.0
description: An MCP server for Timeplus.
description_zh: Apache Kafka 和 Timeplus 的 MCP 服务器。能列出 Kafka 主题、轮询消息、本地保存数据并通过 Timeplus 用 SQL 查询流数据。
author: jovezhong
homepage: https://github.com/jovezhong/mcp-timeplus
repository: https://github.com/jovezhong/mcp-timeplus
verified: false
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - mcp-timeplus==0.1.6
  env:
    TIMEPLUS_SECURE: 'false'
    TIMEPLUS_VERIFY: 'true'
    TIMEPLUS_CONNECT_TIMEOUT: '30'
    TIMEPLUS_SEND_RECEIVE_TIMEOUT: '30'
    TIMEPLUS_READ_ONLY: 'false'
    TIMEPLUS_KAFKA_CONFIG: '{"bootstrap.servers":"a.aivencloud.com:28864", "sasl.mechanism":"SCRAM-SHA-256","sasl.username":"avnadmin",
      "sasl.password":"thePassword","security.protocol":"SASL_SSL","enable.ssl.certificate.verification":"false"}'
  requires:
    python: '>=3.10'
requires_env:
- name: TIMEPLUS_HOST
  description: mcp-timeplus 的主机地址（TIMEPLUS_HOST），获取方式见项目说明。
  prompt: 请输入 TIMEPLUS_HOST
  secret: false
  required: true
  doc_url: https://github.com/jovezhong/mcp-timeplus
  doc_label: 查看项目说明（如何获取）
- name: TIMEPLUS_PORT
  description: mcp-timeplus 的端口（TIMEPLUS_PORT），获取方式见项目说明。
  prompt: 请输入 TIMEPLUS_PORT
  secret: false
  required: true
  doc_url: https://github.com/jovezhong/mcp-timeplus
  doc_label: 查看项目说明（如何获取）
- name: TIMEPLUS_USER
  description: mcp-timeplus 的用户名（TIMEPLUS_USER），获取方式见项目说明。
  prompt: 请输入 TIMEPLUS_USER
  secret: false
  required: true
  doc_url: https://github.com/jovezhong/mcp-timeplus
  doc_label: 查看项目说明（如何获取）
- name: TIMEPLUS_PASSWORD
  description: mcp-timeplus 的密码（TIMEPLUS_PASSWORD），获取方式见项目说明。
  prompt: 请输入 TIMEPLUS_PASSWORD
  secret: true
  required: true
  doc_url: https://github.com/jovezhong/mcp-timeplus
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
