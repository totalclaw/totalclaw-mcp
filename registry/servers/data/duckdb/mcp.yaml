# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；2026-11-01 静态审核：通过（详见 docs/review-2026-11-01.md）
# 人工修改后请同步递增 version。
# 2026-11-26：uvx 前置 `--with mcp<2` —— 包按 mcp 1.x 写（FastMCP / 低层装饰器 / McpError），依赖未声明上界，裸 uvx 解析到 mcp 2.x 后启动即崩。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: duckdb
display_name: mcp-server-duckdb
display_name_en: mcp-server-duckdb
version: 0.1.2
description: A DuckDB MCP server
description_zh: DuckDB 数据库集成，具有模式检查和查询能力。
author: ktanaka101
license: MIT
homepage: https://github.com/ktanaka101/mcp-server-duckdb
repository: https://github.com/ktanaka101/mcp-server-duckdb
verified: true
category: data
tags:
- data
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - --with
  - mcp<2
  - mcp-server-duckdb==1.1.0
  - --db-path
  - ${MCP_DUCKDB_DB_PATH}
  requires:
    python: '>=3.10'
requires_env:
- name: DB_PATH
  env_key: MCP_DUCKDB_DB_PATH
  description: mcp-server-duckdb 的启动参数（--db-path），示例：~/mcp-server-duckdb/data/data.db
  prompt: 请输入 DB_PATH
  secret: false
  required: true
  doc_url: https://github.com/ktanaka101/mcp-server-duckdb
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: allow
  osv: clean
