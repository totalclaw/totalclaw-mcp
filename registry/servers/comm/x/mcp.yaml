manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: x
display_name: X (Twitter) (by vidhupv)
display_name_en: X (Twitter) (by vidhupv)
version: 0.1.1
description: A server to create drafts of X(twitter) posts, threads using LLMs and post directly from the chat.
description_zh: 直接通过 Claude 创建、管理和发布 X/Twitter 推文。
author: vidhupv
license: MIT
homepage: https://github.com/vidhupv/x-mcp
repository: https://github.com/vidhupv/x-mcp
verified: false
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: uvx
  type: stdio
  launcher: uvx
  command: uvx
  args:
  - x-mcp==0.1.0
  requires:
    python: '>=3.10'
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 120
security:
  scan_verdict: warn
  osv: clean
