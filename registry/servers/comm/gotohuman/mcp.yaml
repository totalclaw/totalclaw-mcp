# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: gotohuman
display_name: gotoHuman
display_name_en: gotoHuman
version: 0.1.0
description: MCP server for requesting human approvals with gotoHuman
description_zh: gotoHuman 官方集成，允许 AI 代理和自动化向人类发送请求以供批准。
author: gotohuman
license: MIT
homepage: https://github.com/gotohuman/gotohuman-mcp-server
repository: https://github.com/gotohuman/gotohuman-mcp-server
verified: false
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@gotohuman/mcp-server@0.2.2'
  requires:
    node: '>=18'
requires_env:
- name: GOTOHUMAN_API_KEY
  description: gotoHuman 的API 密钥（GOTOHUMAN_API_KEY），获取方式见项目说明。
  prompt: 请输入 GOTOHUMAN_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/gotohuman/gotohuman-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
