name: juzpost_cli
display_name: JuzPost
display_name_en: JuzPost
version: 0.1.1
description: Social media scheduling from the terminal — schedule & auto-post short-form videos to TikTok, YouTube Shorts
  & Instagram. A fast, scriptable CLI social media scheduler.
description_zh: 社交媒体排程与发布平台的官方 MCP：起草帖子、上传图片或视频、排程或立即发布到 X、LinkedIn、Instagram、TikTok、YouTube、Bluesky 等账号，并按频道组自动排期。
author: juzpost
license: MIT
homepage: https://github.com/juzpost/juzpost-cli
repository: https://github.com/juzpost/juzpost-cli
verified: true
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: npx
