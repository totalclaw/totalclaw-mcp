# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: google_calendar
display_name: google-calendar-mcp
display_name_en: google-calendar-mcp
version: 0.1.0
description: Google Calendar MCP server for Claude Desktop integration with enhanced security
description_zh: 与 Google Calendar API 交互的 MCP 服务器 (TypeScript 版)。
author: takumi0706
license: MIT
homepage: https://github.com/takumi0706/google-calendar-mcp
repository: https://github.com/takumi0706/google-calendar-mcp
verified: false
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@takumi0706/google-calendar-mcp@2.0.0'
  requires:
    node: '>=18'
requires_env:
- name: GOOGLE_CLIENT_ID
  description: google-calendar-mcp 的ID（GOOGLE_CLIENT_ID），获取方式见项目说明。
  prompt: 请输入 GOOGLE_CLIENT_ID
  secret: false
  required: true
  doc_url: https://github.com/takumi0706/google-calendar-mcp
  doc_label: 查看项目说明（如何获取）
- name: GOOGLE_CLIENT_SECRET
  description: google-calendar-mcp 的密钥（GOOGLE_CLIENT_SECRET），获取方式见项目说明。
  prompt: 请输入 GOOGLE_CLIENT_SECRET
  secret: true
  required: true
  doc_url: https://github.com/takumi0706/google-calendar-mcp
  doc_label: 查看项目说明（如何获取）
optional_env:
- name: GOOGLE_REDIRECT_URI
  description: google-calendar-mcp 的路径（GOOGLE_REDIRECT_URI），不填用默认值 http://localhost:4153/oauth2callback。
  prompt: 请输入 GOOGLE_REDIRECT_URI
  secret: false
  required: false
  doc_url: https://github.com/takumi0706/google-calendar-mcp
  doc_label: 查看项目说明（如何获取）
  default: http://localhost:4153/oauth2callback
defaults:
  enabled: true
  timeout: 120
