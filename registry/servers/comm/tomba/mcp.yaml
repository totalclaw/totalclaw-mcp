# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: tomba
display_name: tomba-mcp-server
display_name_en: tomba-mcp-server
version: 0.1.0
description: MCP Server for Tomba.io API integration
description_zh: 邮箱发现、验证和数据丰富工具。可查找邮箱地址、验证可送达性、丰富联系人数据、发现作者和 LinkedIn 档案、验证手机号码并分析技术栈。
author: tomba-io
license: MIT
homepage: https://github.com/tomba-io/tomba-mcp-server
repository: https://github.com/tomba-io/tomba-mcp-server
verified: false
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@tomba-io/tomba-mcp-server@1.2.0'
  requires:
    node: '>=18'
requires_env:
- name: TOMBA_API_KEY
  description: tomba-mcp-server 的API 密钥（TOMBA_API_KEY），获取方式见项目说明。
  prompt: 请输入 TOMBA_API_KEY
  secret: true
  required: true
  doc_url: https://github.com/tomba-io/tomba-mcp-server
  doc_label: 查看项目说明（如何获取）
- name: TOMBA_SECRET_KEY
  description: tomba-mcp-server 的密钥（TOMBA_SECRET_KEY），获取方式见项目说明。
  prompt: 请输入 TOMBA_SECRET_KEY
  secret: true
  required: true
  doc_url: https://github.com/tomba-io/tomba-mcp-server
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
