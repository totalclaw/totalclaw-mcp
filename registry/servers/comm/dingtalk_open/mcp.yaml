# 由 fau-tools/mcp-import 从 厂商官方说明（人工核实） 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: dingtalk_open
display_name: 钉钉
display_name_en: ''
version: 0.1.0
description: DingTalk MCP Server - A TypeScript-based MCP server for DingTalk integration
description_zh: 钉钉官方 MCP：通讯录、部门、机器人发消息 / DING、待办、日程、签到、工作通知；需要钉钉开放平台应用的 Client ID 与 Secret。
author: open-dingtalk
license: MIT
homepage: https://github.com/open-dingtalk/dingtalk-mcp
repository: https://github.com/open-dingtalk/dingtalk-mcp
verified: false
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - dingtalk-mcp@1.1.21
  env:
    ACTIVE_PROFILES: dingtalk-contacts,dingtalk-robot-send-message
  requires:
    node: '>=18'
requires_env:
- name: DINGTALK_Client_ID
  description: 钉钉 的ID（DINGTALK_Client_ID），获取方式见项目说明。
  prompt: 请输入 DINGTALK_Client_ID
  secret: false
  required: true
  doc_url: https://github.com/open-dingtalk/dingtalk-mcp
  doc_label: 查看项目说明（如何获取）
- name: DINGTALK_Client_Secret
  description: 钉钉 的密钥（DINGTALK_Client_Secret），获取方式见项目说明。
  prompt: 请输入 DINGTALK_Client_Secret
  secret: true
  required: true
  doc_url: https://github.com/open-dingtalk/dingtalk-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
