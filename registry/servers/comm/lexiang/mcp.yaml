# 上游连接器 id: lexiang。人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: lexiang
display_name: 乐享知识库
version: 0.1.0
description: Search, create, and manage documents in your Lexiang knowledge base. Import Markdown, organize
  by tags, and keep team docs up to date.
description_zh: 搜索、创建和管理乐享知识库中的文档。支持导入 Markdown、按标签整理内容、追踪团队文档的更新动态。
author: vendor
category: comm
tags:
- comm
- vendor
kind: mcp_server
runtimes:
- id: remote
  type: http
  url: https://mcp.lexiang-app.com/mcp
  auth: none
requires_env: []
optional_env: []
defaults:
  enabled: true
  timeout: 600
security:
  scan_verdict: unscanned
  prompt_injection_findings: []
  osv: unscanned
homepage: https://mcp.lexiang-app.com
examples:
- 在乐享知识库里搜索所有包含【API 接口】的文档，返回匹配的文档标题、最后编辑时间和简要内容摘要
- 找出【技术方案】知识库里所有超过 3 个月没有更新的文档，列出文档名称和最后编辑人，我需要推动大家更新
- 把一份 Markdown 格式的【2025 年技术规划】导入到乐享，自动转换成带层级结构的知识库文档，保留代码块和表格格式
- 从乐享的【产品文档】知识库里提取所有标记为【v2.0】标签的文档，整理成一份版本文档清单，并生成目录导航
- 我要整理乐享里的所有【待办事项】相关文档，把它们统一移到【个人管理】文件夹，并更新标签分类
