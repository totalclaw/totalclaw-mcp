# 由 fau-tools/mcp-import 从 Awesome-MCP-ZH 导入（2026-10-27）；未经审核、未做安全扫描。
# 人工修改后请同步递增 version。
manifest_version: 1
requires_protocol_version: '>=1'
tested_with: '>=0.63.72'
name: telegram
display_name: telegram-mcp
display_name_en: telegram-mcp
version: 0.1.0
description: Telegram MCP server with API integration for accessing user data, managing dialogs (chats, channels, groups),
  retrieving messages, and handling read status.
description_zh: Telegram API 集成，访问用户数据、管理对话、检索消息和处理已读状态。
author: chaindead
homepage: https://github.com/chaindead/telegram-mcp
repository: https://github.com/chaindead/telegram-mcp
verified: false
category: comm
tags:
- comm
- community
kind: mcp_server
runtimes:
- id: npx
  type: stdio
  launcher: npx
  command: npx
  args:
  - -y
  - '@chaindead/telegram-mcp@0.2.0'
  requires:
    node: '>=18'
requires_env:
- name: TG_APP_ID
  description: telegram-mcp 的ID（TG_APP_ID），获取方式见项目说明。
  prompt: 请输入 TG_APP_ID
  secret: false
  required: true
  doc_url: https://github.com/chaindead/telegram-mcp
  doc_label: 查看项目说明（如何获取）
- name: TG_API_HASH
  description: telegram-mcp 的配置项（TG_API_HASH），获取方式见项目说明。
  prompt: 请输入 TG_API_HASH
  secret: false
  required: true
  doc_url: https://github.com/chaindead/telegram-mcp
  doc_label: 查看项目说明（如何获取）
optional_env: []
defaults:
  enabled: true
  timeout: 120
